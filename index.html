  bernays: {

  barnum: {
    position: "In a market of anonymous strangers, attention is the scarce resource. Spectacle, novelty, and controlled controversy generate that attention cheaply and fast. But attention drives the first transaction, not the return. Barnum proved both sides: he was a genius at filling rooms. He built no brand.",

      "Acknowledge limits without remorse. Spectacle alone does not produce lasting business. He notes this as a tactical observation, not a moral correction.",

      "As for the cry of 'humbug,' it never harmed me, and I was in the position of the actor who had much rather be roundly abused than not to be noticed at all. — Struggles & Triumphs, p. 112",

  reeves: {
    position: "Every ad must make one proposition: a concrete promise the competition cannot or does not make, strong enough to pull new customers. Sales come from penetration (who remembers your claim) times usage pull (who moves to your product because of it). A difference the consumer cannot see is worse than useless; it accelerates the product's death.",

    vocabulary: [

    quotes: [

      "ADVERTISING IS THE ART OF GETTING A UNIQUE SELLING PROPOSITION INTO THE HEADS OF THE MOST PEOPLE AT THE LOWEST POSSIBLE COST. — Reality in Advertising, p.121",
      "As your penetration goes up, your competitors' tends to go down. — Reality in Advertising, p.37",
      "Penetration is volatile. Like vapor, it can melt into thin air. — Reality in Advertising, p.27",
      "The U.S.P. is the philosophy of a claim, and the brand image is the philosophy of a feeling. — Reality in Advertising, p.79",
      "Advertising does not synthesize desires. Desires instead synthesize advertising. — Reality in Advertising, p.141"
    ],
    corrections: "Anacin was a unique combination of analgesic ingredients, not a larger dose of aspirin (Reeves says so himself, p.62). U.S.P. is not a slogan or tagline; it is a benefit proposition that is unique and strong enough to pull buyers, all three parts required (p.46-47). Uniqueness must be observable: an unseen difference harms the product (the Deceptive Differential, p.61). Reeves did not reject creativity; he subordinated it to the claim. The U.S.P. originated at Ted Bates in the early 1940s; the 1961 book formalized a practice already two decades old (p.46)."

  heath: {
    position: "Advertising builds brands not by persuading a conscious mind but by depositing emotional associations at low or zero attention, through passive and implicit learning. These associations accumulate into somatic markers that bias intuitive choice between near-identical brands. Attention is not a precondition of effect; in conditions where viewers can counter-argue, high attention can weaken what advertising builds.",

      "Lead with cognitive science (Krugman, Zajonc, Damasio, Schacter, Tulving) to establish the mechanism; validate with named brand case studies. Data and econometrics come in later journal work, not in the monograph.",
      "Attack the measurement apparatus, not just the theory: recall and persuasion-shift metrics require high attention, so the industry has assumed (without testing) that high attention equals effectiveness. Call this circular.",
      "Concede the narrow case to hold the general rule: grant that factual or tactical messages benefit from high attention; then argue most brand advertising operates via a different mechanism entirely.",
      "Argue from established mechanism to implication, not from large empirical databases to theory. The LIP/LAP model is built deductively, then illustrated.",
      "Frame the intervention as correcting a 70-year error, not proposing a marginal refinement. The chapter arc (Krugman's legacy to Predictions) signals paradigm-level ambition.",
      "Hold an accessible practitioner-academic register: no academic obscurantism, but a reading list most practitioners have never touched.",
    ],
    vocabulary: [
      "Low Involvement Processing (LIP) — original name; renamed Low Attention Processing (LAP) post-2005 to avoid US confusion with category involvement. Same construct.",
      "Passive learning — low-attention cognitive process; links brand name and ad elements but cannot change attitudes or draw conclusions.",
      "Implicit learning — fully automatic, non-cognitive; deposits durable associations without conscious engagement.",
      "Implicit memory / conceptual implicit memory — stores associations from implicit learning; operates conceptually (not just perceptually), enabling brand-choice influence.",
      "Somatic markers — Damasio's term: emotional tags accumulated by repeated low-attention exposure; bias intuitive choice without the consumer recognising the influence.",
      "Brand associations — the true output of advertising; brands exist as bundles of simple associations built by repeated low-attention exposure.",
      "Intuitive choice — dominant mode of brand selection in mature markets where functional differences are negligible.",
      "Recognition vs. recall — recognition is effortless, durable, near-inexhaustible; recall is effortful and fades. Industry reliance on recall metrics mismeasures LIP effects.",
      "CEP (Cognitive Emotive Power) — Heath's post-monograph measure for emotional brand associations formed at low attention.",
    ],
    quotes: [
      // No verified verbatim quotes. All rows in Verbatim anchors are unverified.
      // Do not populate this array until a print copy or clean OCR has been checked page by page.
    ],
    corrections: "LIP and LAP are the same model under two names; never treat them as distinct theories. The book predates Kahneman's Thinking, Fast and Slow (2011) by a decade; Heath is not applied Kahneman. LIP is explicitly described as a cognitive process, not subconscious or subliminal — the 1950s subliminal framing is a catalogue-indexing error, not Heath's claim. Low attention does not mean ads can work unseen; perception is automatic and continuous but conscious elaboration and recall are not required. The contested empirical claims (attention actively weakens brand effect; recall metrics are invalid) remain disputed; present them as Heath's position plus the Hollis/du Plessis rebuttal. Cite the monograph for theory only; cite Heath & Hyder (2005) and Heath, Brandt & Nairn (2006) for empirical support. Do not cite any body quote from the 2001 monograph without a verified page number from the print edition.",

  freud: {
    position: "The conscious account a person gives for their behaviour is a post-hoc rationalisation, not the cause. Real drivers are unconscious wishes — primarily infantile and sexual — that reach expression only in distorted form because a psychic censorship forces disguise. Every dream is the fulfilment of a wish. The interpretation of dreams is the royal road to the unconscious.",

      "Treat resistance as evidence. When an interpretation provokes strong rejection, that is confirmation it has touched something real.",

      "Frame the stakes as clinical and foundational: understanding dreams is the entry point for understanding all neurotic symptoms. The ambition is explicit from the first page.",

    vocabulary: [
      "wish-fulfilment: every dream satisfies a (usually unconscious) wish in disguised form",
      "manifest content: what the dream appears to be about; the surface text the dreamer recalls",
      "latent content: the wish concealed by dream-work; what free association uncovers",
      "dream-work: condensation, displacement, considerations of representability, secondary revision",
      "censorship: the psychic agency that polices the Ucs./Pcs. boundary; forces disguise",
      "condensation: multiple latent thoughts compressed into a single manifest element",
      "displacement: psychic emphasis shifted from the important element to something trivial",
      "secondary revision: the mind's rationalising smoothing of manifest content into apparent coherence",
      "primary process: unconscious mode — no logic, no time, no contradiction, seeks immediate discharge",
      "secondary process: conscious mode — logical, sequential, reality-oriented",
      "Ucs. / Pcs. / Cs.: the topographic model of the mind",
      "Oedipus complex: universal infantile wish to possess the opposite-sex parent and eliminate the rival",
    ],
    quotes: [
      "\"When the work of interpretation has been completed, we perceive that a dream is the fulfilment of a wish.\" — The Interpretation of Dreams, p. 126",
      "\"The interpretation of dreams is the royal road to a knowledge of the unconscious activities of the mind.\" — The Interpretation of Dreams, Chapter VII (PDF p. 582)",
      "\"One of these forces constructs the wish which is expressed by the dream, while the other exercises a censorship upon this dream-wish and, by the use of that censorship, forcibly brings about a distortion in the expression of the wish.\" — The Interpretation of Dreams, p. 145-146",
      "\"It is the fate of all of us, perhaps, to direct our first sexual impulse towards our mother and our first hatred and our first murderous wish against our father. Our dreams convince us that that is so.\" — The Interpretation of Dreams, p. 262",

  damasio: {
    position: "Feelings are not noise in the reasoning process; they are necessary signals. Body-state changes (somatic markers) pre-screen decision options before deliberation begins, reducing an unmanageable combinatorial space to one working memory can handle. Remove the emotional signal — as happens with ventromedial prefrontal damage — and practical decision-making collapses even when IQ, language, and abstract reasoning remain intact.",

    quotes: [

      "When a negative somatic marker is juxtaposed to a particular future outcome the combination functions as an alarm bell. When a positive somatic marker is juxtaposed instead, it becomes a beacon of incentive. — Damasio, p. 174 (PDF)",
      "This is Descartes' error: the abyssal separation between body and mind — Damasio, p. 238 (PDF)",
      "a most curious physiological arrangement that has turned the brain into the body's captive audience — Damasio, p. 19 (PDF)",

    corrections: "1. 'Gage was no longer Gage' is a quotation of Gage's contemporaries (relayed via Harlow), not Damasio's own phrase. 2. Somatic markers are NOT the same as skin conductance responses; the latter are measurable indices of the former. 3. Damasio does NOT say emotion is always helpful — he devotes a chapter to cases where emotional bias distorts judgment. 4. The claim is about neurological architecture, not emotional intelligence training. 5. Damasio and Kahneman are not in tension: Kahneman studies emotional bias distorting reason; Damasio studies emotional absence destroying reason. Both are right. 6. Page numbers in this dossier are PDF page numbers in the calibre-converted file, not printed book pagination; verify against physical 2005 Penguin paperback before citing.",

// Build the figure's block for the prompt. Rich block if a dossier exists,
// otherwise the bio (so un-built figures still work).
function dossierBlock(obj) {
  const d = DOSSIERS[obj.id];
  if (!d) {
    return `${obj.first} ${obj.last} (${obj.year}). ${obj.bio}`;
  }
  const parts = [
    `${obj.first} ${obj.last} (${obj.year}).`,
    `POSITION: ${d.position}`,
  ];
  if (d.howArgue && d.howArgue.length) parts.push(`HOW YOU ARGUE:\n- ${d.howArgue.join("\n- ")}`);
  if (d.vocabulary && d.vocabulary.length) parts.push(`YOUR VOCABULARY: ${d.vocabulary.join("; ")}`);
  if (d.quotes && d.quotes.length) parts.push(`YOUR OWN WORDS (use verbatim when it fits, never misattribute):\n- ${d.quotes.join("\n- ")}`);
  if (d.corrections) parts.push(`FACTS YOU MUST NOT GET WRONG: ${d.corrections}`);
  return parts.join("\n");
}

// The static debate context. Identical across every turn of one exchange, so
// it is sent as a single cached block (cache_control: ephemeral). The figure
// being spoken on a given turn is named in the per-turn user message, not
// here, so this prefix never changes mid-debate and stays a cache hit.
function debateContext(aObj, bObj) {
  const text = [
    `You are role-playing a debate between two figures from advertising history. On each turn you will be told which one you are speaking as.`,
    ``,
    `FIGURE A is ${aObj.first} ${aObj.last}.`,
    dossierBlock(aObj),
    ``,
    `FIGURE B is ${bObj.first} ${bObj.last}.`,
    dossierBlock(bObj),
    ``,
    `VOICE RULES (apply to whichever figure you are this turn):`,
    `- Speak in that figure's voice, sounding like they would actually sound.`,
    `- Practitioner register. Short declarative sentences. No hedging.`,
    `- Concrete reference to your ideas, methods, work, or examples.`,
    `- No pleasantries. No "I would argue." No academic puff. No em dashes.`,
    `- Do not summarize the topic. Speak.`,
    `- Return JSON only. No preamble. No fences. Schema: { "text": "your turn" }`,
  ].join("\n");
  return [{ type: "text", text, cache_control: { type: "ephemeral" } }];
}

  }, []);
  const slotAObj = slotA ? thinkerById[slotA] : null;
  const slotBObj = slotB ? thinkerById[slotB] : null;
  const hoveredObj = hoveredId ? thinkerById[hoveredId] : null;

  function goArrival() {
    setPhase("arrival"); setSlotA(null); setSlotB(null);

    setRoomCard(null); setRoomCardError(null); setRoundCount(1); setPriorRoomScore(null);
  }
  function goMap() { setPhase("map"); setError(null); }

  function playClick() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!window.__aoaCtx) window.__aoaCtx = new Ctx();
      const ctx = window.__aoaCtx;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const buf = ctx.createBuffer(1, 256, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1800;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + 0.06);
    } catch (e) { /* silent */ }
  }

  function tapStation(id) {
    const t = thinkerById[id];
    if (!t || t.kind) return;
    if (id === slotA) { setSlotA(null); return; }
    if (id === slotB) { setSlotB(null); return; }
    if (!slotA) { playClick(); setSlotA(id); return; }
    if (!slotB) { playClick(); setSlotB(id); return; }
    setSlotA(slotB); setSlotB(id);
  }

  function warmStart(idA, idB, topicStr, contextStr) {
    setSlotA(idA); setSlotB(idB); setTopic(topicStr);
    setStarterContext(contextStr || null);
    setPhase("composition");
  }

  function goExchangeFromComposition() {
    if (!slotAObj || !slotBObj) return;
    setPhase("exchange");
    runExchange(topic);
  }

  function changeRoom() {
    setExchange(null); setVisibleTurns(0); setError(null);
    setFollowUpFor(null); setFollowUpText("");
    setPhase("composition");
  }

  function exportToMarkdown() {
    if (!exchange || !slotAObj || !slotBObj) return;
    const lines = [];
    lines.push(`# ${slotAObj.first} ${slotAObj.last} & ${slotBObj.first} ${slotBObj.last}`);
    lines.push("");
    lines.push(`*${exchange.topic}*`);
    lines.push("");
    if (exchange.context) {
      lines.push(`> ${exchange.context}`);
      lines.push("");
    }
    lines.push("---");
    lines.push("");
    exchange.turns.forEach(turn => {
      if (turn.speaker === "host") {
        lines.push(`**Host, to ${turn.target}**`);
        lines.push("");
        lines.push(`*${turn.text}*`);
      } else {
        const speaker = turn.speaker === "A" ? slotAObj : slotBObj;
        lines.push(`**${speaker.first} ${speaker.last}** (${speaker.year}) · ${TRADITIONS[speaker.tradition].label}`);
        lines.push("");
        lines.push(turn.text);
      }
      lines.push("");
    });
    lines.push("---");
    lines.push("");
    lines.push("*Reconstructions. Positions drawn from published work, voices approximated. Informed pastiche, not direct quotation.*");
    lines.push("");
    lines.push("From The Anatomy of Advertising — a graduate-level course in advertising theory and history.");
    const md = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(() => {
        setExportFeedback("Copied to clipboard");
        setTimeout(() => setExportFeedback(null), 2400);
      }).catch(() => {
        setExportFeedback("Copy failed — try again");
        setTimeout(() => setExportFeedback(null), 2400);
      });
    } else {
      setExportFeedback("Clipboard not available in this browser");
      setTimeout(() => setExportFeedback(null), 2400);
    }
  }

  async function callClaude(prompt, maxTokens = 1500, model = "claude-sonnet-4-6", system = null) {
    const res = await fetch("/api/claude", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model: model,
        max_tokens: maxTokens,
        messages:[{ role:"user", content: prompt }],
        ...(system ? { system } : {}),
      }),
    });
    if (res.status === 429) {
      let body = {};
      try { body = await res.json(); } catch {}
      const err = new Error(body.message || "The reading room is full for today.");
      err.code = body.error || "rate_limited";
      err.userMessage = body.message;
      throw err;
    }
    if (!res.ok) {
      let body = {};
      try { body = await res.json(); } catch {}
      throw new Error(body.error || `Server error ${res.status}`);
    }
    const data = await res.json();
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    let clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    // Prefer a JSON object if the model returned one, even wrapped in prose.
    const firstBrace = clean.indexOf("{");
    const lastBrace = clean.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      try { return JSON.parse(clean.slice(firstBrace, lastBrace + 1)); }
      catch (e) { /* fall through to prose handling below */ }
    }
    // No parseable JSON. The model returned prose, sometimes led by a stage
    // direction like *leans forward*. Strip those and return it as a turn body
    // so a single non-JSON reply does not abort the whole exchange.
    let body = clean.replace(/\*[^*\n]+\*/g, "");
    body = body.replace(/^[\s*"'`]+|[\s*"'`]+$/g, "");
    body = body.replace(/[ \t]{2,}/g, " ").trim();
    return { text: body || clean };
  }

  function transcriptText(turns, aObj, bObj) {
    return turns.map(t => {
      if (t.speaker === "host") return `HOST (to ${t.target}): ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `${who.toUpperCase()}: ${t.text}`;
    }).join("\n\n");
  }

  async function generateTurn({ speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;
    const prior = transcriptText(priorTurns, aObj, bObj);

    // Static across every turn of this exchange -> cached prefix.
    const system = debateContext(aObj, bObj);

    const openingInstruction = isOpening
      ? `You are opening the exchange. Stake out your position on the topic in 2 to 3 sentences. Make a claim concrete enough that ${opponent.last} can disagree with it.`
      : `Respond directly to what ${opponent.last} just said. Engage with their specific claim. Concede what you must. Hold what you can. 2 to 4 sentences.`;

    // Dynamic only -> sits after the cache breakpoint.
    const prompt = `TOPIC: ${topic}

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}You are now speaking as ${speaker.first} ${speaker.last}.

${openingInstruction}`;

    const result = await callClaude(prompt, 600, "claude-sonnet-4-6", system);
    return { speaker: speakerKey, text: result.text };
  }

  async function refereeAndMaybeRegenerate({ turn, speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    if (isOpening || priorTurns.length === 0) return turn;
    const lastOpponentTurn = [...priorTurns].reverse().find(t => t.speaker !== speakerKey && t.speaker !== "host");
    if (!lastOpponentTurn) return turn;

    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;

    const refPrompt = `You are a debate referee. Score whether the response below actually engages with what was just said, or whether it monologues past it.

WHAT ${opponent.last.toUpperCase()} SAID:
${lastOpponentTurn.text}

WHAT ${speaker.last.toUpperCase()} REPLIED:
${turn.text}

Score on these:
1. Does the reply name something specific from the prior turn (a claim, an example, a word)?
2. Does the reply respond to that thing, rather than restating its own position?

Return JSON only. Schema:
{ "engages": true | false, "reason": "one short sentence" }`;

    try {
      const verdict = await callClaude(refPrompt, 200, "claude-haiku-4-5-20251001");
      if (verdict.engages) return turn;

      const prior = transcriptText(priorTurns, aObj, bObj);
      const system = debateContext(aObj, bObj);
      const fixPrompt = `TOPIC: ${topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${speaker.first} ${speaker.last}.

You must respond to ${opponent.last}'s most recent point directly. Quote a phrase from it. Disagree with it specifically. Do not restate your existing position. Do not change the subject. 2 to 4 sentences.`;

      const fixed = await callClaude(fixPrompt, 600, "claude-sonnet-4-6", system);
      return { speaker: speakerKey, text: fixed.text };
    } catch (e) {
      return turn;
    }
  }

  async function evaluateExchange(turnsArg, aObj, bObj, topic, opts = {}) {
    const transcript = turnsArg.map((t, i) => {
      if (t.speaker === "host") return `[host, to ${t.target}]: ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `[turn ${i+1}] ${who}: ${t.text}`;
    }).join("\n\n");

    const prompt = `You are a referee scoring a simulated debate between two figures from advertising history. The simulation is a reconstruction, not direct quotation. Your job is to score two things, in editorial register.

FIGURE A: ${aObj.first} ${aObj.last} (${aObj.year})
A's documented position and work: ${aObj.bio}

FIGURE B: ${bObj.first} ${bObj.last} (${bObj.year})
B's documented position and work: ${bObj.bio}

TOPIC: ${topic}

TRANSCRIPT:
${transcript}

SCORE ONE — ROOM SCORE (0-100). How well did this function as a real argument? Score five dimensions, each 0-20:
- engagement: Did each turn respond to the prior turn, or monologue past it?
- specificity: Did each speaker reference their own work concretely, or stay abstract?
- concession: Did either speaker grant a real point, or did they hold their position untouched?
- escalation: Did the argument get sharper across turns, or did it flatten?
- productiveness: Did the exchange surface real intellectual ground, or rehash known positions?
Sum the five for the Room Score.

SCORE TWO — VOICE FIDELITY (0-100 per figure). How close did the reconstruction sit to the documented record for each figure? For each speaker, evaluate:
- Did they reference something concrete from their actual work, methods, or examples?
- Did the register match their period and idiom?
- Were factual claims consistent with what they actually published?
Score each figure 0-100 independently. Tier-three figures with limited firsthand record will score lower. That is correct and surfaces the disclaimer.

MOVE OF THE ROUND: Identify the single sharpest turn in the exchange. Give the turn number, the speaker (A or B), and one sentence on why it landed. Quote a phrase under 12 words from the turn itself.

OPEN GROUND: For each figure, in one sentence, what does their position need to address that this exchange did not? This is the pedagogical payload. Specific. Not generic.

Return JSON only. No preamble. No fences. Schema:
{
  "roomScore": number,
  "rubric": {
    "engagement": number,
    "specificity": number,
    "concession": number,
    "escalation": number,
    "productiveness": number
  },
  "roomNote": "one short editorial sentence summarizing the exchange",
  "voiceFidelityA": number,
  "voiceFidelityB": number,
  "voiceNoteA": "one short note on A's reconstruction",
  "voiceNoteB": "one short note on B's reconstruction",
  "moveOfRound": {
    "turnIndex": number,
    "speaker": "A or B (one letter)",
    "quote": "phrase from that turn, under 12 words",
    "reason": "one sentence on why it landed"
  },
  "openGroundA": "one sentence on what A needs to address",
  "openGroundB": "one sentence on what B needs to address"
}`;

    const result = await callClaude(prompt, 1200);
    return result;
  }

  async function scoreCurrentExchange(turnsArg, aObj, bObj, topic) {
    if (!turnsArg || turnsArg.length < 4) return;
    setScoringInFlight(true);
    setRoomCardError(null);
    try {
      const card = await evaluateExchange(turnsArg, aObj, bObj, topic);
      setRoomCard(card);
    } catch (e) {
      console.error("Scoring failed:", e);
      setRoomCardError(e.userMessage || e.message || "Scoring the exchange failed. The turns are above. Try Continue or Push back.");
    } finally {
      setScoringInFlight(false);
    }
  }

  async function runExchange(topicArg) {
    if (!slotAObj || !slotBObj) return;
    setError(null); setExchange(null); setVisibleTurns(0);
    setRoomCard(null); setRoomCardError(null); setPriorRoomScore(null); setRoundCount(1);
    const usedTopic = (topicArg || "").trim();

    setLoadingText(`${slotAObj.last} and ${slotBObj.last} are taking their seats.`);
    let topicPhrase = usedTopic;
    if (!topicPhrase) {
      try {
        const t = await callClaude(`Two figures from advertising history are about to debate. Pick the single most productive disagreement between them. State it as a short editorial phrase, lower-case unless proper noun, no closing punctuation.

A: ${slotAObj.first} ${slotAObj.last}. ${slotAObj.bio}
B: ${slotBObj.first} ${slotBObj.last}. ${slotBObj.bio}

Return JSON only. Schema: { "topic": "the topic" }`, 200, "claude-haiku-4-5-20251001");
        topicPhrase = t.topic || "their most productive disagreement";
      } catch (e) {
        topicPhrase = "their most productive disagreement";
      }
    }

    const turns = [];
    const speakers = ["A", "B", "A", "B", "A", "B"];
    const initial = {
      topic: topicPhrase,
      turns: [],
      ...(starterContext ? { context: starterContext } : {}),
    };
    setExchange(initial);

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speakerName = speakerKey === "A" ? slotAObj.last : slotBObj.last;
        const opponentName = speakerKey === "A" ? slotBObj.last : slotAObj.last;
        setLoadingText(
          i === 0
            ? `${speakerName} is opening.`
            : `${speakerName} is responding to what ${opponentName} just said.`
        );

        let turn = await generateTurn({
          speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: topicPhrase,
          priorTurns: turns,
          isOpening: i === 0,
        });

        if (i > 0) {
          setLoadingText(`Checking that ${speakerName} actually responded.`);
          turn = await refereeAndMaybeRegenerate({
            turn, speakerKey,
            aObj: slotAObj, bObj: slotBObj,
            topic: topicPhrase,
            priorTurns: turns,
            isOpening: false,
          });
        }

        turns.push(turn);
        setExchange({ ...initial, turns: [...turns] });
        setVisibleTurns(turns.length);
      }
      setLoadingText(null);
      scoreCurrentExchange(turns, slotAObj, slotBObj, topicPhrase);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The room could not be set. Try again.");
      setLoadingText(null);
    }
  }

  async function pushHarder() {
    if (!exchange || !roomCard || !slotAObj || !slotBObj) return;
    setPriorRoomScore(roomCard.roomScore);
    setRoundCount(r => r + 1);
    setError(null);

    const topicPhrase = exchange.topic;
    setExchange(null); setVisibleTurns(0);
    const newInitial = {
      topic: topicPhrase,
      turns: [],
      ...(starterContext ? { context: starterContext } : {}),
      pressure: {
        priorRoomScore: roomCard.roomScore,
        openGroundA: roomCard.openGroundA,
        openGroundB: roomCard.openGroundB,
      },
    };
    setExchange(newInitial);
    setRoomCard(null); setRoomCardError(null);

    const turns = [];
    const speakers = ["A", "B", "A", "B", "A", "B"];

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speaker = speakerKey === "A" ? slotAObj : slotBObj;
        const opponent = speakerKey === "A" ? slotBObj : slotAObj;
        const speakerOpenGround = speakerKey === "A" ? roomCard.openGroundA : roomCard.openGroundB;
        setLoadingText(
          i === 0
            ? `${speaker.last} is opening, with the prior round's pressure.`
            : `${speaker.last} is responding to ${opponent.last}.`
        );

        const prior = transcriptText(turns, slotAObj, slotBObj);
        const isOpening = i === 0;
        const constraint = isOpening
          ? `OPEN with a position that directly addresses what the prior round revealed you needed to address: "${speakerOpenGround}". Do not rehash your stock position. Engage the open ground.`
          : `Respond to ${opponent.last}'s last turn. Where relevant, address the open ground from the prior round: "${speakerOpenGround}".`;

        const system = debateContext(slotAObj, slotBObj);
        const turnPrompt = `TOPIC: ${topicPhrase}

PRIOR ROUND'S PRESSURE: This is round ${roundCount + 1} on this topic. The prior round scored ${roomCard.roomScore}/100. The referee's note for you: "${speakerOpenGround}"

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}You are now speaking as ${speaker.first} ${speaker.last}.

${constraint}`;

        const result = await callClaude(turnPrompt, 700, "claude-sonnet-4-6", system);
        let turn = { speaker: speakerKey, text: result.text };

        if (i > 0) {
          setLoadingText(`Checking that ${speaker.last} actually responded.`);
          turn = await refereeAndMaybeRegenerate({
            turn, speakerKey,
            aObj: slotAObj, bObj: slotBObj,
            topic: topicPhrase,
            priorTurns: turns,
            isOpening: false,
          });
        }

        turns.push(turn);
        setExchange({ ...newInitial, turns: [...turns] });
        setVisibleTurns(turns.length);
      }
      setLoadingText(null);
      scoreCurrentExchange(turns, slotAObj, slotBObj, topicPhrase);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The next round could not be set. Try again.");
      setLoadingText(null);
    }
  }

  function newQuestionSamePair() {
    setExchange(null); setVisibleTurns(0); setRoomCard(null); setRoomCardError(null);
    setRoundCount(1); setPriorRoomScore(null);
    setTopic(""); setStarterContext(null);
    setPhase("composition");
  }

  async function continueExchange() {
    if (!exchange || !slotAObj || !slotBObj) return;
    setError(null);

    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const startKey = lastNonHost.speaker === "A" ? "B" : "A";
    const speakers = [startKey, startKey === "A" ? "B" : "A", startKey, startKey === "A" ? "B" : "A"];
    let working = [...exchange.turns];

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speakerName = speakerKey === "A" ? slotAObj.last : slotBObj.last;
        const opponentName = speakerKey === "A" ? slotBObj.last : slotAObj.last;
        setLoadingText(`${speakerName} is responding to ${opponentName}.`);

        let turn = await generateTurn({
          speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        setLoadingText(`Checking that ${speakerName} actually responded.`);
        turn = await refereeAndMaybeRegenerate({
          turn, speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        working = [...working, turn];
        setExchange({ ...exchange, turns: working });
        setVisibleTurns(working.length);
      }
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The exchange could not continue. Try again.");
      setLoadingText(null);
    }
  }

  async function pushBack() {
    if (!exchange || !slotAObj || !slotBObj) return;
    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const challengerKey = lastNonHost.speaker === "A" ? "B" : "A";
    const defenderKey = lastNonHost.speaker;
    const challengerName = challengerKey === "A" ? slotAObj.last : slotBObj.last;
    const defenderName = defenderKey === "A" ? slotAObj.last : slotBObj.last;
    const challenger = challengerKey === "A" ? slotAObj : slotBObj;
    const defender = defenderKey === "A" ? slotAObj : slotBObj;
    setError(null);

    let working = [...exchange.turns];

    try {
      setLoadingText(`${challengerName} is pushing back on ${defenderName}.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const system = debateContext(slotAObj, slotBObj);
      const challengePrompt = `TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${challenger.first} ${challenger.last}. The host wants you to push back hard on what ${defenderName} just said.

Push back. Name the weakness in ${defenderName}'s last point. Quote a phrase from it if you must. Be sharp, not rude. 2 to 4 sentences.`;

      const challengeResult = await callClaude(challengePrompt, 600, "claude-sonnet-4-6", system);
      const challengeTurn = { speaker: challengerKey, text: challengeResult.text };
      working = [...working, challengeTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${defenderName} is defending.`);
      let defendTurn = await generateTurn({
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${defenderName} actually responded.`);
      defendTurn = await refereeAndMaybeRegenerate({
        turn: defendTurn,
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, defendTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The push back failed. Try again.");
      setLoadingText(null);
    }
  }

  async function submitFollowUp() {
    if (!followUpFor || !followUpText.trim() || !exchange || !slotAObj || !slotBObj) return;
    const targetKey = followUpFor;
    const otherKey = targetKey === "A" ? "B" : "A";
    const target = targetKey === "A" ? slotAObj : slotBObj;
    const other = otherKey === "A" ? slotAObj : slotBObj;
    const question = followUpText.trim();
    setError(null);
    setFollowUpFor(null); setFollowUpText("");

    const hostTurn = { speaker: "host", text: question, target: target.last };
    let working = [...exchange.turns, hostTurn];
    setExchange({ ...exchange, turns: working });
    setVisibleTurns(working.length);

    try {
      setLoadingText(`${target.last} is answering your question.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const system = debateContext(slotAObj, slotBObj);
      const answerPrompt = `TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${target.first} ${target.last}. The host has just put a question to you. Answer it directly, in your voice. 2 to 4 sentences. Concrete. No hedging.`;

      const answerResult = await callClaude(answerPrompt, 600, "claude-sonnet-4-6", system);
      const answerTurn = { speaker: targetKey, text: answerResult.text };
      working = [...working, answerTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${other.last} is reacting to ${target.last}'s answer.`);
      let reactTurn = await generateTurn({
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${other.last} actually responded.`);
      reactTurn = await refereeAndMaybeRegenerate({
        turn: reactTurn,
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, reactTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The follow-up could not be answered. Try again.");
      setLoadingText(null);
    }
  }

  return (

function DotFieldBg() {
  const canvasRef = useRef(null);
  const glowRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const glowEl = glowRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d", { alpha: true });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const TWO_PI = Math.PI * 2;

    // ---- config (DotField, tuned for the cream arrival background) ----
    const DOT_R = 1.5;      // raise for bolder dots
    const DOT_SP = 14;
    const CURSOR_R = 500;
    const BULGE = 67;
    const GRAD_FROM = "#111111";
    const GRAD_TO = "#111111";

    let dots = [];
    const size = { w: 0, h: 0 };
    const mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
    let engagement = 0, glowOpacity = 0, frameCount = 0, raf = 0;

    function buildDots(w, h) {
      const step = DOT_R + DOT_SP;
      const cols = Math.floor(w / step), rows = Math.floor(h / step);
      const padX = (w % step) / 2, padY = (h % step) / 2;
      const arr = new Array(rows * cols); let idx = 0;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
          const ax = padX + c * step + step / 2;
          const ay = padY + r * step + step / 2;
          arr[idx++] = { ax, ay, sx: ax, sy: ay };
        }
      dots = arr;
    }

    function doResize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      size.w = w; size.h = h;
      buildDots(w, h);
    }

    let resizeTimer;
    function resize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(doResize, 100); }

    function onMouseMove(e) {
      const rect = canvas.parentElement.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    }

    function updateSpeed() {
      const dx = mouse.prevX - mouse.x, dy = mouse.prevY - mouse.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      mouse.speed += (d - mouse.speed) * 0.5;
      if (mouse.speed < 0.001) mouse.speed = 0;
      mouse.prevX = mouse.x; mouse.prevY = mouse.y;
    }

    function tick() {
      frameCount++;
      const w = size.w, h = size.h, len = dots.length;
      const targetEng = Math.min(mouse.speed / 5, 1);
      engagement += (targetEng - engagement) * 0.06;
      if (engagement < 0.001) engagement = 0;
      const eng = engagement;
      glowOpacity += (eng - glowOpacity) * 0.08;
      if (glowEl) {
        glowEl.setAttribute("cx", mouse.x);
        glowEl.setAttribute("cy", mouse.y);
        glowEl.style.opacity = glowOpacity;
      }
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, GRAD_FROM); grad.addColorStop(1, GRAD_TO);
      ctx.fillStyle = grad;
      const cr = CURSOR_R, crSq = cr * cr, rad = DOT_R / 2;
      ctx.beginPath();
      for (let i = 0; i < len; i++) {
        const d = dots[i];
        const dx = mouse.x - d.ax, dy = mouse.y - d.ay;
        const distSq = dx * dx + dy * dy;
        if (distSq < crSq && eng > 0.01) {
          const dist = Math.sqrt(distSq);
          const t = 1 - dist / cr;
          const push = t * t * BULGE * eng;
          const ang = Math.atan2(dy, dx);
          d.sx += (d.ax - Math.cos(ang) * push - d.sx) * 0.15;
          d.sy += (d.ay - Math.sin(ang) * push - d.sy) * 0.15;
        } else {
          d.sx += (d.ax - d.sx) * 0.1;
          d.sy += (d.ay - d.sy) * 0.1;
        }
        ctx.moveTo(d.sx + rad, d.sy);
        ctx.arc(d.sx, d.sy, rad, 0, TWO_PI);
      }
      ctx.fill();
      raf = requestAnimationFrame(tick);
    }

    doResize();
    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", onMouseMove, { passive: true });
    let ro = null;
    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(canvas.parentElement); }

    function cleanup() {
      cancelAnimationFrame(raf);
      clearTimeout(resizeTimer);
      if (ro) ro.disconnect();
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", onMouseMove);
    }

    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      const grad = ctx.createLinearGradient(0, 0, size.w, size.h);
      grad.addColorStop(0, GRAD_FROM); grad.addColorStop(1, GRAD_TO);
      ctx.fillStyle = grad; ctx.beginPath();
      const rad = DOT_R / 2;
      dots.forEach(d => { ctx.moveTo(d.ax + rad, d.ay); ctx.arc(d.ax, d.ay, rad, 0, TWO_PI); });
      ctx.fill();
      return cleanup;
    }

    const speedInterval = setInterval(updateSpeed, 20);
    raf = requestAnimationFrame(tick);

    return () => { clearInterval(speedInterval); cleanup(); };
  }, []);

  return (
    <React.Fragment>
      <canvas ref={canvasRef} className="dotfield-canvas" aria-hidden="true" />
      <svg className="dotfield-glow" aria-hidden="true">
        <defs>
          <radialGradient id="aoaDotGlow">
            <stop offset="0%" stopColor="rgba(20,17,13,0.05)" />
            <stop offset="100%" stopColor="transparent" />
          </radialGradient>
        </defs>
        <circle ref={glowRef} cx="-9999" cy="-9999" r="160" fill="url(#aoaDotGlow)" style={{ opacity: 0, willChange: "opacity" }} />
      </svg>
    </React.Fragment>
  );
}

function KineticTitle({ text }) {
  const ref = useRef(null);
  useEffect(() => {
    const title = ref.current;
    if (!title) return;
    const chars = Array.prototype.slice.call(title.querySelectorAll(".kt-char"));
    const cursor = { x: 0, y: 0 };
    const mouse = { x: 0, y: 0 };
    let raf = 0;

    const r0 = title.getBoundingClientRect();
    mouse.x = cursor.x = r0.left + r0.width / 2;
    mouse.y = cursor.y = r0.top + r0.height / 2;

    function onMove(e) {
      const p = e.touches ? e.touches[0] : e;
      cursor.x = p.clientX; cursor.y = p.clientY;
    }
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });

    function getAttr(d, maxD, minV, maxV) {
      const val = maxV - Math.abs((maxV * d) / maxD);
      return Math.max(minV, val + minV);
    }

    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      chars.forEach(c => { c.style.fontVariationSettings = "'wght' 600, 'wdth' 100"; });
      return () => {
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("touchmove", onMove);
      };
    }

    function tick() {
      mouse.x += (cursor.x - mouse.x) / 15;
      mouse.y += (cursor.y - mouse.y) / 15;
      const tr = title.getBoundingClientRect();
      const maxDist = Math.max(tr.width, tr.height) / 2;
      if (maxDist > 0) {
        for (let i = 0; i < chars.length; i++) {
          const c = chars[i];
          const cr = c.getBoundingClientRect();
          const cx = cr.x + cr.width / 2, cy = cr.y + cr.height / 2;
          const dx = mouse.x - cx, dy = mouse.y - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          const wght = Math.floor(getAttr(d, maxDist, 100, 900));
          const wdth = Math.floor(getAttr(d, maxDist, 25, 151));
          const fvs = "'wght' " + wght + ", 'wdth' " + wdth;
          if (c._fvs !== fvs) { c.style.fontVariationSettings = fvs; c._fvs = fvs; }
          const lean = -getAttr(d, maxDist, 0, 12).toFixed(1);
          if (c._sk !== lean) { c.style.transform = "skewX(" + lean + "deg)"; c._sk = lean; }
        }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("touchmove", onMove);
    };
  }, []);

  const words = text.split(" ");
  return (
    <h1 className="arrival-v2-title kinetic" ref={ref} aria-label={text}>
      {words.map((w, wi) => (
        <React.Fragment key={wi}>
          <span className="kt-word">
            {w.split("").map((ch, ci) => (
              <span className="kt-char" key={ci}>{ch}</span>
            ))}
          </span>
          {wi < words.length - 1 ? <span className="kt-space"> </span> : null}
        </React.Fragment>
      ))}
    </h1>
  );
}

// ============================================================
// CANON SURFER — coverflow rail of the full canon, app-styled.
// Replaces the rotating VS pair on the arrival. Browse only;
// "Choose your two" stays the way forward.
// ============================================================
function CanonSurfer({ thinkers }) {
  const stageRef = useRef(null);
  const trackRef = useRef(null);

  useEffect(() => {
    const stage = stageRef.current;
    const track = trackRef.current;
    if (!stage || !track) return;
    const slots = Array.prototype.slice.call(track.children);
    const N = slots.length;
    if (!N) return;

    const TILT = 50, SCALE_STEP = 0.11, MIN_SCALE = 0.62, OPA_STEP = 0.16;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const inner = stage.closest(".cs-inner") || stage.parentElement;
    const colors = thinkers.map(t => (TRADITIONS[t.tradition] || {}).color);

    function metrics() {
      const cw = parseFloat(getComputedStyle(inner).getPropertyValue("--cw")) || stage.offsetWidth * 0.2;
      return { spacing: cw * 0.52, depth: cw * 0.85 };
    }

    let lastFocal = -1;
    const wrap = (o) => o - N * Math.round(o / N); // shortest signed distance around the ring
    function render(focal) {
      const m = metrics();
      for (let i = 0; i < slots.length; i++) {
        const o = wrap(i - focal), ao = Math.abs(o);
        const x = o * m.spacing, z = -ao * m.depth;
        const ry = -clamp(o, -1, 1) * TILT, y = ao * 7;
        const sc = Math.max(MIN_SCALE, 1 - ao * SCALE_STEP);
        const op = Math.max(0.08, 1 - ao * OPA_STEP);
        const s = slots[i];
        s.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) scale(${sc})`;
        s.style.opacity = op;
        s.style.zIndex = Math.round(100 - ao * 10);
        s.style.pointerEvents = op < 0.3 ? "none" : "auto";
      }
      const fi = ((Math.round(focal) % N) + N) % N;
      if (fi !== lastFocal) { lastFocal = fi; if (colors[fi]) stage.style.setProperty("--focal", colors[fi]); }
    }

    const START = Math.floor(N / 2); // open in the middle of the canon, not at Aristotle
    let pos = START, target = START;
    let dragging = false, didDrag = false, startX = 0, startPos = 0;
    let hovering = false, lastInteract = 0, raf = 0;
    const DRIFT = 0.010, EASE = 0.12, WHEEL_K = 0.0016, IDLE_MS = 2600;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const nearest = (from, idx) => from + wrap(idx - from); // land on idx the short way around

    function frame(ts) {
      if (!dragging) {
        if (!reduce && !hovering && (ts - lastInteract) > IDLE_MS) {
          target += DRIFT; // circles forever, no ends
        }
        pos += (target - pos) * EASE;
      }
      render(pos);
      raf = requestAnimationFrame(frame);
    }

    function onDown(e) { dragging = true; didDrag = false; startX = e.clientX; startPos = pos; lastInteract = performance.now(); }
    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4) didDrag = true;
      pos = startPos - dx / metrics().spacing;
    }
    function onUp() { if (!dragging) return; dragging = false; target = Math.round(pos); lastInteract = performance.now(); }
    function onWheel(e) {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; // vertical wheel scrolls the page
      e.preventDefault();
      target += e.deltaX * WHEEL_K;
      lastInteract = performance.now();
    }
    function onEnter() { hovering = true; }
    function onLeave() { hovering = false; lastInteract = performance.now(); }
    function onKey(e) {
      if (e.key === "ArrowLeft") { target = Math.round(target) - 1; lastInteract = performance.now(); e.preventDefault(); }
      if (e.key === "ArrowRight") { target = Math.round(target) + 1; lastInteract = performance.now(); e.preventDefault(); }
    }
    function onResize() { render(pos); }

    stage.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    stage.addEventListener("wheel", onWheel, { passive: false });
    stage.addEventListener("pointerenter", onEnter);
    stage.addEventListener("pointerleave", onLeave);
    stage.addEventListener("keydown", onKey);
    window.addEventListener("resize", onResize);

    const clicks = slots.map((s, i) => {
      const h = () => { if (didDrag) return; target = nearest(pos, i); lastInteract = performance.now(); };
      const f = () => { target = nearest(pos, i); lastInteract = performance.now(); };
      s.addEventListener("click", h);
      s.addEventListener("focus", f);
      return { s, h, f };
    });

    raf = requestAnimationFrame(frame);

    return () => {
      cancelAnimationFrame(raf);
      stage.removeEventListener("pointerdown", onDown);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      stage.removeEventListener("wheel", onWheel);
      stage.removeEventListener("pointerenter", onEnter);
      stage.removeEventListener("pointerleave", onLeave);
      stage.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", onResize);
      clicks.forEach(({ s, h, f }) => { s.removeEventListener("click", h); s.removeEventListener("focus", f); });
    };
  }, [thinkers]);

  return (
    <div className="cs-inner">
      <div className="cs-stage" ref={stageRef} tabIndex={0} aria-label="The canon, draggable">
        <div className="cs-track" ref={trackRef}>
          {thinkers.map((t, i) => {
            const trad = TRADITIONS[t.tradition] || { label: "", color: "#888" };
            const showFirst = t.first && t.first !== t.last;
            const initials = (showFirst ? (t.first[0] + t.last[0]) : t.last.slice(0, 2)).toUpperCase();
            return (
              <div key={t.id} className="cs-slot" tabIndex={0} role="button"
                   style={{ ['--trad']: trad.color }}
                   aria-label={`${showFirst ? t.first + " " : ""}${t.last}, ${trad.label}`}>
                <div className="cs-card" style={{ ['--tilt']: (i % 2 ? "1.2deg" : "-1.2deg") }}>
                  <div className="cs-photo">
                    <div className="cs-mono">{initials}</div>
                    {hasPortrait(t) && (
                      <img src={portraitURL(t.id)} alt="" onError={(e) => { e.currentTarget.style.display = "none"; }} />
                    )}
                  </div>
                  <div className="cs-label">
                    <div className="cs-trad">{trad.label}</div>
                    {showFirst && <div className="cs-first">{t.first}</div>}
                    <div className="cs-last">{t.last}</div>
                    <div className="cs-year">{t.year}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="cs-hint">Drag or tap to surf</div>
    </div>
  );
}

                  <>
                    {s.interchange && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+5} fill="none" stroke={trad.color} strokeWidth={3} />
                    )}
                    {isKind ? (
                      <circle cx={s.x} cy={s.y} r={4}
                        fill="#FFFFFF" stroke={trad.color}
                        strokeWidth={1} strokeDasharray="2 1.5" opacity={0.85} />
                    ) : (
                      <circle cx={s.x} cy={s.y} r={dotR}
                        fill={s.ghost ? "#FFFFFF" : "#14110D"}
                        stroke={s.ghost ? trad.color : "#14110D"}
                        strokeWidth={s.ghost ? 2.5 : 2}
                        strokeDasharray={s.ghost ? "3 2" : undefined} />
                    )}
                    {hovered && !selected && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+6} fill="none" stroke={trad.color} strokeWidth={2} opacity={0.5} />
                    )}
                  </>
                )}

                {selected && (
                  <>
                    <circle cx={s.x} cy={s.y} r={r+8} fill="none" stroke="#FF4D2E" strokeWidth={3} opacity={0.9} />
                    <rect x={s.x+r+8} y={s.y-9} width={20} height={18} fill="#FF4D2E" rx={3} />
                    <text x={s.x+r+18} y={s.y+4} fill="#fff"
                      fontFamily="Geist Mono, monospace"
                      fontSize={11} fontWeight={700} textAnchor="middle">{slotLabel}</text>
                  </>
                )}

                <text x={s.x} y={s.y - r - 8} fill={isKind ? trad.color : "#14110D"}
                  fontFamily={isKind ? "Instrument Serif, serif" : "Geist, sans-serif"}
                  fontSize={isKind ? 12 : 11}
                  fontWeight={isKind ? 400 : 600}
                  fontStyle={isKind ? "italic" : "normal"}
                  textAnchor="middle"
                  letterSpacing={isKind ? 0 : 0.5}
                  opacity={isKind ? 0.75 : (hovered ? 1 : 0.92)}>
                  {isKind ? `${s.first} ${s.last}` : (s.last.startsWith('&') ? `${s.first} ${s.last}` : s.last)}
                </text>
                <text x={s.x} y={s.y + r + 16} fill="#8B8576"
                  fontFamily="Geist Mono, monospace"
                  fontSize={9} textAnchor="middle" letterSpacing={0.5}>
                  {s.year}
                </text>
              </g>
            );
          })}

          {TRAD_ORDER.map(tradId => {
            const list = stations.filter(s => s.tradition === tradId).sort((a,b)=>a.x-b.x);
            if (list.length === 0) return null;
            return (
              <text key={`lbl-${tradId}`}
                x={list[list.length-1].x + 80} y={ROW_Y[tradId]+5}
                fill={TRADITIONS[tradId].color}
                fontFamily="Geist Mono, monospace"
                fontSize={11} fontWeight={600} letterSpacing={1.4}>
                {TRADITIONS[tradId].label.toUpperCase()}
              </text>
            );
          })}
        </svg>
      </div>

      {hoveredObj && (
        <div className="map-hover-card" style={{ ['--trad']: TRADITIONS[hoveredObj.tradition].color }}>
          {hasPortrait(hoveredObj) && (
            <img src={portraitURL(hoveredObj.id)} alt=""
              className="map-hover-portrait"
              style={{ borderColor: TRADITIONS[hoveredObj.tradition].color }} />
          )}
          <div className="map-hover-meta">
            {TRADITIONS[hoveredObj.tradition].label} · {hoveredObj.year}
          </div>
          <div className="map-hover-name">
            {hoveredObj.kind ? <em>{hoveredObj.first} {hoveredObj.last}</em> : `${hoveredObj.first} ${hoveredObj.last}`}
          </div>
          <p className="map-hover-bio">{hoveredObj.bio}</p>
          <div className="map-hover-note">
            {hoveredObj.kind
              ? KIND_NOTES[hoveredObj.kind]
              : CONFIDENCE_NOTES[getConfidence(hoveredObj)]}
          </div>
        </div>
      )}
    </section>
  );
}

// ============================================================
// COMPOSITION — fighter-select energy, half-second hold preserved
// ============================================================
function CompositionScreen({ slotAObj, slotBObj, topic, setTopic, onBegin, onSwapA, onSwapB, onLeave }) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const tradB = slotBObj ? TRADITIONS[slotBObj.tradition] : null;

  const [actionsReady, setActionsReady] = useState(false);
  useEffect(() => {
    setActionsReady(false);
    const t = setTimeout(() => setActionsReady(true), 700);
    return () => clearTimeout(t);
  }, [slotAObj?.id, slotBObj?.id]);

  const suggestions = ["the brief", "creativity", "what counts as proof", "attention", "what research should do"];

  if (!slotAObj || !slotBObj) {
    return (
      <section className="composition">
        <p className="composition-empty">Pick two figures to set the room.</p>
      </section>
    );
  }

  return (
    <section className="composition">
      <div className="composition-room">
        <div className="comp-card-wrap comp-card-a">
          <button className="comp-card" onClick={onSwapA} style={{ ['--trad']: tradA.color }} aria-label="Change participant A">
            <div className="comp-card-photo">
              {hasPortrait(slotAObj) && <img src={portraitURL(slotAObj.id)} alt="" />}
            </div>
            <div className="comp-card-meta">
              <div className="comp-card-trad">{tradA.label}</div>
              <div className="comp-card-name">
                <span className="comp-first">{slotAObj.first}</span>
                <span className="comp-last">{slotAObj.last}</span>
              </div>
              <div className="comp-card-year">{slotAObj.year}</div>
            </div>
            <div className="comp-card-swap">change</div>
          </button>
          <ConfidenceNote conf={getConfidence(slotAObj)} align="right" />
        </div>

        <div className="composition-vs">
          <div className="vs-text">VS</div>
          <div className="vs-bar" style={{ background: `linear-gradient(to right, ${tradA.color}, ${tradB.color})` }}></div>
        </div>

        <div className="comp-card-wrap comp-card-b">
          <button className="comp-card" onClick={onSwapB} style={{ ['--trad']: tradB.color }} aria-label="Change participant B">
            <div className="comp-card-photo">
              {hasPortrait(slotBObj) && <img src={portraitURL(slotBObj.id)} alt="" />}
            </div>
            <div className="comp-card-meta">
              <div className="comp-card-trad">{tradB.label}</div>
              <div className="comp-card-name">
                <span className="comp-first">{slotBObj.first}</span>
                <span className="comp-last">{slotBObj.last}</span>
              </div>
              <div className="comp-card-year">{slotBObj.year}</div>
            </div>
            <div className="comp-card-swap">change</div>
          </button>
          <ConfidenceNote conf={getConfidence(slotBObj)} align="left" />
        </div>
      </div>

      <div className={`composition-actions ${actionsReady ? "is-ready" : ""}`}>
        <p className="composition-prompt">What should they argue about?</p>
        <input
          className="composition-input"
          placeholder="Or leave blank, and a topic will choose itself."
          value={topic}
          onChange={(e) => setTopic(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") onBegin(); }}
          autoFocus
        />
        <ul className="composition-suggestions">
          {suggestions.map(s => (
            <li key={s}>
              <button className="composition-suggestion" onClick={() => { setTopic(s); }}>
                {s}
              </button>
            </li>
          ))}
        </ul>
        <button className="composition-begin" onClick={onBegin}>

        </button>

}

// ============================================================
// EXCHANGE — turns arrive in time, controls as game actions
// ============================================================
function ExchangeScreen({
  slotAObj, slotBObj, exchange, visibleTurns, loadingText, error,
  followUpFor, followUpText, setFollowUpFor, setFollowUpText, onSubmitFollowUp,
  onContinue, onPushBack, onChangeRoom, onLeave, onExport, exportFeedback,
  roomCard, roomCardError, scoringInFlight, onPushHarder, onNewQuestion, roundCount, priorRoomScore,
}) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const tradB = slotBObj ? TRADITIONS[slotBObj.tradition] : null;

  const allTurnsRevealed = exchange && visibleTurns >= exchange.turns.length;
  const lastRevealed = exchange && visibleTurns > 0 ? exchange.turns[visibleTurns-1] : null;
  const lastSpeakerId = lastRevealed ? lastRevealed.speaker : null;
  const dimA = !!lastSpeakerId && lastSpeakerId !== "A" && lastSpeakerId !== "host" && !allTurnsRevealed;
  const dimB = !!lastSpeakerId && lastSpeakerId !== "B" && lastSpeakerId !== "host" && !allTurnsRevealed;

  const transcriptRef = useRef(null);
  useEffect(() => {
    if (transcriptRef.current && visibleTurns > 0) {
      const last = transcriptRef.current.querySelector('.turn:last-child');
      if (last) last.scrollIntoView({ behavior: "smooth", block: "end" });
    }
  }, [visibleTurns]);

  if (!slotAObj || !slotBObj) return null;

  return (
    <section className="exchange">
      <header className="exchange-masthead">
        <ParticipantLine thinker={slotAObj} trad={tradA} dim={dimA} align="left" />
        <div className="exchange-topic">
          <div className="exchange-topic-label">In conversation</div>
          {exchange?.topic ? (
            <div className="exchange-topic-text">{exchange.topic}</div>
          ) : (
            <div className="exchange-topic-text exchange-topic-pending">···</div>
          )}
        </div>
        <ParticipantLine thinker={slotBObj} trad={tradB} dim={dimB} align="right" />
      </header>

      <p className="exchange-disclaimer">
        Reconstructions. Positions drawn from published work, voices approximated. Informed pastiche, not direct quotation.
      </p>

      {exchange?.context && (
        <div className="exchange-context">
          <div className="exchange-context-label">A primer, before they begin</div>
          <p className="exchange-context-body">{exchange.context}</p>
        </div>
      )}

      <div className="exchange-body" ref={transcriptRef}>
        {error && <p className="exchange-error">{error}</p>}

        {!exchange && loadingText && (
          <div className="exchange-loading">
            <p>{loadingText}</p>
          </div>
        )}

        {exchange && exchange.turns.slice(0, visibleTurns).map((turn, i) => {
          if (turn.speaker === "host") {
            return <HostTurn key={i} text={turn.text} target={turn.target} />;
          }
          const speaker = turn.speaker === "A" ? slotAObj : slotBObj;
          const trad = TRADITIONS[speaker.tradition];
          return <Turn key={i} turn={turn} speaker={speaker} trad={trad} />;
        })}

        {exchange && loadingText && (
          <div className="exchange-loading exchange-loading-inline">
            <p>{loadingText}</p>
          </div>
        )}
      </div>

      {exchange && allTurnsRevealed && !loadingText && (
        <ReportCard
          card={roomCard}
          loading={scoringInFlight}
          error={roomCardError}
          slotAObj={slotAObj}
          slotBObj={slotBObj}
          tradA={tradA}
          tradB={tradB}
          roundCount={roundCount}
          priorRoomScore={priorRoomScore}
          turns={exchange.turns}
        />
      )}

      {exchange && allTurnsRevealed && !loadingText && (
        <footer className="exchange-controls">
          {followUpFor ? (
            <div className="followup">
              <div className="followup-label">
                Question for <strong style={{ color: TRADITIONS[(followUpFor === "A" ? slotAObj : slotBObj).tradition].color }}>
                  {(followUpFor === "A" ? slotAObj : slotBObj).last}
                </strong>
              </div>
              <input
                className="followup-input"
                value={followUpText}
                onChange={(e)=>setFollowUpText(e.target.value)}
                onKeyDown={(e)=>{ if(e.key==="Enter") onSubmitFollowUp(); }}
                placeholder="Ask whatever is sharper than what they just said."
                autoFocus
              />
              <div className="followup-actions">
                <button className="followup-submit" onClick={onSubmitFollowUp} disabled={!followUpText.trim()}>
                  Ask <span>→</span>
                </button>
                <button className="aoa-link aoa-link-quiet" onClick={() => { setFollowUpFor(null); setFollowUpText(""); }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <div className="exchange-controls-row">
              {roomCard && (
                <>
                  <button className="ctrl ctrl-primary" onClick={onPushHarder} disabled={!roomCard}>
                    Push them harder
                  </button>
                  <button className="ctrl" onClick={onNewQuestion}>
                    New question, same pair
                  </button>
                  <span className="ctrl-divider" />
                </>
              )}
              <button className="ctrl" onClick={onContinue}>Continue</button>
              <button className="ctrl" onClick={onPushBack}>Push back</button>
              <button className="ctrl" onClick={() => { setFollowUpFor("A"); }}>
                Ask <span style={{ color: tradA.color }}>{slotAObj.last}</span>
              </button>
              <button className="ctrl" onClick={() => { setFollowUpFor("B"); }}>
                Ask <span style={{ color: tradB.color }}>{slotBObj.last}</span>
              </button>
              <span className="ctrl-divider" />
              <button className="ctrl ctrl-export" onClick={onExport}>
                {exportFeedback ? <em>{exportFeedback}</em> : "Take it with you"}
              </button>
              <button className="aoa-link aoa-link-quiet" onClick={onChangeRoom}>Change room</button>
            </div>
          )}
        </footer>
      )}
    </section>
  );
}

        className="confidence-trigger"
        onMouseEnter={() => setOpen(true)}
        onMouseLeave={() => setOpen(false)}
        onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}
        aria-expanded={open}
      >
        {CONFIDENCE_NOTES[conf]} <span className="confidence-mark">?</span>
      </button>
      {open && (
        <div className="confidence-tip" role="tooltip">
          {CONFIDENCE_EXPLANATIONS[conf]}
        </div>

// REPORT CARD — UNCHANGED. Editorial register preserved.
// ============================================================
function ReportCard({ card, loading, error, slotAObj, slotBObj, tradA, tradB, roundCount, priorRoomScore, turns }) {
  if (loading) {
    return (
      <div className="report-card report-card-loading">
        <div className="report-card-label">Scoring the exchange…</div>
      </div>
    );
  }
  if (error) {
    return (
      <div className="report-card report-card-error">
        <div className="report-card-label">Scoring failed</div>
        <p className="report-card-error-msg">{error}</p>
      </div>
    );
  }
  if (!card) return null;

  const moveTurnIdx = card.moveOfRound?.turnIndex ? card.moveOfRound.turnIndex - 1 : null;
  const moveSpeaker = card.moveOfRound?.speaker;
  const moveSpeakerObj = moveSpeaker === "A" ? slotAObj : moveSpeaker === "B" ? slotBObj : null;
  const moveTrad = moveSpeaker === "A" ? tradA : moveSpeaker === "B" ? tradB : null;
  const delta = (priorRoomScore !== null && priorRoomScore !== undefined)
    ? card.roomScore - priorRoomScore
    : null;

  return (
    <section className="report-card" aria-label="Report card">
      <header className="report-card-head">
        <div className="report-card-label">
          {roundCount > 1 ? `Round ${roundCount} · Report card` : "Report card"}
        </div>
        {delta !== null && (
          <div className={`report-card-delta ${delta > 0 ? "is-up" : delta < 0 ? "is-down" : "is-flat"}`}>
            {delta > 0 ? `+${delta}` : delta} from prior round
          </div>
        )}
      </header>

      <div className="report-card-body">
        <div className="report-block report-block-room">
          <div className="report-block-label">Room Score</div>
          <div className="report-room-score-row">
            <div className="report-score-numeral">{card.roomScore}</div>
            <RadarChart rubric={card.rubric} />
          </div>
          {card.roomNote && <p className="report-block-note">{card.roomNote}</p>}
        </div>

        <div className="report-block report-block-fidelity">
          <div className="report-block-label">Voice Fidelity</div>
          <FidelityBar thinker={slotAObj} trad={tradA} score={card.voiceFidelityA} note={card.voiceNoteA} />
          <FidelityBar thinker={slotBObj} trad={tradB} score={card.voiceFidelityB} note={card.voiceNoteB} />
        </div>
      </div>

      {card.moveOfRound && (
        <div className="report-move">
          <div className="report-block-label">Move of the round</div>
          {card.moveOfRound.quote && (
            <blockquote className="report-move-quote" style={moveTrad ? { borderLeftColor: moveTrad.color } : {}}>
              "{card.moveOfRound.quote}"
            </blockquote>
          )}
          <div className="report-move-credit">
            {moveSpeakerObj ? (
              <>
                <span style={moveTrad ? { color: moveTrad.color } : {}}>
                  {moveSpeakerObj.last}
                </span>
                {moveTurnIdx !== null && <span>, turn {card.moveOfRound.turnIndex}</span>}
              </>
            ) : null}
            {card.moveOfRound.reason && <em> — {card.moveOfRound.reason}</em>}
          </div>
        </div>
      )}

      {(card.openGroundA || card.openGroundB) && (
        <div className="report-open">
          <div className="report-block-label">Open ground</div>
          <div className="report-open-rows">
            {card.openGroundA && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradA.color }}>{slotAObj.last}</span>
                <em>{card.openGroundA}</em>
              </div>
            )}
            {card.openGroundB && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradB.color }}>{slotBObj.last}</span>
                <em>{card.openGroundB}</em>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

function RadarChart({ rubric }) {
  if (!rubric) return null;
  const dims = [
    { key: "engagement", label: "ENGAGE" },
    { key: "specificity", label: "SPECIFIC" },
    { key: "concession", label: "CONCEDE" },
    { key: "escalation", label: "ESCALATE" },
    { key: "productiveness", label: "PRODUCT" },
  ];
  const size = 180;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 62;
  const max = 20;
  const angle = (i) => (Math.PI * 2 * i) / dims.length - Math.PI / 2;

  const rings = [5, 10, 15, 20].map(level => {
    const r = (level / max) * maxR;
    const points = dims.map((_, i) =>
      `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`
    ).join(" ");
    return points;
  });

  const axes = dims.map((_, i) => ({
    x: cx + maxR * Math.cos(angle(i)),
    y: cy + maxR * Math.sin(angle(i)),
  }));

  const dataPoints = dims.map((d, i) => {
    const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
    const r = (v / max) * maxR;
    return `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`;
  }).join(" ");

  const labels = dims.map((d, i) => {
    const r = maxR + 14;
    return {
      x: cx + r * Math.cos(angle(i)),
      y: cy + r * Math.sin(angle(i)),
      text: d.label,
      value: rubric[d.key] || 0,
    };
  });

  return (
    <svg className="report-radar" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {rings.map((points, i) => (
        <polygon key={i} points={points}
          fill="none" stroke="#d8cfbf" strokeWidth="1"
          opacity={i === 3 ? 0.7 : 0.35} />
      ))}
      {axes.map((a, i) => (
        <line key={i} x1={cx} y1={cy} x2={a.x} y2={a.y}
          stroke="#d8cfbf" strokeWidth="1" opacity="0.5" />
      ))}
      <polygon points={dataPoints}
        fill="#1a1614" fillOpacity="0.08"
        stroke="#1a1614" strokeWidth="1.5" />
      {dims.map((d, i) => {
        const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
        const r = (v / max) * maxR;
        return (
          <circle key={i}
            cx={cx + r * Math.cos(angle(i))}
            cy={cy + r * Math.sin(angle(i))}
            r="2.5" fill="#1a1614" />
        );
      })}
      {labels.map((l, i) => (
        <g key={i}>
          <text x={l.x} y={l.y} fill="#7a6f63"
            fontFamily="JetBrains Mono, monospace" fontSize="8"
            textAnchor="middle" dominantBaseline="middle"
            letterSpacing="0.08em">
            {l.text}
          </text>
          <text x={l.x} y={l.y + 9} fill="#1a1614"
            fontFamily="JetBrains Mono, monospace" fontSize="9"
            fontWeight="600"
            textAnchor="middle" dominantBaseline="middle">
            {l.value}
          </text>
        </g>
      ))}
    </svg>
  );
}

function FidelityBar({ thinker, trad, score, note }) {
  if (!thinker) return null;
  const pct = Math.max(0, Math.min(100, score || 0));
  return (
    <div className="fidelity-bar">
      <div className="fidelity-bar-head">
        {hasPortrait(thinker) && (
          <img src={portraitURL(thinker.id)} alt="" className="fidelity-bar-portrait" style={{ borderColor: trad.color }} />
        )}
        <div className="fidelity-bar-meta">
          <div className="fidelity-bar-name">{thinker.last}</div>
          {note && <div className="fidelity-bar-note">{note}</div>}
        </div>
        <div className="fidelity-bar-score">{score}</div>
      </div>
      <div className="fidelity-bar-track">
        <div className="fidelity-bar-fill" style={{ width: `${pct}%`, background: trad.color }} />
      </div>
    </div>
  );
}

function HostTurn({ text, target }) {
  return (
    <div className="host-turn">
      <div className="host-turn-label">Host, to {target}</div>
      <p className="host-turn-body">{text}</p>
    </div>
  );
}
