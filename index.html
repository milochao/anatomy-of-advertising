// Renders whichever figure is currently mid-stream, if any. Returns null once
// the turn finalizes (streamingTurn clears back to null in speakTurn's finally).
function StreamingTurn({ streamingTurn, slotAObj, slotBObj }) {
  if (!streamingTurn || (streamingTurn.speaker !== "A" && streamingTurn.speaker !== "B")) return null;
  const speaker = streamingTurn.speaker === "A" ? slotAObj : slotBObj;
  if (!speaker) return null;
  const trad = TRADITIONS[speaker.tradition];
  return <Turn turn={streamingTurn} speaker={speaker} trad={trad} streaming />;
}

function Turn({ turn, speaker, trad, streaming }) {
  const isA = turn.speaker === "A";
  const portrait = hasPortrait(speaker);
  return (
    <article className={`turn ${isA ? "turn-a" : "turn-b"}`} style={{ ['--trad']: trad.color }}>
      <header className="turn-header">
        {portrait && (
          <img src={portraitURL(speaker.id)} alt="" className="turn-portrait" style={{ borderColor: trad.color }} />
        )}
        <span className="turn-name">{speaker.last}</span>
        <span className="turn-meta">{speaker.year} · {trad.label}</span>
      </header>
      <p className="turn-body">{turn.text}{streaming && <span className="turn-cursor" aria-hidden="true"></span>}</p>
    </article>
  );
}

// ============================================================
// REPORT CARD — UNCHANGED. Editorial register preserved.
// ============================================================
function ReportCard({ card, loading, error, slotAObj, slotBObj, tradA, tradB, roundCount, priorRoomScore, turns }) {
  if (loading) {
    return (
      <div className="report-card report-card-loading">
        <div className="report-card-label">Scoring the exchange…</div>
      </div>
    );
  }
  if (error) {
    return (
      <div className="report-card report-card-error">
        <div className="report-card-label">Scoring failed</div>
        <p className="report-card-error-msg">{error}</p>
      </div>
    );
  }
  if (!card) return null;

  const moveTurnIdx = card.moveOfRound?.turnIndex ? card.moveOfRound.turnIndex - 1 : null;
  const moveSpeaker = card.moveOfRound?.speaker;
  const moveSpeakerObj = moveSpeaker === "A" ? slotAObj : moveSpeaker === "B" ? slotBObj : null;
  const moveTrad = moveSpeaker === "A" ? tradA : moveSpeaker === "B" ? tradB : null;
  const delta = (priorRoomScore !== null && priorRoomScore !== undefined)
    ? card.roomScore - priorRoomScore
    : null;

  // Coded, deterministic anchor count. Only figures whose case list lives in
  // the Worker return anchor data, so this stays empty for figures without one.
  const anchorAgg = {};
  (turns || []).forEach(t => {
    if (t && t.anchors && (t.speaker === "A" || t.speaker === "B")) {
      const k = t.speaker;
      if (!anchorAgg[k]) anchorAgg[k] = { hits: new Set(), total: t.anchors.total };
      (t.anchors.hits || []).forEach(h => anchorAgg[k].hits.add(h));
    }
  });

  return (
    <section className="report-card" aria-label="Report card">
      <header className="report-card-head">
        <div className="report-card-label">
          {roundCount > 1 ? `Round ${roundCount} · Report card` : "Report card"}
        </div>
        {/* round delta removed: small moves on an LLM rubric are noise, not measurement */}
      </header>

      <div className="report-card-body">
        <div className="report-block report-block-room">
          <div className="report-block-label">Room Score</div>
          <div className="report-room-score-row">
            <div className="report-score-numeral">{card.roomScore}</div>
            <RadarChart rubric={card.rubric} />
          </div>
          {card.roomNote && <p className="report-block-note">{card.roomNote}</p>}
        </div>

        <div className="report-block report-block-fidelity">
          <div className="report-block-label">Voice Fidelity</div>
          <FidelityBar thinker={slotAObj} trad={tradA} score={card.voiceFidelityA} note={card.voiceNoteA} />
          <FidelityBar thinker={slotBObj} trad={tradB} score={card.voiceFidelityB} note={card.voiceNoteB} />
        </div>
      </div>

      {(anchorAgg.A || anchorAgg.B) && (
        <div className="report-anchors">
          <div className="report-block-label">Cases used (coded, not a model score)</div>
          <div className="report-anchors-rows">
            {["A", "B"].map(k => {
              if (!anchorAgg[k]) return null;
              const obj = k === "A" ? slotAObj : slotBObj;
              const trad = k === "A" ? tradA : tradB;
              const used = anchorAgg[k].hits.size;
              const total = anchorAgg[k].total;
              const list = Array.from(anchorAgg[k].hits);
              return (
                <div className="report-anchor-row" key={k}>
                  <span className="report-anchor-name" style={{ color: trad.color }}>{obj.last}</span>
                  <span className="report-anchor-count">{used} of {total} named cases</span>
                  {list.length > 0 && <span className="report-anchor-list">{list.join(", ")}</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {card.moveOfRound && (
        <div className="report-move">
          <div className="report-block-label">Move of the round</div>
          {card.moveOfRound.quote && (
            <blockquote className="report-move-quote" style={moveTrad ? { borderLeftColor: moveTrad.color } : {}}>
              "{card.moveOfRound.quote}"
            </blockquote>
          )}
          <div className="report-move-credit">
            {moveSpeakerObj ? (
              <>
                <span style={moveTrad ? { color: moveTrad.color } : {}}>
                  {moveSpeakerObj.last}
                </span>
                {moveTurnIdx !== null && <span>, turn {card.moveOfRound.turnIndex}</span>}
              </>
            ) : null}
            {card.moveOfRound.reason && <em> — {card.moveOfRound.reason}</em>}
          </div>
        </div>
      )}

      {(card.openGroundA || card.openGroundB) && (
        <div className="report-open">
          <div className="report-block-label">Open ground</div>
          <div className="report-open-rows">
            {card.openGroundA && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradA.color }}>{slotAObj.last}</span>
                <em>{card.openGroundA}</em>
              </div>
            )}
            {card.openGroundB && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradB.color }}>{slotBObj.last}</span>
                <em>{card.openGroundB}</em>
              </div>
            )}
          </div>
        </div>
      )}

      {(card.perFigureA || card.perFigureB) && (
        <div className="report-per-figure">
          <div className="report-block-label">By their own standard</div>
          <div className="report-open-rows">
            {card.perFigureA && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradA.color }}>{slotAObj.last}</span>
                <em>{card.perFigureA}</em>
              </div>
            )}
            {card.perFigureB && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradB.color }}>{slotBObj.last}</span>
                <em>{card.perFigureB}</em>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

function RadarChart({ rubric }) {
  if (!rubric) return null;
  const dims = [
    { key: "engagement", label: "ENGAGE" },
    { key: "specificity", label: "SPECIFIC" },
    { key: "concession", label: "CONCEDE" },
    { key: "escalation", label: "ESCALATE" },
    { key: "productiveness", label: "PRODUCT" },
  ];
  const size = 180;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 62;
  const max = 20;
  const angle = (i) => (Math.PI * 2 * i) / dims.length - Math.PI / 2;

  const rings = [5, 10, 15, 20].map(level => {
    const r = (level / max) * maxR;
    const points = dims.map((_, i) =>
      `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`
    ).join(" ");
    return points;
  });

  const axes = dims.map((_, i) => ({
    x: cx + maxR * Math.cos(angle(i)),
    y: cy + maxR * Math.sin(angle(i)),
  }));

  const dataPoints = dims.map((d, i) => {
    const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
    const r = (v / max) * maxR;
    return `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`;
  }).join(" ");

  const labels = dims.map((d, i) => {
    const r = maxR + 14;
    return {
      x: cx + r * Math.cos(angle(i)),
      y: cy + r * Math.sin(angle(i)),
      text: d.label,
      value: rubric[d.key] || 0,
    };
  });

  return (
    <svg className="report-radar" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {rings.map((points, i) => (
        <polygon key={i} points={points}
          fill="none" stroke="#d8cfbf" strokeWidth="1"
          opacity={i === 3 ? 0.7 : 0.35} />
      ))}
      {axes.map((a, i) => (
        <line key={i} x1={cx} y1={cy} x2={a.x} y2={a.y}
          stroke="#d8cfbf" strokeWidth="1" opacity="0.5" />
      ))}
      <polygon points={dataPoints}
        fill="#1a1614" fillOpacity="0.08"
        stroke="#1a1614" strokeWidth="1.5" />
      {dims.map((d, i) => {
        const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
        const r = (v / max) * maxR;
        return (
          <circle key={i}
            cx={cx + r * Math.cos(angle(i))}
            cy={cy + r * Math.sin(angle(i))}
            r="2.5" fill="#1a1614" />
        );
      })}
      {labels.map((l, i) => (
        <g key={i}>
          <text x={l.x} y={l.y} fill="#7a6f63"
            fontFamily="JetBrains Mono, monospace" fontSize="8"
            textAnchor="middle" dominantBaseline="middle"
            letterSpacing="0.08em">
            {l.text}
          </text>
          <text x={l.x} y={l.y + 9} fill="#1a1614"
            fontFamily="JetBrains Mono, monospace" fontSize="9"
            fontWeight="600"
            textAnchor="middle" dominantBaseline="middle">
            {l.value}
          </text>
        </g>
      ))}
    </svg>
  );
}

function FidelityBar({ thinker, trad, score, note }) {
  if (!thinker) return null;
  const pct = Math.max(0, Math.min(100, score || 0));
  return (
    <div className="fidelity-bar">
      <div className="fidelity-bar-head">
        {hasPortrait(thinker) && (
          <img src={portraitURL(thinker.id)} alt="" className="fidelity-bar-portrait" style={{ borderColor: trad.color }} />
        )}
        <div className="fidelity-bar-meta">
          <div className="fidelity-bar-name">{thinker.last}</div>
          {note && <div className="fidelity-bar-note">{note}</div>}
        </div>
        <div className="fidelity-bar-score">{score}</div>
      </div>
      <div className="fidelity-bar-track">
        <div className="fidelity-bar-fill" style={{ width: `${pct}%`, background: trad.color }} />
      </div>
    </div>
  );
}

function HostTurn({ text, target }) {
  return (
    <div className="host-turn">
      <div className="host-turn-label">Host, to {target}</div>
      <p className="host-turn-body">{text}</p>
    </div>
  );
}

function StudentTurn({ text }) {
  return (
    <div className="host-turn student-turn">
      <div className="host-turn-label">You</div>
      <p className="host-turn-body">{text}</p>
    </div>
  );
}

// ============================================================
// THIRD CHAIR — alternating exchange + verdict
// ============================================================
function SparScreen({
  slotAObj, position, sparTurns, loadingText, streamingTurn, error,
  sparStudentInput, setSparStudentInput, onSubmitSparTurn, onRetryFigureTurn,
  verdict, verdictLoading, verdictError, onNewSpar, onDownloadCard, cardGenerating, onLeave,
}) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const transcriptRef = useRef(null);

  useEffect(() => {
    if (transcriptRef.current) {
      const nodes = transcriptRef.current.querySelectorAll('.turn, .host-turn');
      const last = nodes[nodes.length - 1];
      if (last) last.scrollIntoView({ behavior: "smooth", block: "end" });
    }
  }, [sparTurns.length, streamingTurn]);

  if (!slotAObj) return null;

  const figureCount = sparTurns.filter(t => t.speaker === "A").length;
  const done = !!verdict || verdictLoading || !!verdictError;
  const awaitingStudent = !done && !loadingText && !streamingTurn
    && figureCount < 3 && sparTurns.length > 0
    && sparTurns[sparTurns.length - 1].speaker === "A";
  // A figure-turn generation failure leaves sparTurns ending on the student's
  // last turn (the failed reply was never appended) — surface a retry here
  // instead of leaving the exchange with no way forward but "Leave".
  const stuckOnError = !done && !loadingText && !streamingTurn && !awaitingStudent && !!error;
  const studentTrimmed = sparStudentInput.trim();

  return (
    <section className="exchange spar-exchange">
      <header className="exchange-masthead spar-masthead">
        <ParticipantLine thinker={slotAObj} trad={tradA} dim={false} align="left" />
        <div className="exchange-topic">
          <div className="exchange-topic-label">Third chair · round {Math.min(figureCount + 1, 3)} of 3</div>
          <div className="exchange-topic-text">{position}</div>
        </div>
        <div className="participant part-right" style={{ ['--trad']: tradA.color, textAlign: "right" }}>
          <div className="participant-meta">Defending</div>
          <div className="participant-name">
            <span className="participant-last">You</span>
          </div>
        </div>
      </header>

      <p className="exchange-disclaimer">
        Reconstruction. {slotAObj.last}'s voice approximated from published work. Held to their own documented standard, scored after three rounds.
      </p>

      <div className="exchange-body" ref={transcriptRef}>
        {error && <p className="exchange-error">{error}</p>}

        {sparTurns.map((t, i) => (
          t.speaker === "student"
            ? <StudentTurn key={i} text={t.text} />
            : <Turn key={i} turn={t} speaker={slotAObj} trad={tradA} />
        ))}

        <StreamingTurn streamingTurn={streamingTurn} slotAObj={slotAObj} slotBObj={null} />

        {loadingText && !streamingTurn && (
          <div className="exchange-loading exchange-loading-inline">
            <p>{loadingText}</p>
          </div>
        )}
      </div>

      {done && (
        <SparVerdict
          verdict={verdict}
          loading={verdictLoading}
          error={verdictError}
          slotAObj={slotAObj}
          tradA={tradA}
          onNewSpar={onNewSpar}
          onDownloadCard={onDownloadCard}
          cardGenerating={cardGenerating}
        />
      )}

      {awaitingStudent && (
        <footer className="exchange-controls spar-input-footer">
          <textarea
            className="spar-turn-input"
            value={sparStudentInput}
            onChange={(e) => setSparStudentInput(e.target.value)}
            maxLength={500}
            placeholder={`Respond to ${slotAObj.last}.`}
            onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && studentTrimmed) onSubmitSparTurn(); }}
            autoFocus
          />
          <div className="spar-turn-actions">
            <div className="spar-char-count">{studentTrimmed.length} / 500</div>
            <button className="composition-begin spar-turn-submit" onClick={onSubmitSparTurn} disabled={!studentTrimmed}>
              Respond <span className="composition-arrow">→</span>
            </button>
          </div>
        </footer>
      )}

      {stuckOnError && (
        <footer className="exchange-controls">
          <div className="exchange-controls-row">
            <button className="ctrl ctrl-primary" onClick={onRetryFigureTurn}>
              Try again
            </button>
          </div>
        </footer>
      )}
    </section>
  );
}

function SparVerdict({ verdict, loading, error, slotAObj, tradA, onNewSpar, onDownloadCard, cardGenerating }) {
  if (loading) {
    return (
      <div className="report-card report-card-loading">
        <div className="report-card-label">{slotAObj.last} is weighing the verdict…</div>
      </div>
    );
  }
  if (error) {
    return (
      <div className="report-card report-card-error">
        <div className="report-card-label">Scoring failed</div>
        <p className="report-card-error-msg">{error}</p>
      </div>
    );
  }
  if (!verdict) return null;

  const verdictLabel = { pass: "Survived", survived: "Survived", fail: "Did not survive" }[verdict.verdict] || verdict.verdict;
  const survived = verdict.verdict === "pass" || verdict.verdict === "survived";

  return (
    <section className="report-card spar-verdict" aria-label="Verdict">
      <header className="report-card-head">
        <div className="report-card-label">Verdict — held to {slotAObj.last}'s own standard</div>
      </header>

      <div className={`spar-verdict-headline ${survived ? "is-survived" : "is-fail"}`} style={{ ['--trad']: tradA.color }}>
        <span className="spar-verdict-label">{verdictLabel}</span>
        <span className="spar-verdict-score">{verdict.survivalScore}<em>/100</em></span>
      </div>

      {verdict.unanswered && (
        <div className="spar-unanswered">
          <div className="report-block-label">The question you never answered</div>
          <p className="spar-unanswered-text">{verdict.unanswered}</p>
        </div>
      )}

      {verdict.criteria && verdict.criteria.length > 0 && (
        <div className="report-block">
          <div className="report-block-label">Criteria, by {slotAObj.last}'s standard</div>
          <ul className="spar-criteria-list">
            {verdict.criteria.map((c, i) => (
              <li key={i} className={`spar-criterion ${c.pass ? "is-pass" : "is-fail"}`}>
                <span className="spar-criterion-mark">{c.pass ? "✓" : "✗"}</span>
                <span className="spar-criterion-name">{c.name}</span>
                {c.note && <span className="spar-criterion-note">{c.note}</span>}
              </li>
            ))}
          </ul>
        </div>
      )}

      {verdict.bestMove && verdict.bestMove.quote && (
        <div className="report-move">
          <div className="report-block-label">Your strongest move</div>
          <blockquote className="report-move-quote" style={{ borderLeftColor: tradA.color }}>
            "{verdict.bestMove.quote}"
          </blockquote>
          <div className="report-move-credit">
            {verdict.bestMove.turnIndex ? <span>Turn {verdict.bestMove.turnIndex}</span> : null}
            {verdict.bestMove.why && <em> — {verdict.bestMove.why}</em>}
          </div>
        </div>
      )}

      <footer className="exchange-controls">
        <div className="exchange-controls-row">
          <button className="ctrl ctrl-cards" onClick={onDownloadCard} disabled={cardGenerating}>
            {cardGenerating ? <em>Building card…</em> : "Download card"}
          </button>
          <button className="ctrl" onClick={onNewSpar}>Spar again</button>
        </div>
      </footer>
    </section>
  );
}

        border-radius: 100px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .map-clear-btn {
        background: none; border: none; padding: 6px 12px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--mid);
        transition: color 0.15s;
      }
      .map-clear-btn:hover { color: var(--accent); }

      .map-begin-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 40;
        padding: 24px 36px 36px;
        background: linear-gradient(to top, var(--bg) 60%, rgba(255,255,255,0));
        display: flex; justify-content: center;
        animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      .map-begin-btn {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 44px;
        font-family: 'Geist', sans-serif;
        font-size: 17px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        display: inline-flex; align-items: center; gap: 12px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .map-begin-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .map-begin-arrow { font-size: 18px; transition: transform 0.15s; }
      .map-begin-btn:hover .map-begin-arrow { transform: translateX(3px); }

      .map-scroll-hint {
        max-width: 1280px;
        margin: 0 auto 12px;
        display: inline-flex; align-items: center; gap: 8px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent);
        padding: 6px 12px;
        background: var(--paper);
        border: 1px solid var(--accent);
        border-radius: 100px;
        animation: scrollHintBounce 1.6s ease-in-out infinite;
      }
      .scroll-hint-arrow { font-size: 14px; }
      @keyframes scrollHintBounce {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }

      .map-scroll {
        position: relative;
        overflow-x: auto;
        padding-bottom: 24px;
        animation: fadeIn 0.6s ease both;
        -webkit-mask-image: linear-gradient(to right, black 0%, black 92%, transparent 100%);
        mask-image: linear-gradient(to right, black 0%, black 92%, transparent 100%);
      }
      .map-scroll::-webkit-scrollbar { height: 8px; }
      .map-scroll::-webkit-scrollbar-thumb { background: rgba(20,17,13,0.18); border-radius: 4px; }
      .map-svg { width: ${VIEWBOX_W}px; min-width: 1200px; height: auto; display: block; }

      .map-hover-card {
        position: fixed; top: 88px; right: 28px; width: 320px;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-top: 4px solid var(--trad);
        border-radius: 6px;
        padding: 22px 24px;
        z-index: 50;
        box-shadow: 4px 4px 0 var(--ink);
        animation: fadeIn 0.2s ease both;
      }
      .map-hover-portrait {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 3px solid;
        object-fit: cover;
        margin-bottom: 14px;
        background: var(--bg);
      }
      .map-hover-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 6px;
      }
      .map-hover-name {
        font-family: 'Instrument Serif', serif;
        font-size: 28px; font-weight: 400;
        line-height: 1.0;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      .map-hover-bio {
        font-family: 'Geist', sans-serif;
        font-size: 13px; line-height: 1.55;
        color: var(--ink-quiet);
        margin: 0;
      }
      .map-hover-note {
        margin-top: 14px; padding-top: 12px;
        border-top: 1px solid var(--rule);
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid);
      }

      .map-list { display: none; max-width: 720px; margin: 0 auto; }
      .map-list-section { margin-bottom: 32px; }
      .map-list-tradition {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        font-weight: 700;
        padding-bottom: 10px; margin-bottom: 12px;
        border-bottom: 2px solid;
      }
      .map-list-items { list-style: none; padding: 0; margin: 0; }
      .map-list-item { border-bottom: 1px solid var(--rule); }
      .map-list-btn {
        display: flex; align-items: center; gap: 14px;
        width: 100%; background: none; border: none;
        padding: 14px 12px; cursor: pointer;
        font-family: inherit; color: var(--ink); text-align: left;
        transition: background 0.15s;
      }
      .map-list-btn:not(:disabled):hover { background: rgba(20,17,13,0.04); }
      .map-list-btn:disabled { cursor: default; opacity: 0.55; }
      .map-list-portrait {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .map-list-name {
        font-family: 'Geist', sans-serif; font-size: 15px;
        flex: 1 1 auto;
      }
      .map-list-name strong { font-weight: 600; letter-spacing: -0.005em; }
      .map-list-name em { font-weight: 400; font-style: italic; color: var(--mid); }
      .map-list-meta {
        text-align: right; flex: 0 0 auto;
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      }
      .map-list-meta > span:first-child {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--mid);
      }
      .map-list-note {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; color: var(--whisper);
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      .map-list-slot {
        flex: 0 0 auto;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 700; color: #fff;
        background: var(--ink); padding: 2px 8px;
        border-radius: 3px;
      }

      @media (max-width: 720px) {
        .map-svg-wrapper { display: none; }
        .map-list { display: block; }
        .aoa-header { padding: 14px 20px; }
      }

      /* ---- Confidence tooltip ---- */
      .confidence-note {
        position: relative;
        margin-top: 8px;
      }
      .conf-right { text-align: right; }
      .conf-left { text-align: left; }
      .confidence-trigger {
        background: none; border: none; padding: 4px 0; cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid); opacity: 0.85;
        transition: opacity 0.15s, color 0.15s;
      }
      .confidence-trigger:hover { opacity: 1; color: var(--ink); }
      .confidence-mark {
        display: inline-block;
        margin-left: 4px; padding: 0 5px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 9px;
        opacity: 0.7;
      }
      .confidence-tip {
        position: absolute;
        top: 100%; margin-top: 6px;
        max-width: 240px; min-width: 220px;
        background: var(--ink); color: var(--bg);
        padding: 12px 14px;
        font-family: 'Geist', sans-serif;
        font-size: 12px; line-height: 1.5;
        z-index: 30;
        border-radius: 4px;
        box-shadow: 4px 4px 0 var(--accent);
        animation: fadeIn 0.2s ease both;
      }
      .conf-right .confidence-tip { right: 0; }
      .conf-left .confidence-tip { left: 0; }

      /* ---- COMPOSITION ---- */
      .composition {
        min-height: calc(100vh - 70px);
        display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start;
        padding: 90px 36px 60px;
        background: var(--bg-warm);
      }
      .composition-empty {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        color: var(--mid);
      }

      .composition-room {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 40px; align-items: center;
        max-width: 1100px; width: 100%;
        margin-bottom: 64px;
        animation: fadeUp 0.8s ease both;
      }
      .comp-card-wrap { display: flex; flex-direction: column; align-items: center; }
      .comp-card-a { align-items: flex-end; }
      .comp-card-b { align-items: flex-start; }

      .comp-card {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        padding: 0 0 16px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        width: 280px;
        max-width: 100%;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
        font-family: inherit;
        text-align: left;
        color: var(--ink);
      }
      .comp-card:hover {
        transform: translate(-2px, -3px);
        box-shadow: 6px 7px 0 var(--ink);
      }
      .comp-card-a .comp-card { transform: rotate(-1.5deg); }
      .comp-card-b .comp-card { transform: rotate(1.5deg); }
      .comp-card-a .comp-card:hover { transform: rotate(-1.5deg) translate(-2px, -3px); }
      .comp-card-b .comp-card:hover { transform: rotate(1.5deg) translate(-2px, -3px); }

      .comp-card-photo {
        width: 100%; aspect-ratio: 1 / 1;
        background: var(--bg-warm);
        border-bottom: 4px solid var(--trad);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .comp-card-photo img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
      .comp-card-meta {
        padding: 18px 20px 8px;
      }
      .comp-card-trad {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 10px;
      }
      .comp-card-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
      }
      .comp-first {
        display: block; font-size: 14px;
        font-style: italic; color: var(--mid);
        margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
        letter-spacing: -0.005em;
      }
      .comp-last {
        display: block; font-size: 36px;
        color: var(--ink);
        letter-spacing: -0.025em;
      }
      .comp-card-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--whisper);
        margin-top: 10px;
        letter-spacing: 0.06em;
      }
      .comp-card-swap {
        position: absolute;
        bottom: 12px; right: 16px;
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .comp-card:hover .comp-card-swap { opacity: 1; }

      .comp-card-you {
        cursor: default;
      }
      .comp-card-a .comp-card-you:hover { transform: rotate(-1.5deg); box-shadow: 4px 4px 0 var(--ink); }
      .comp-card-you-photo {
        border-bottom: 4px solid var(--ink);
        background: #14110D;
      }
      .comp-you-mark {
        font-family: 'Geist Mono', monospace;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.2em;
        color: #ffffff;
        opacity: 0.85;
      }

      .composition-vs {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      .vs-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 32px;
        color: var(--ink);
        position: relative;
      }
      .vs-text::after {
        content: "";
        position: absolute;
        bottom: 4px; left: -4px; right: -4px;
        height: 8px;
        background: var(--accent-yellow);
        z-index: -1;
        transform: skew(-8deg);
      }
      .vs-bar { width: 60px; height: 2px; }

      .composition-actions {
        max-width: 560px; width: 100%; text-align: center;
        opacity: 0; transform: translateY(8px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .composition-actions.is-ready {
        opacity: 1; transform: translateY(0);
      }
      .composition-prompt {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 24px; color: var(--ink); margin: 0 0 22px;
      }
      .composition-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px;
        color: var(--ink); text-align: center;
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
        transition: box-shadow 0.15s, transform 0.15s;
      }
      .composition-input::placeholder {
        color: var(--whisper);
      }
      .composition-input:focus {
        box-shadow: 4px 4px 0 var(--accent);
        transform: translate(-1px, -1px);
      }

      .composition-suggestions {
        list-style: none; padding: 0; margin: 22px 0 36px;
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      }
      .composition-suggestion {
        background: var(--bg); border: 1px solid var(--rule-strong);
        padding: 6px 12px;
        border-radius: 100px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--ink-quiet);
        transition: all 0.15s;
      }
      .composition-suggestion:hover {
        background: var(--ink); color: var(--bg);
        border-color: var(--ink);
      }

      .composition-begin {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 40px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
        display: inline-flex; align-items: center; gap: 10px;
      }
      .composition-begin:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .composition-arrow { transition: transform 0.15s; }
      .composition-begin:hover .composition-arrow { transform: translateX(3px); }

      @media (max-width: 768px) {
        .composition-room { grid-template-columns: 1fr; gap: 24px; }
        .comp-card-wrap { align-items: center; }
        .comp-card-a .comp-card, .comp-card-b .comp-card { transform: none; }
        .comp-card-a .comp-card:hover, .comp-card-b .comp-card:hover { transform: translate(-2px, -3px); }
        .composition-vs { transform: rotate(0deg); }
      }

      /* ---- EXCHANGE ---- */
      .exchange {
        min-height: calc(100vh - 70px);
        max-width: 920px; margin: 0 auto;
        padding: 48px 36px 96px;
      }
      .exchange-masthead {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 32px; align-items: end;
        padding-bottom: 32px; margin-bottom: 22px;
        border-bottom: 1px solid var(--rule);
      }
      .exchange-disclaimer {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.1em;
        color: var(--whisper);
        margin: 0 auto 36px;
        text-align: center; line-height: 1.6;
        max-width: 640px;
      }

      .participant { transition: opacity 0.8s ease; }
      .participant.is-dim { opacity: 0.42; }
      .participant-portrait {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        margin-bottom: 12px;
        background: var(--bg);
        display: block;
      }
      .part-left .participant-portrait { margin-left: 0; margin-right: auto; }
      .part-right .participant-portrait { margin-left: auto; margin-right: 0; }
      .participant-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad); margin-bottom: 8px;
      }
      .participant-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
        letter-spacing: -0.025em;
      }
      .participant-first {
        display: block; font-size: 13px;
        font-style: italic; color: var(--mid); margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
      }
      .participant-last {
        display: block; font-size: clamp(34px, 4vw, 50px);
        color: var(--ink);
      }
      .participant-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--mid); margin-top: 6px;
        letter-spacing: 0.05em;
      }

      .exchange-topic { text-align: center; padding: 0 16px; }
      .exchange-topic-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .exchange-topic-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--ink); line-height: 1.3;
        max-width: 240px;
      }
      .exchange-topic-pending { color: var(--whisper); letter-spacing: 0.3em; }

      .exchange-context {
        margin: 0 auto 40px;
        max-width: 640px;
        padding: 20px 24px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
      }
      .exchange-context-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 10px;
      }
      .exchange-context-body {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 16px; line-height: 1.55; color: var(--ink-quiet);
        margin: 0;
      }

      .exchange-body { min-height: 200px; }
      .exchange-loading {
        padding: 60px 0; text-align: center;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--mid);
        animation: loadFade 2s ease infinite;
      }
      .exchange-loading-inline { padding: 20px 0; font-size: 15px; }
      @keyframes loadFade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      .exchange-error {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 15px; color: var(--accent);
        text-align: center;
        padding: 20px 0;
      }

      .turn {
        margin-bottom: 32px;
        animation: fadeUp 0.6s ease both;
      }
      .turn-a { padding-right: 8%; }
      .turn-b { padding-left: 8%; }
      .turn-header {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 10px; padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      .turn-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        background: var(--bg);
        flex: 0 0 auto;
      }
      .turn-name {
        font-family: 'Instrument Serif', serif;
        font-size: 24px; font-weight: 400;
        color: var(--trad); letter-spacing: -0.015em;
      }
      .turn-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; color: var(--mid);
        letter-spacing: 0.05em;
      }
      .turn-body {
        font-family: 'Geist', sans-serif;
        font-size: 17px; line-height: 1.6;
        color: var(--ink); margin: 0;
      }
      .turn-cursor {
        display: inline-block;
        width: 2px; height: 1em;
        margin-left: 2px;
        background: var(--trad, var(--ink));
        vertical-align: text-bottom;
        animation: turnCursorBlink 0.9s steps(1) infinite;
      }
      @keyframes turnCursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .host-turn {
        margin: 24px 0; padding: 16px 22px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent-blue);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .host-turn-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .host-turn-body {
        font-family: 'Instrument Serif', serif; font-style: italic;
        font-size: 16px; color: var(--ink-quiet); margin: 0;
        line-height: 1.5;
      }

      .exchange-controls {
        margin-top: 40px; padding-top: 28px;
        border-top: 1px solid var(--rule);
        animation: fadeUp 0.6s ease 0.1s both;
      }
      .exchange-controls-row {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .ctrl {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        padding: 8px 14px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink);
        border-radius: 100px;
        box-shadow: 2px 2px 0 var(--ink);
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .ctrl:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .ctrl-primary {
        background: var(--accent); color: var(--bg);
        border-color: var(--ink);
      }
      .ctrl-primary:hover { background: var(--ink); }
      .ctrl-divider {
        width: 1px; height: 16px; background: var(--rule-strong);
      }
      .ctrl-export em { font-style: italic; color: var(--mid); }
      .ctrl-cards { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .ctrl-cards:hover { background: var(--ink-quiet); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
      .ctrl-cards:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--ink); }
      .ctrl-cards em { font-style: italic; opacity: 0.7; }

      .followup { animation: fadeUp 0.4s ease both; }
      .followup-label {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 12px;
      }
      .followup-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; color: var(--ink);
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .followup-input::placeholder { color: var(--whisper); }
      .followup-actions {
        display: flex; align-items: center; gap: 16px; margin-top: 16px;
      }
      .followup-submit {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 10px 22px; cursor: pointer;
        font-family: 'Geist', sans-serif;
        font-size: 14px; font-weight: 600;
        border-radius: 100px;
        box-shadow: 3px 3px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .followup-submit:disabled { opacity: 0.3; cursor: not-allowed; }
      .followup-submit:not(:disabled):hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--accent);
      }
      .followup-submit span { margin-left: 6px; }

      @media (max-width: 720px) {
        .exchange-masthead { grid-template-columns: 1fr; gap: 18px; text-align: left; }
        .turn-a, .turn-b { padding-left: 0; padding-right: 0; }
      }

      /* ============================================================
         THIRD CHAIR — spar composition, exchange, and verdict
         ============================================================ */
      .spar-position-actions { max-width: 620px; }
      .spar-position-input {
        border-radius: 18px;
        min-height: 120px;
        text-align: left;
        line-height: 1.5;
        resize: vertical;
        padding: 18px 22px;
      }
      .spar-char-count {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.08em;
        color: var(--whisper);
        text-align: right;
        margin: 8px 4px 20px;
      }

      .student-turn {
        border-left-color: var(--accent);
        margin-left: 8%;
      }
      @media (max-width: 720px) { .student-turn { margin-left: 0; } }

      .spar-input-footer { display: flex; flex-direction: column; }
      .spar-turn-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 18px;
        padding: 16px 20px;
        font-family: 'Geist', sans-serif;
        font-size: 15px; color: var(--ink);
        line-height: 1.5;
        min-height: 90px; resize: vertical;
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .spar-turn-input::placeholder { color: var(--whisper); }
      .spar-turn-actions {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 10px;
      }
      .spar-turn-submit:disabled { opacity: 0.35; cursor: not-allowed; }

      .spar-verdict-headline {
        display: flex; align-items: baseline; gap: 14px;
        margin: 8px 0 28px;
      }
      .spar-verdict-label {
        font-family: 'Instrument Serif', serif; font-style: italic;
        font-size: 30px; color: var(--trad, var(--ink));
      }
      .spar-verdict-headline.is-fail .spar-verdict-label { color: var(--accent); }
      .spar-verdict-score {
        font-family: 'Geist Mono', monospace;
        font-size: 22px; font-weight: 600; color: var(--ink);
      }
      .spar-verdict-score em { font-style: normal; font-size: 13px; color: var(--whisper); margin-left: 2px; }

      .spar-unanswered {
        margin: 0 0 32px;
        padding: 24px 28px;
        background: var(--ink);
        border-radius: 6px;
      }
      .spar-unanswered .report-block-label { color: rgba(255,255,255,0.5); }
      .spar-unanswered-text {
        font-family: 'Instrument Serif', serif;
        font-size: 24px; line-height: 1.35;
        color: #fff; margin: 8px 0 0;
      }

      .spar-criteria-list { list-style: none; margin: 8px 0 0; padding: 0; }
      .spar-criterion {
        display: flex; align-items: baseline; gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
        font-family: 'Geist', sans-serif; font-size: 14px;
      }
      .spar-criterion:last-child { border-bottom: none; }
      .spar-criterion-mark { font-weight: 700; }
      .spar-criterion.is-pass .spar-criterion-mark { color: #2F8F4D; }
      .spar-criterion.is-fail .spar-criterion-mark { color: var(--accent); }
      .spar-criterion-name { font-weight: 600; color: var(--ink); }
      .spar-criterion-note { color: var(--ink-quiet); font-style: italic; }

      /* ============================================================
         REPORT CARD — preserved from prior. Editorial register.
         ============================================================ */
      .report-card {
        max-width: 760px; margin: 48px auto 0;
        padding: 32px 36px;
        background: #fbf8ef;
        border: 1px solid var(--rule);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .report-card-loading {
        text-align: center;
        padding: 48px 36px;
      }
      .report-card-error {
        text-align: center;
        padding: 36px;
        border-color: var(--accent);
      }
      .report-card-error .report-card-label {
        color: var(--accent);
        margin-bottom: 12px;
      }
      .report-card-error-msg {
        font-family: 'Geist', sans-serif;
        font-size: 14px;
        color: var(--ink-quiet);
        line-height: 1.5;
        margin: 0;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      .report-card-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .report-card-label, .report-block-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid);
      }
      .report-card-delta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
      }
      .report-card-delta.is-up { color: #2f8f4d; }
      .report-card-delta.is-down { color: #c0392b; }
      .report-card-delta.is-flat { color: var(--mid); }

      .report-card-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        margin-bottom: 32px;
      }
      .report-block { min-width: 0; }
      @media (max-width: 720px) {
        .report-card-body { grid-template-columns: 1fr; gap: 32px; }
        .report-card { padding: 24px 20px; }
      }

      .report-block-label { margin-bottom: 14px; display: block; }

      .report-room-score-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
      }
      .report-score-numeral {
        font-family: 'Fraunces', serif;
        font-size: 64px; font-weight: 400;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.04em; line-height: 0.9;
        color: var(--ink);
      }
      .report-radar { flex: 1 1 auto; }
      .report-block-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 13px; line-height: 1.5;
        color: var(--mid); margin: 0;
      }

      .fidelity-bar { margin-bottom: 20px; min-width: 0; }
      .fidelity-bar:last-child { margin-bottom: 0; }
      .fidelity-bar-head {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 8px;
        min-width: 0;
      }
      .fidelity-bar-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .fidelity-bar-meta { flex: 1 1 auto; min-width: 0; }
      .fidelity-bar-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .fidelity-bar-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 11px; color: var(--mid);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .fidelity-bar-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 600;
        color: var(--ink);
        flex: 0 0 auto;
      }
      .fidelity-bar-track {
        height: 4px;
        background: rgba(26,22,20,0.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .fidelity-bar-fill {
        height: 100%;
        transition: width 0.6s ease;
      }

      .report-move {
        margin-bottom: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-move-quote {
        font-family: 'Fraunces', serif;
        font-size: 18px; line-height: 1.4;
        font-style: italic;
        color: var(--ink);
        margin: 12px 0 8px;
        padding-left: 16px;
        border-left: 3px solid var(--ink);
        font-variation-settings: "opsz" 30;
      }
      .report-move-credit {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
        color: var(--mid);
      }
      .report-move-credit em {
        font-family: 'Fraunces', serif;
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--mid);
      }

      .report-open {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-per-figure {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
        margin-top: 4px;
      }
      .report-open-rows {
        display: grid; gap: 10px;
        margin-top: 12px;
      }
      .report-open-row {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px;
        align-items: baseline;
      }
      @media (max-width: 720px) {
        .report-open-row { grid-template-columns: 1fr; gap: 2px; }
      }
      .report-open-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .report-open-row em {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; line-height: 1.5;
        color: var(--ink);
      }

      .report-anchors {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-anchors-rows { display: grid; gap: 8px; margin-top: 12px; }
      .report-anchor-row {
        display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      }
      .report-anchor-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      }
      .report-anchor-count {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px; color: var(--ink); font-weight: 600;
      }
      .report-anchor-list {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 12px; color: var(--mid);
      }

      /* ---- CANON SURFER (arrival rail) ---- */
      .cs-breakout {
        width: 100vw;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
        margin-top: 10px;
        margin-bottom: 28px;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 11%, #000 89%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 11%, #000 89%, transparent 100%);
      }
      .cs-inner {
        --cw: clamp(150px, 22vw, 212px);
        --ch: calc(var(--cw) * 1.34);
        width: 100%;
        display: flex; flex-direction: column; align-items: center;
      }
      .cs-stage {
        position: relative;
        width: 100%; max-width: 1100px;
        height: min(52vh, 412px);
        perspective: 1500px;
        cursor: grab;
        touch-action: pan-y;
        --focal: #D6342B;
      }
      .cs-stage:active { cursor: grabbing; }
      .cs-stage::before {
        content: "";
        position: absolute;
        left: 50%; top: 50%;
        width: clamp(360px, 56vw, 700px);
        height: clamp(360px, 56vw, 700px);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, color-mix(in srgb, var(--focal) 12%, transparent) 0%, transparent 64%);
        transition: background .45s ease;
        pointer-events: none;
      }
      .cs-track { position: absolute; inset: 0; transform-style: preserve-3d; }
      .cs-slot {
        position: absolute;
        left: 50%; top: 50%;
        width: var(--cw); height: var(--ch);
        margin-left: calc(var(--cw) / -2);
        margin-top: calc(var(--ch) / -2);
        transform-style: preserve-3d;
        --trad: #888;
      }
      .cs-card {
        position: relative;
        width: 100%; height: 100%;
        border-radius: 8px;
        overflow: hidden;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        transform: rotate(var(--tilt, 0deg));
        transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
        display: flex; flex-direction: column;
      }
      .cs-card:hover { transform: rotate(var(--tilt, 0deg)) translate(-2px,-3px); box-shadow: 6px 7px 0 var(--ink); }
      .cs-slot:focus-visible { outline: none; }
      .cs-slot:focus-visible .cs-card { box-shadow: 5px 6px 0 var(--trad); }
      .cs-photo {
        position: relative;
        flex: 1 1 auto;
        background: color-mix(in srgb, var(--trad) 7%, var(--bg-warm));
        border-bottom: 4px solid var(--trad);
        overflow: hidden;
      }
      .cs-photo img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; display: block;
        background: var(--bg-warm);
        -webkit-user-drag: none; user-select: none;
      }
      .cs-mono {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: calc(var(--cw) * 0.32);
        color: color-mix(in srgb, var(--trad) 42%, #b6ae9e);
      }
      .cs-label { flex: 0 0 auto; padding: 12px 15px 14px; text-align: left; background: var(--paper); }
      .cs-trad {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; font-weight: 600;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad); margin-bottom: 6px;
      }
      .cs-first {
        font-family: 'Geist', sans-serif; font-style: italic;
        font-size: 11px; color: var(--mid);
        line-height: 1; margin-bottom: 3px;
      }
      .cs-last {
        font-family: 'Instrument Serif', serif;
        font-size: clamp(20px, 1.9vw, 26px);
        line-height: 1.0; letter-spacing: -0.02em;
        color: var(--ink);
      }
      .cs-year {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; color: var(--whisper);
        margin-top: 6px; letter-spacing: 0.04em;
      }
      .cs-hint {
        margin-top: 22px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--whisper);
      }
      @media (max-width: 640px) {
        .cs-inner { --cw: clamp(140px, 52vw, 188px); }
        .cs-stage { height: min(56vh, 380px); }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AnatomyOfAdvertising />);
</script>
