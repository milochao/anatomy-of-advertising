        letter-spacing: -0.005em;
      }
      .composition-last {
        display: block; font-size: clamp(56px, 8vw, 96px); font-weight: 500;
        color: var(--ink);
      }
      .composition-year {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px; color: var(--mid); margin-top: 14px;
        letter-spacing: 0.05em;
      }
      .composition-confidence {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 12px; color: var(--mid); margin-top: 8px;
        font-variation-settings: "opsz" 14;
        opacity: 0.75;
      }
      .composition-swap {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 12px; color: var(--whisper); margin-top: 10px;
        opacity: 0; transition: opacity 0.3s;
      }

      .composition-divider {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      .composition-divider-bar {
        width: 60px; height: 2px;
      }
      .composition-amp {
        font-family: 'Fraunces', serif; font-size: 22px;
        color: var(--whisper); font-style: italic;
      }

      .composition-actions {
        max-width: 560px; width: 100%; text-align: center;
        opacity: 0; transform: translateY(8px);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .composition-actions.is-ready {
        opacity: 1; transform: translateY(0);
      }
      .composition-prompt {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 22px; color: var(--ink-quiet); margin: 0 0 24px;
        font-variation-settings: "opsz" 36;
      }
      .composition-input {
        width: 100%; background: transparent; border: none;
        border-bottom: 1px solid var(--rule);
        padding: 14px 0;
        font-family: 'Fraunces', serif; font-size: 22px;
        color: var(--ink); text-align: center;
        outline: none;
        font-variation-settings: "opsz" 24;
        transition: border-color 0.2s;
      }
      .composition-input::placeholder {
        color: var(--whisper); font-style: italic;
      }
      .composition-input:focus { border-bottom-color: var(--ink); }

      .composition-suggestions {
        list-style: none; padding: 0; margin: 24px 0 40px;
        display: flex; flex-wrap: wrap; gap: 16px 24px; justify-content: center;
      }
      .composition-suggestion {
        background: none; border: none; padding: 0; cursor: pointer;
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; color: var(--mid);
        transition: color 0.2s;
      }
      .composition-suggestion:hover { color: var(--ink); }

      .composition-begin {
        background: var(--ink); color: var(--bg);
        border: none; padding: 16px 36px;
        font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: all 0.2s;
        font-variation-settings: "opsz" 18;
      }
      .composition-begin:hover { background: var(--ink-quiet); transform: translateY(-1px); }
      .composition-arrow { display: inline-block; margin-left: 8px; transition: transform 0.2s; }
      .composition-begin:hover .composition-arrow { transform: translateX(4px); }

      /* ---- Exchange ---- */
      .exchange {
        min-height: calc(100vh - 70px);
        max-width: 880px; margin: 0 auto;
        padding: 48px 40px 96px;
      }

      .exchange-masthead {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 32px; align-items: end;
        padding-bottom: 36px; margin-bottom: 24px;
        border-bottom: 1px solid var(--rule);
      }
      .exchange-disclaimer {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 12px; color: var(--mid); margin: 0 0 40px;
        text-align: center; line-height: 1.5;
        font-variation-settings: "opsz" 14;
        opacity: 0.7;
        max-width: 560px; margin-left: auto; margin-right: auto;
      }
      .participant {
        transition: opacity 0.8s ease;
      }
      .participant.is-dim { opacity: 0.42; }
      .participant-meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--trad); margin-bottom: 8px;
      }
      .participant-name {
        font-family: 'Fraunces', serif;
        font-variation-settings: "opsz" 72;
        letter-spacing: -0.025em; line-height: 0.95;
      }
      .participant-first {
        display: block; font-size: 13px; font-weight: 400;
        font-style: italic; color: var(--mid); margin-bottom: 4px;
        font-variation-settings: "opsz" 14;
      }
      .participant-last {
        display: block; font-size: clamp(32px, 4vw, 48px); font-weight: 500;
        color: var(--ink);
      }
      .participant-year {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; color: var(--mid); margin-top: 6px;
        letter-spacing: 0.05em;
      }

      .exchange-topic {
        text-align: center; padding: 0 16px;
      }
      .exchange-topic-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .exchange-topic-text {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 17px; color: var(--ink-quiet); line-height: 1.3;
        font-variation-settings: "opsz" 24;
        max-width: 220px;
      }
      .exchange-topic-pending { color: var(--whisper); letter-spacing: 0.3em; }

      .exchange-body { min-height: 200px; }
      .exchange-loading {
        padding: 60px 0; text-align: center;
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 18px; color: var(--mid);
        font-variation-settings: "opsz" 24;
        animation: loadFade 2s ease infinite;
      }
      .exchange-loading-inline { padding: 24px 0; font-size: 15px; }
      @keyframes loadFade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      .exchange-error {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 15px; color: #d6342b;
      }

      .turn {
        margin-bottom: 32px;
        animation: turnIn 0.7s ease both;
      }
      @keyframes turnIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .turn-a { padding-right: 8%; }
      .turn-b { padding-left: 8%; text-align: left; }

      .turn-header {
        display: flex; align-items: baseline; gap: 14px;
        margin-bottom: 10px; padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      .turn-name {
        font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500;
        color: var(--trad); letter-spacing: -0.01em;
        font-variation-settings: "opsz" 24;
      }
      .turn-meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; color: var(--mid); letter-spacing: 0.05em;
      }
      .turn-body {
        font-family: 'Fraunces', serif; font-size: 18px; line-height: 1.55;
        color: var(--ink); margin: 0;
        font-variation-settings: "opsz" 18;
      }

      .host-turn {
        margin: 24px 0; padding: 18px 24px;
        background: var(--paper);
        border-left: 3px solid var(--whisper);
        animation: turnIn 0.7s ease both;
      }
      .host-turn-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .host-turn-body {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 16px; color: var(--ink-quiet); margin: 0;
        line-height: 1.5;
        font-variation-settings: "opsz" 18;
      }

      /* ---- Exchange controls ---- */
      .exchange-controls {
        margin-top: 48px; padding-top: 32px;
        border-top: 1px solid var(--rule);
        animation: turnIn 0.6s ease 0.2s both;
      }
      .exchange-controls-row {
        display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      }
      .ctrl {
        background: none; border: none; padding: 0; cursor: pointer;
        font-family: 'Fraunces', serif; font-size: 15px;
        color: var(--ink); transition: color 0.2s;
        font-variation-settings: "opsz" 18;
      }
      .ctrl:hover { color: var(--ink-quiet); }
      .ctrl-primary {
        font-weight: 500;
        text-decoration: underline; text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }
      .ctrl-divider {
        width: 1px; height: 14px; background: var(--rule);
      }

      .followup {
        animation: turnIn 0.4s ease both;
      }
      .followup-label {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; color: var(--mid); margin-bottom: 12px;
      }
      .followup-input {
        width: 100%; background: transparent; border: none;
        border-bottom: 1px solid var(--ink); padding: 12px 0;
        font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink);
        outline: none;
        font-variation-settings: "opsz" 18;
      }
      .followup-input::placeholder { color: var(--whisper); font-style: italic; }
      .followup-actions {
        display: flex; align-items: center; gap: 20px; margin-top: 16px;
      }
      .followup-submit {
        background: var(--ink); color: var(--bg); border: none;
        padding: 10px 22px; cursor: pointer;
        font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500;
        transition: all 0.2s;
        font-variation-settings: "opsz" 18;
      }
      .followup-submit:disabled { opacity: 0.3; cursor: not-allowed; }
      .followup-submit:not(:disabled):hover { background: var(--ink-quiet); }
      .followup-submit span { margin-left: 6px; }

      /* ---- Portraits ---- */
      .map-hover-portrait {
        width: 88px; height: 88px;
        border-radius: 50%;
        border: 3px solid;
        object-fit: cover;
        margin-bottom: 16px;
        background: var(--bg);
      }
      .map-list-portrait {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
        background: var(--bg);
      }
      .composition-portrait {
        display: block;
        width: 200px; height: 200px;
        border-radius: 50%;
        border: 4px solid;
        object-fit: cover;
        margin: 0 auto 24px;
        background: var(--bg);
        box-shadow: 0 4px 24px rgba(26,22,20,0.08);
      }
      .composition-figure-a .composition-portrait { margin-left: auto; margin-right: 0; }
      .composition-figure-b .composition-portrait { margin-left: 0; margin-right: auto; }
      .participant {
        position: relative;
      }
      .participant-portrait {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        margin-bottom: 12px;
        background: var(--bg);
        display: block;
      }
      .part-left .participant-portrait { margin-left: 0; margin-right: auto; }
      .part-right .participant-portrait { margin-left: auto; margin-right: 0; }
      .turn-portrait {
        width: 32px; height: 32px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        margin-right: 4px;
        background: var(--bg);
        flex: 0 0 auto;
      }
      .turn-header { display: flex; align-items: center; gap: 12px; }

      @media (max-width: 720px) {
        .composition-portrait { width: 140px; height: 140px; }
        .map-list-portrait { width: 36px; height: 36px; }
        .participant-portrait { width: 48px; height: 48px; }
      }

      /* ---- Report card ---- */
      .report-card {
        max-width: 760px; margin: 48px auto 0;
        padding: 32px 36px;
        background: #fbf8ef;
        border: 1px solid var(--rule);
        border-radius: 4px;
        animation: cardFade 0.6s ease both;
      }
      @keyframes cardFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .report-card-loading {
        text-align: center;
        padding: 48px 36px;
      }
      .report-card-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .report-card-label, .report-block-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid);
      }
      .report-card-delta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
      }
      .report-card-delta.is-up { color: #2f8f4d; }
      .report-card-delta.is-down { color: #c0392b; }
      .report-card-delta.is-flat { color: var(--mid); }

      .report-card-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        margin-bottom: 32px;
      }
      @media (max-width: 720px) {
        .report-card-body { grid-template-columns: 1fr; gap: 32px; }
        .report-card { padding: 24px 20px; }
      }

      .report-block-label { margin-bottom: 14px; display: block; }

      .report-room-score-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
      }
      .report-score-numeral {
        font-family: 'Fraunces', serif;
        font-size: 64px; font-weight: 400;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.04em; line-height: 0.9;
        color: var(--ink);
      }
      .report-radar { flex: 1 1 auto; }
      .report-block-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 13px; line-height: 1.5;
        color: var(--mid); margin: 0;
      }

      .fidelity-bar { margin-bottom: 20px; }
      .fidelity-bar:last-child { margin-bottom: 0; }
      .fidelity-bar-head {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 8px;
      }
      .fidelity-bar-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .fidelity-bar-meta { flex: 1 1 auto; min-width: 0; }
      .fidelity-bar-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .fidelity-bar-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 11px; color: var(--mid);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .fidelity-bar-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 600;
        color: var(--ink);
        flex: 0 0 auto;
      }
      .fidelity-bar-track {
        height: 4px;
        background: rgba(26,22,20,0.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .fidelity-bar-fill {
        height: 100%;
        transition: width 0.6s ease;
      }

      .report-move {
        margin-bottom: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-move-quote {
        font-family: 'Fraunces', serif;
        font-size: 18px; line-height: 1.4;
        font-style: italic;
        color: var(--ink);
        margin: 12px 0 8px;
        padding-left: 16px;
        border-left: 3px solid var(--ink);
        font-variation-settings: "opsz" 30;
      }
      .report-move-credit {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
        color: var(--mid);
      }
      .report-move-credit em {
        font-family: 'Fraunces', serif;
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--mid);
      }

      .report-open {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-open-rows {
        display: grid; gap: 10px;
        margin-top: 12px;
      }
      .report-open-row {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px;
        align-items: baseline;
      }
      @media (max-width: 720px) {
        .report-open-row { grid-template-columns: 1fr; gap: 2px; }
      }
      .report-open-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .report-open-row em {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; line-height: 1.5;
        color: var(--ink);
      }
    `}</style>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AnatomyOfAdvertising />);
</script>
</body>
</html>
