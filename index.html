        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      .rp-meta {
        padding: 14px 16px 16px;
        text-align: left;
      }
      .rp-trad {
        font-family: 'Geist Mono', monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 6px;
      }
      .rp-name {
        font-family: 'Instrument Serif', serif;
        font-size: 28px;
        line-height: 1.0;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .rp-year {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        color: var(--whisper);
        margin-top: 6px;
        letter-spacing: 0.04em;
      }

      .rp-vs {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .rp-vs-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 28px;
        color: var(--ink);
        position: relative;
        padding: 0 4px;
      }
      .rp-vs-text::after {
        content: "";
        position: absolute;
        bottom: 4px; left: -4px; right: -4px;
        height: 8px;
        background: var(--accent-yellow);
        z-index: -1;
        transform: skew(-8deg);
      }

      .rp-topic {
        font-family: 'Geist', sans-serif;
        font-size: 14px;
        color: var(--ink-quiet);
        margin: 0 0 28px;
        transition: opacity 0.35s ease;
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
        justify-content: center;
      }
      .rp-topic.is-flipping { opacity: 0; }
      .rp-topic-label {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--whisper);
      }
      .rp-topic-text {
        font-family: 'Instrument Serif', serif;
        font-size: 18px;
        color: var(--ink);
      }
      .rp-topic-text em { font-style: italic; }

      .rp-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .rp-start {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
        padding: 16px 32px;
        font-family: 'Geist', sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.005em;
        cursor: pointer;
        border-radius: 100px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .rp-start:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .rp-arrow { font-size: 16px; transition: transform 0.15s; }
      .rp-start:hover .rp-arrow { transform: translateX(3px); }
      .rp-pick {
        background: none; border: none; padding: 6px 0;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mid);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
        transition: color 0.15s;
      }
      .rp-pick:hover { color: var(--ink); }

      .rp-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .rp-dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: rgba(20,17,13,0.18);
        transition: background 0.3s, transform 0.3s;
      }
      .rp-dot.is-active {
        background: var(--accent);
        transform: scale(1.4);
      }

      @media (max-width: 640px) {
        .arrival-v2 { padding: 32px 20px 60px; }
        .arrival-v2-deck-2 { margin-bottom: 36px; }
        .rotating-pair { grid-template-columns: 1fr; gap: 16px; max-width: 280px; }
        .rp-card-a, .rp-card-b { transform: none; }
        .rotating-pair:hover .rp-card-a, .rotating-pair:hover .rp-card-b { transform: translate(-2px, -3px); }
        .rp-actions { flex-direction: column; gap: 16px; }
      }

      .mechanics {
        display: flex; justify-content: center; flex-wrap: wrap;
        gap: 10px; margin-top: 36px;
      }
      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--bg);
        border: 1.5px solid var(--ink);
        padding: 8px 14px;
        border-radius: 100px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 600;
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .chip:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .chip .num {
        width: 18px; height: 18px;
        background: var(--ink); color: var(--bg);
        border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700;
        margin-left: -4px;
      }

      .scrawl {
        position: absolute;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        color: var(--accent);
        font-size: 18px;
        pointer-events: none;
        user-select: none;
      }
      .scrawl-1 { top: 130px; right: 8%; transform: rotate(-8deg); }
      .scrawl-2 {
        bottom: 24px; left: 5%;
        transform: rotate(6deg);
        color: var(--accent-blue);
        position: relative;
      }
      .scr-arrow { display: inline-block; margin-right: 4px; }

      /* ---- Cast roster ---- */
      .cast-section {
        padding: 64px 36px 32px;
        position: relative;
      }
      .cast-header {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 24px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--whisper);
        max-width: 1280px;
        margin-left: auto; margin-right: auto;
        flex-wrap: wrap; gap: 8px;
      }
      .cast-label { color: var(--ink); font-weight: 600; }
      .cast-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
        gap: 12px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .card {
        aspect-ratio: 3 / 4;
        background: var(--bg);
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        padding: 0;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
        box-shadow: 3px 3px 0 var(--ink);
        display: flex; flex-direction: column;
        font-family: inherit;
        color: var(--ink);
        text-align: left;
      }
      .card:hover {
        transform: translate(-2px, -3px) rotate(-1deg);
        box-shadow: 5px 6px 0 var(--ink);
        z-index: 2;
      }
      .card:nth-child(odd):hover { transform: translate(-2px, -3px) rotate(1deg); }
      .card-photo {
        height: 70%;
        background: var(--bg-warm);
        border-bottom: 1.5px solid var(--ink);
        display: flex; align-items: center; justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .card-photo img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        position: relative; z-index: 1;
      }
      .card-initial {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 36px;
        color: rgba(255, 255, 255, 0.7);
      }
      .card-meta {
        height: 30%;
        padding: 8px 10px;
        display: flex; flex-direction: column;
        justify-content: center;
        background: var(--bg);
      }
      .card-name {
        font-family: 'Geist', sans-serif;
        font-size: 13px; font-weight: 600;
        color: var(--ink);
        line-height: 1.1;
        letter-spacing: -0.01em;
      }
      .card-year {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        color: var(--whisper);
        margin-top: 3px;
        letter-spacing: 0.04em;
      }
      .card-badge {
        position: absolute;
        top: 6px; right: 6px;
        background: var(--accent); color: var(--bg);
        font-family: 'Geist Mono', monospace;
        font-size: 9px; font-weight: 700;
        padding: 2px 6px;
        border-radius: 3px;
        letter-spacing: 0.05em;
        z-index: 2;
      }

      /* ---- CTA ---- */
      .arrival-cta {
        padding: 56px 36px 80px;
        text-align: center;
      }
      .walk-in {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 36px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        display: inline-flex; align-items: center; gap: 10px;
      }
      .walk-in:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
        background: var(--ink-quiet);
      }
      .walk-in:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--accent);
      }
      .walk-arrow { font-size: 18px; transition: transform 0.15s; }
      .walk-in:hover .walk-arrow { transform: translateX(3px); }

      .cta-aside {
        margin-top: 22px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--whisper);
      }
      .cta-aside .sep { margin: 0 10px; }

      @media (max-width: 768px) {
        .arrival-hero { padding: 40px 20px 20px; }
        .cast-section { padding: 40px 20px 24px; }
        .arrival-cta { padding: 40px 20px 60px; }
        .cast-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
        .scrawl { display: none; }
      }

      /* ---- MAP ---- */
      .map-screen { padding: 32px 36px 120px; }
      .map-intro {
        max-width: 1280px;
        margin: 0 auto 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--rule);
      }
      .map-intro-text {
        font-family: 'Instrument Serif', serif;
        font-size: clamp(18px, 1.7vw, 22px);
        line-height: 1.45;
        color: var(--ink);
        margin: 0;
        max-width: 56ch;
      }
      .map-intro-text em {
        font-style: italic;
        color: var(--ink);
      }

      .map-legend {
        position: fixed;
        bottom: 24px; left: 24px;
        z-index: 30;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        padding: 14px 16px;
        box-shadow: 3px 3px 0 var(--ink);
        max-width: 240px;
      }
      .map-legend-label {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 600;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 10px;
      }
      .map-legend-list {
        list-style: none; padding: 0; margin: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
      }
      .map-legend-item {
        display: flex; align-items: center; gap: 7px;
      }
      .map-legend-swatch {
        width: 10px; height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .map-legend-name {
        font-family: 'Geist', sans-serif;
        font-size: 11px;
        color: var(--ink-quiet);
        line-height: 1.2;
      }
      @media (max-width: 900px) {
        .map-legend { display: none; }
      }
      .map-prelude {
        display: flex; align-items: center; justify-content: space-between;
        max-width: 1280px; margin: 0 auto 28px;
        gap: 16px; flex-wrap: wrap;
      }
      .map-prelude-pill {
        display: inline-flex; align-items: center; gap: 10px;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        padding: 8px 16px;
        border-radius: 100px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .map-clear-btn {
        background: none; border: none; padding: 6px 12px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--mid);
        transition: color 0.15s;
      }
      .map-clear-btn:hover { color: var(--accent); }

      .map-begin-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 40;
        padding: 24px 36px 36px;
        background: linear-gradient(to top, var(--bg) 60%, rgba(255,255,255,0));
        display: flex; justify-content: center;
        animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      .map-begin-btn {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 44px;
        font-family: 'Geist', sans-serif;
        font-size: 17px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        display: inline-flex; align-items: center; gap: 12px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .map-begin-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .map-begin-arrow { font-size: 18px; transition: transform 0.15s; }
      .map-begin-btn:hover .map-begin-arrow { transform: translateX(3px); }

      .map-scroll-hint {
        max-width: 1280px;
        margin: 0 auto 12px;
        display: inline-flex; align-items: center; gap: 8px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent);
        padding: 6px 12px;
        background: var(--paper);
        border: 1px solid var(--accent);
        border-radius: 100px;
        animation: scrollHintBounce 1.6s ease-in-out infinite;
      }
      .scroll-hint-arrow { font-size: 14px; }
      @keyframes scrollHintBounce {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(6px); }
      }

      .map-scroll {
        position: relative;
        overflow-x: auto;
        padding-bottom: 24px;
        animation: fadeIn 0.6s ease both;
        -webkit-mask-image: linear-gradient(to right, black 0%, black 92%, transparent 100%);
        mask-image: linear-gradient(to right, black 0%, black 92%, transparent 100%);
      }
      .map-scroll::-webkit-scrollbar { height: 8px; }
      .map-scroll::-webkit-scrollbar-thumb { background: rgba(20,17,13,0.18); border-radius: 4px; }
      .map-svg { width: ${VIEWBOX_W}px; min-width: 1200px; height: auto; display: block; }

      .map-hover-card {
        position: fixed; top: 88px; right: 28px; width: 320px;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-top: 4px solid var(--trad);
        border-radius: 6px;
        padding: 22px 24px;
        z-index: 50;
        box-shadow: 4px 4px 0 var(--ink);
        animation: fadeIn 0.2s ease both;
      }
      .map-hover-portrait {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 3px solid;
        object-fit: cover;
        margin-bottom: 14px;
        background: var(--bg);
      }
      .map-hover-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 6px;
      }
      .map-hover-name {
        font-family: 'Instrument Serif', serif;
        font-size: 28px; font-weight: 400;
        line-height: 1.0;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      .map-hover-bio {
        font-family: 'Geist', sans-serif;
        font-size: 13px; line-height: 1.55;
        color: var(--ink-quiet);
        margin: 0;
      }
      .map-hover-note {
        margin-top: 14px; padding-top: 12px;
        border-top: 1px solid var(--rule);
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid);
      }

      .map-list { display: none; max-width: 720px; margin: 0 auto; }
      .map-list-section { margin-bottom: 32px; }
      .map-list-tradition {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
        font-weight: 700;
        padding-bottom: 10px; margin-bottom: 12px;
        border-bottom: 2px solid;
      }
      .map-list-items { list-style: none; padding: 0; margin: 0; }
      .map-list-item { border-bottom: 1px solid var(--rule); }
      .map-list-btn {
        display: flex; align-items: center; gap: 14px;
        width: 100%; background: none; border: none;
        padding: 14px 12px; cursor: pointer;
        font-family: inherit; color: var(--ink); text-align: left;
        transition: background 0.15s;
      }
      .map-list-btn:not(:disabled):hover { background: rgba(20,17,13,0.04); }
      .map-list-btn:disabled { cursor: default; opacity: 0.55; }
      .map-list-portrait {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .map-list-name {
        font-family: 'Geist', sans-serif; font-size: 15px;
        flex: 1 1 auto;
      }
      .map-list-name strong { font-weight: 600; letter-spacing: -0.005em; }
      .map-list-name em { font-weight: 400; font-style: italic; color: var(--mid); }
      .map-list-meta {
        text-align: right; flex: 0 0 auto;
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      }
      .map-list-meta > span:first-child {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--mid);
      }
      .map-list-note {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; color: var(--whisper);
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      .map-list-slot {
        flex: 0 0 auto;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 700; color: #fff;
        background: var(--ink); padding: 2px 8px;
        border-radius: 3px;
      }

      @media (max-width: 720px) {
        .map-svg-wrapper { display: none; }
        .map-list { display: block; }
        .aoa-header { padding: 14px 20px; }
      }

      /* ---- Confidence tooltip ---- */
      .confidence-note {
        position: relative;
        margin-top: 8px;
      }
      .conf-right { text-align: right; }
      .conf-left { text-align: left; }
      .confidence-trigger {
        background: none; border: none; padding: 4px 0; cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid); opacity: 0.85;
        transition: opacity 0.15s, color 0.15s;
      }
      .confidence-trigger:hover { opacity: 1; color: var(--ink); }
      .confidence-mark {
        display: inline-block;
        margin-left: 4px; padding: 0 5px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 9px;
        opacity: 0.7;
      }
      .confidence-tip {
        position: absolute;
        top: 100%; margin-top: 6px;
        max-width: 240px; min-width: 220px;
        background: var(--ink); color: var(--bg);
        padding: 12px 14px;
        font-family: 'Geist', sans-serif;
        font-size: 12px; line-height: 1.5;
        z-index: 30;
        border-radius: 4px;
        box-shadow: 4px 4px 0 var(--accent);
        animation: fadeIn 0.2s ease both;
      }
      .conf-right .confidence-tip { right: 0; }
      .conf-left .confidence-tip { left: 0; }

      /* ---- COMPOSITION ---- */
      .composition {
        min-height: calc(100vh - 70px);
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;
        padding: 60px 36px;
        background: var(--bg-warm);
      }
      .composition-empty {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        color: var(--mid);
      }

      .composition-room {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 40px; align-items: center;
        max-width: 1100px; width: 100%;
        margin-bottom: 64px;
        animation: fadeUp 0.8s ease both;
      }
      .comp-card-wrap { display: flex; flex-direction: column; align-items: center; }
      .comp-card-a { align-items: flex-end; }
      .comp-card-b { align-items: flex-start; }

      .comp-card {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        padding: 0 0 16px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        width: 280px;
        max-width: 100%;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
        font-family: inherit;
        text-align: left;
        color: var(--ink);
      }
      .comp-card:hover {
        transform: translate(-2px, -3px);
        box-shadow: 6px 7px 0 var(--ink);
      }
      .comp-card-a .comp-card { transform: rotate(-1.5deg); }
      .comp-card-b .comp-card { transform: rotate(1.5deg); }
      .comp-card-a .comp-card:hover { transform: rotate(-1.5deg) translate(-2px, -3px); }
      .comp-card-b .comp-card:hover { transform: rotate(1.5deg) translate(-2px, -3px); }

      .comp-card-photo {
        width: 100%; aspect-ratio: 1 / 1;
        background: var(--bg-warm);
        border-bottom: 4px solid var(--trad);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .comp-card-photo img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
      .comp-card-meta {
        padding: 18px 20px 8px;
      }
      .comp-card-trad {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 10px;
      }
      .comp-card-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
      }
      .comp-first {
        display: block; font-size: 14px;
        font-style: italic; color: var(--mid);
        margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
        letter-spacing: -0.005em;
      }
      .comp-last {
        display: block; font-size: 36px;
        color: var(--ink);
        letter-spacing: -0.025em;
      }
      .comp-card-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--whisper);
        margin-top: 10px;
        letter-spacing: 0.06em;
      }
      .comp-card-swap {
        position: absolute;
        bottom: 12px; right: 16px;
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .comp-card:hover .comp-card-swap { opacity: 1; }

      .composition-vs {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      .vs-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 32px;
        color: var(--ink);
        position: relative;
      }
      .vs-text::after {
        content: "";
        position: absolute;
        bottom: 4px; left: -4px; right: -4px;
        height: 8px;
        background: var(--accent-yellow);
        z-index: -1;
        transform: skew(-8deg);
      }
      .vs-bar { width: 60px; height: 2px; }

      .composition-actions {
        max-width: 560px; width: 100%; text-align: center;
        opacity: 0; transform: translateY(8px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .composition-actions.is-ready {
        opacity: 1; transform: translateY(0);
      }
      .composition-prompt {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 24px; color: var(--ink); margin: 0 0 22px;
      }
      .composition-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px;
        color: var(--ink); text-align: center;
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
        transition: box-shadow 0.15s, transform 0.15s;
      }
      .composition-input::placeholder {
        color: var(--whisper);
      }
      .composition-input:focus {
        box-shadow: 4px 4px 0 var(--accent);
        transform: translate(-1px, -1px);
      }

      .composition-suggestions {
        list-style: none; padding: 0; margin: 22px 0 36px;
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      }
      .composition-suggestion {
        background: var(--bg); border: 1px solid var(--rule-strong);
        padding: 6px 12px;
        border-radius: 100px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--ink-quiet);
        transition: all 0.15s;
      }
      .composition-suggestion:hover {
        background: var(--ink); color: var(--bg);
        border-color: var(--ink);
      }

      .composition-begin {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 40px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
        display: inline-flex; align-items: center; gap: 10px;
      }
      .composition-begin:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .composition-arrow { transition: transform 0.15s; }
      .composition-begin:hover .composition-arrow { transform: translateX(3px); }

      @media (max-width: 768px) {
        .composition-room { grid-template-columns: 1fr; gap: 24px; }
        .comp-card-wrap { align-items: center; }
        .comp-card-a .comp-card, .comp-card-b .comp-card { transform: none; }
        .comp-card-a .comp-card:hover, .comp-card-b .comp-card:hover { transform: translate(-2px, -3px); }
        .composition-vs { transform: rotate(0deg); }
      }

      /* ---- EXCHANGE ---- */
      .exchange {
        min-height: calc(100vh - 70px);
        max-width: 920px; margin: 0 auto;
        padding: 48px 36px 96px;
      }
      .exchange-masthead {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 32px; align-items: end;
        padding-bottom: 32px; margin-bottom: 22px;
        border-bottom: 1px solid var(--rule);
      }
      .exchange-disclaimer {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.1em;
        color: var(--whisper);
        margin: 0 auto 36px;
        text-align: center; line-height: 1.6;
        max-width: 640px;
      }

      .participant { transition: opacity 0.8s ease; }
      .participant.is-dim { opacity: 0.42; }
      .participant-portrait {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        margin-bottom: 12px;
        background: var(--bg);
        display: block;
      }
      .part-left .participant-portrait { margin-left: 0; margin-right: auto; }
      .part-right .participant-portrait { margin-left: auto; margin-right: 0; }
      .participant-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad); margin-bottom: 8px;
      }
      .participant-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
        letter-spacing: -0.025em;
      }
      .participant-first {
        display: block; font-size: 13px;
        font-style: italic; color: var(--mid); margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
      }
      .participant-last {
        display: block; font-size: clamp(34px, 4vw, 50px);
        color: var(--ink);
      }
      .participant-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--mid); margin-top: 6px;
        letter-spacing: 0.05em;
      }

      .exchange-topic { text-align: center; padding: 0 16px; }
      .exchange-topic-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .exchange-topic-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--ink); line-height: 1.3;
        max-width: 240px;
      }
      .exchange-topic-pending { color: var(--whisper); letter-spacing: 0.3em; }

      .exchange-context {
        margin: 0 auto 40px;
        max-width: 640px;
        padding: 20px 24px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
      }
      .exchange-context-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 10px;
      }
      .exchange-context-body {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 16px; line-height: 1.55; color: var(--ink-quiet);
        margin: 0;
      }

      .exchange-body { min-height: 200px; }
      .exchange-loading {
        padding: 60px 0; text-align: center;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--mid);
        animation: loadFade 2s ease infinite;
      }
      .exchange-loading-inline { padding: 20px 0; font-size: 15px; }
      @keyframes loadFade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      .exchange-error {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 15px; color: var(--accent);
        text-align: center;
        padding: 20px 0;
      }

      .turn {
        margin-bottom: 32px;
        animation: fadeUp 0.6s ease both;
      }
      .turn-a { padding-right: 8%; }
      .turn-b { padding-left: 8%; }
      .turn-header {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 10px; padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      .turn-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        background: var(--bg);
        flex: 0 0 auto;
      }
      .turn-name {
        font-family: 'Instrument Serif', serif;
        font-size: 24px; font-weight: 400;
        color: var(--trad); letter-spacing: -0.015em;
      }
      .turn-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; color: var(--mid);
        letter-spacing: 0.05em;
      }
      .turn-body {
        font-family: 'Geist', sans-serif;
        font-size: 17px; line-height: 1.6;
        color: var(--ink); margin: 0;
      }

      .host-turn {
        margin: 24px 0; padding: 16px 22px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent-blue);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .host-turn-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .host-turn-body {
        font-family: 'Instrument Serif', serif; font-style: italic;
        font-size: 16px; color: var(--ink-quiet); margin: 0;
        line-height: 1.5;
      }

      .exchange-controls {
        margin-top: 40px; padding-top: 28px;
        border-top: 1px solid var(--rule);
        animation: fadeUp 0.6s ease 0.1s both;
      }
      .exchange-controls-row {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .ctrl {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        padding: 8px 14px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink);
        border-radius: 100px;
        box-shadow: 2px 2px 0 var(--ink);
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .ctrl:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .ctrl-primary {
        background: var(--accent); color: var(--bg);
        border-color: var(--ink);
      }
      .ctrl-primary:hover { background: var(--ink); }
      .ctrl-divider {
        width: 1px; height: 16px; background: var(--rule-strong);
      }
      .ctrl-export em { font-style: italic; color: var(--mid); }

      .followup { animation: fadeUp 0.4s ease both; }
      .followup-label {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 12px;
      }
      .followup-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; color: var(--ink);
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .followup-input::placeholder { color: var(--whisper); }
      .followup-actions {
        display: flex; align-items: center; gap: 16px; margin-top: 16px;
      }
      .followup-submit {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 10px 22px; cursor: pointer;
        font-family: 'Geist', sans-serif;
        font-size: 14px; font-weight: 600;
        border-radius: 100px;
        box-shadow: 3px 3px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .followup-submit:disabled { opacity: 0.3; cursor: not-allowed; }
      .followup-submit:not(:disabled):hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--accent);
      }
      .followup-submit span { margin-left: 6px; }

      @media (max-width: 720px) {
        .exchange-masthead { grid-template-columns: 1fr; gap: 18px; text-align: left; }
        .turn-a, .turn-b { padding-left: 0; padding-right: 0; }
      }

      /* ============================================================
         REPORT CARD — preserved from prior. Editorial register.
         ============================================================ */
      .report-card {
        max-width: 760px; margin: 48px auto 0;
        padding: 32px 36px;
        background: #fbf8ef;
        border: 1px solid var(--rule);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .report-card-loading {
        text-align: center;
        padding: 48px 36px;
      }
      .report-card-error {
        text-align: center;
        padding: 36px;
        border-color: var(--accent);
      }
      .report-card-error .report-card-label {
        color: var(--accent);
        margin-bottom: 12px;
      }
      .report-card-error-msg {
        font-family: 'Geist', sans-serif;
        font-size: 14px;
        color: var(--ink-quiet);
        line-height: 1.5;
        margin: 0;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      .report-card-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .report-card-label, .report-block-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid);
      }
      .report-card-delta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
      }
      .report-card-delta.is-up { color: #2f8f4d; }
      .report-card-delta.is-down { color: #c0392b; }
      .report-card-delta.is-flat { color: var(--mid); }

      .report-card-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        margin-bottom: 32px;
      }
      .report-block { min-width: 0; }
      @media (max-width: 720px) {
        .report-card-body { grid-template-columns: 1fr; gap: 32px; }
        .report-card { padding: 24px 20px; }
      }

      .report-block-label { margin-bottom: 14px; display: block; }

      .report-room-score-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
      }
      .report-score-numeral {
        font-family: 'Fraunces', serif;
        font-size: 64px; font-weight: 400;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.04em; line-height: 0.9;
        color: var(--ink);
      }
      .report-radar { flex: 1 1 auto; }
      .report-block-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 13px; line-height: 1.5;
        color: var(--mid); margin: 0;
      }

      .fidelity-bar { margin-bottom: 20px; min-width: 0; }
      .fidelity-bar:last-child { margin-bottom: 0; }
      .fidelity-bar-head {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 8px;
        min-width: 0;
      }
      .fidelity-bar-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .fidelity-bar-meta { flex: 1 1 auto; min-width: 0; }
      .fidelity-bar-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .fidelity-bar-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 11px; color: var(--mid);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .fidelity-bar-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 600;
        color: var(--ink);
        flex: 0 0 auto;
      }
      .fidelity-bar-track {
        height: 4px;
        background: rgba(26,22,20,0.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .fidelity-bar-fill {
        height: 100%;
        transition: width 0.6s ease;
      }

      .report-move {
        margin-bottom: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-move-quote {
        font-family: 'Fraunces', serif;
        font-size: 18px; line-height: 1.4;
        font-style: italic;
        color: var(--ink);
        margin: 12px 0 8px;
        padding-left: 16px;
        border-left: 3px solid var(--ink);
        font-variation-settings: "opsz" 30;
      }
      .report-move-credit {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
        color: var(--mid);
      }
      .report-move-credit em {
        font-family: 'Fraunces', serif;
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--mid);
      }

      .report-open {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-open-rows {
        display: grid; gap: 10px;
        margin-top: 12px;
      }
      .report-open-row {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px;
        align-items: baseline;
      }
      @media (max-width: 720px) {
        .report-open-row { grid-template-columns: 1fr; gap: 2px; }
      }
      .report-open-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .report-open-row em {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; line-height: 1.5;
        color: var(--ink);
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AnatomyOfAdvertising />);
</script>
</body>
</html>
