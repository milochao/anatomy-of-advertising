// ============================================================
// THIRD CHAIR RECORD — localStorage, keyed by figure id.
// { [figureId]: { spars, survived, bestScore, lastVerdict, date } }
// ============================================================
const AOA_RECORD_KEY = "aoa_record";

function loadRecord() {
  try {
    const raw = window.localStorage.getItem(AOA_RECORD_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveRecord(rec) {
  try {
    window.localStorage.setItem(AOA_RECORD_KEY, JSON.stringify(rec));
  } catch (e) { /* localStorage unavailable (private mode, quota); skip silently */ }
}

// ============================================================
// MAIN
// ============================================================
function AnatomyOfAdvertising() {
  const [phase, setPhase] = useState("arrival");
  const [mode, setMode] = useState("duel"); // "duel" (two figures) | "spar" (third chair)
  const [slotA, setSlotA] = useState(null);
  const [slotB, setSlotB] = useState(null);
  const [topic, setTopic] = useState("");
  const [exchange, setExchange] = useState(null);
  const [visibleTurns, setVisibleTurns] = useState(0);
  const [loadingText, setLoadingText] = useState(null);
  const [error, setError] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [followUpFor, setFollowUpFor] = useState(null);
  const [followUpText, setFollowUpText] = useState("");
  const [starterContext, setStarterContext] = useState(null);
  const [exportFeedback, setExportFeedback] = useState(null);
  const [cardGenerating, setCardGenerating] = useState(false);
  const [preparedCards, setPreparedCards] = useState(null);
  const [roomCard, setRoomCard] = useState(null);
  const [roomCardError, setRoomCardError] = useState(null);
  const [scoringInFlight, setScoringInFlight] = useState(false);
  const [roundCount, setRoundCount] = useState(1);
  const [priorRoomScore, setPriorRoomScore] = useState(null);
  const [streamingTurn, setStreamingTurn] = useState(null);

  // ---- Third Chair (spar) state ----
  const [position, setPosition] = useState("");
  const [sparTurns, setSparTurns] = useState([]);
  const [sparStudentInput, setSparStudentInput] = useState("");
  const [verdict, setVerdict] = useState(null);
  const [verdictLoading, setVerdictLoading] = useState(false);
  const [verdictError, setVerdictError] = useState(null);
  const [record, setRecord] = useState(() => loadRecord());

  const thinkerById = useMemo(() => {
    const m = {}; THINKERS.forEach(t => m[t.id] = t); return m;
  }, []);
  const slotAObj = slotA ? thinkerById[slotA] : null;
  const slotBObj = slotB ? thinkerById[slotB] : null;
  const hoveredObj = hoveredId ? thinkerById[hoveredId] : null;

  function goArrival() {
    setPhase("arrival"); setMode("duel"); setSlotA(null); setSlotB(null);
    setTopic(""); setExchange(null); setVisibleTurns(0);
    setLoadingText(null); setError(null); setFollowUpFor(null); setFollowUpText("");
    setStarterContext(null); setExportFeedback(null);
    setRoomCard(null); setRoomCardError(null); setPreparedCards(null); setRoundCount(1); setPriorRoomScore(null);
    setStreamingTurn(null);
    setPosition(""); setSparTurns([]); setSparStudentInput("");
    setVerdict(null); setVerdictLoading(false); setVerdictError(null);
  }
  function goMap() { setPhase("map"); setError(null); }
  function goSpar() {
    setMode("spar"); setSlotA(null); setSlotB(null);
    setPosition(""); setSparTurns([]); setSparStudentInput("");
    setVerdict(null); setVerdictLoading(false); setVerdictError(null);
    setPhase("map"); setError(null);
  }

  function playClick() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!window.__aoaCtx) window.__aoaCtx = new Ctx();
      const ctx = window.__aoaCtx;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const buf = ctx.createBuffer(1, 256, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1800;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + 0.06);
    } catch (e) { /* silent */ }
  }

  function tapStation(id) {
    const t = thinkerById[id];
    if (!t || t.kind) return;
    if (mode === "spar") {
      // One tap, one figure, straight through. No second-pick step to get
      // confused into — that ambiguity (tap a second figure out of duel-mode
      // habit, silently swap with no feedback) is exactly what read as broken.
      playClick();
      setSlotA(id);
      setPhase("composition");
      return;
    }
    if (id === slotA) { setSlotA(null); return; }
    if (id === slotB) { setSlotB(null); return; }
    if (!slotA) { playClick(); setSlotA(id); return; }
    if (!slotB) { playClick(); setSlotB(id); return; }
    setSlotA(slotB); setSlotB(id);
  }

  function warmStart(idA, idB, topicStr, contextStr) {
    setSlotA(idA); setSlotB(idB); setTopic(topicStr);
    setStarterContext(contextStr || null);
    setPhase("composition");
  }

  function goExchangeFromComposition() {
    if (!slotAObj || !slotBObj) return;
    setPhase("exchange");
    runExchange(topic);
  }

  // ---- Third Chair (spar) ----

  function sparTranscriptText(turns, aObj) {
    return turns.map(t => t.speaker === "A"
      ? `${aObj.last.toUpperCase()}: ${t.text}`
      : `STUDENT: ${t.text}`
    ).join("\n\n");
  }

  // Turn-indexed variant for the score_student verdict only — the live prompt
  // transcript above stays index-free so the Worker's extractLastOpponentTurn
  // (which matches on a bare "SPEAKER:" prefix) keeps working unchanged.
  function sparScoringTranscript(turns, aObj) {
    return turns.map((t, i) => t.speaker === "A"
      ? `[turn ${i + 1}] ${aObj.last.toUpperCase()}: ${t.text}`
      : `[turn ${i + 1}] STUDENT: ${t.text}`
    ).join("\n\n");
  }

  async function generateSparTurn({ aObj, positionText, priorTurns }) {
    const prior = sparTranscriptText(priorTurns, aObj);
    const isFirst = priorTurns.every(t => t.speaker !== "A");
    const instruction = isFirst
      ? `The student has just stated the position they will defend. Respond to it directly in your voice, applying your documented standard. Engage their actual claim, not a strawman. 2 to 4 sentences.`
      : `Respond directly to what the student just said. Engage with their specific claim. Hold your documented standard. Do not be gentle. Do not be cruel. 2 to 4 sentences.`;

    const prompt = `TOPIC: ${positionText}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${aObj.first} ${aObj.last}.

${instruction}`;

    return speakTurn({
      speakerKey: "A", prompt, maxTokens: 700,
      debatePair: { a: aObj.id, human: true, speaker: aObj.id, topic: positionText },
      speakerId: aObj.id,
    });
  }

  function recordSpar(figureId, verdictResult) {
    const rec = { ...record };
    const prev = rec[figureId] || { spars: 0, survived: 0, bestScore: 0, lastVerdict: null, date: null };
    const survived = verdictResult.verdict === "pass" || verdictResult.verdict === "survived";
    rec[figureId] = {
      spars: prev.spars + 1,
      survived: prev.survived + (survived ? 1 : 0),
      bestScore: Math.max(prev.bestScore || 0, verdictResult.survivalScore || 0),
      lastVerdict: verdictResult.verdict,
      date: new Date().toISOString().slice(0, 10),
    };
    saveRecord(rec);
    setRecord(rec);
  }

  async function scoreSpar(turnsArg) {
    if (!slotAObj) return;
    setVerdictLoading(true); setVerdictError(null);
    try {
      const transcript = sparScoringTranscript(turnsArg, slotAObj);
      const result = await callClaudeAction("score_student", { a: slotAObj.id, topic: position.trim(), transcript });
      setVerdict(result);
      recordSpar(slotAObj.id, result);
    } catch (e) {
      console.error(e);
      setVerdictError(e.userMessage || e.message || "Scoring the spar failed. The transcript above is complete — try again.");
    } finally {
      setVerdictLoading(false);
    }
  }

  async function speakFigureTurn(turnsSoFar) {
    if (!slotAObj) return;
    setLoadingText(`${slotAObj.last} is responding.`);
    try {
      const figureTurn = await generateSparTurn({ aObj: slotAObj, positionText: position.trim(), priorTurns: turnsSoFar });
      const updated = [...turnsSoFar, figureTurn];
      setSparTurns(updated);
      setLoadingText(null);
      const figureCount = updated.filter(t => t.speaker === "A").length;
      if (figureCount >= 3) {
        await scoreSpar(updated);
      }
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The figure could not respond. Try again.");
      setLoadingText(null);
    }
  }

  // If a figure turn fails mid-spar, sparTurns still ends on the student's
  // last turn (the failed reply was never appended) — retry from there
  // rather than leaving the user stuck with only the global "Leave" escape.
  async function retrySparFigureTurn() {
    setError(null);
    await speakFigureTurn(sparTurns);
  }

  async function beginSpar() {
    if (!slotAObj) return;
    const posText = position.trim();
    if (!posText || posText.length > 500) return;
    setError(null); setVerdict(null); setVerdictError(null); setVerdictLoading(false);
    setSparStudentInput("");
    const turns = [{ speaker: "student", text: posText }];
    setSparTurns(turns);
    setPhase("spar");
    await speakFigureTurn(turns);
  }

  async function submitSparTurn() {
    const text = sparStudentInput.trim();
    if (!text || !slotAObj) return;

  function wrapText(str, maxChars) {

    words.forEach(w => {

      else { cur = (cur + " " + w).trim(); }
    });
    if (cur) lines.push(cur.trim());
    return lines;
  }

  // Fetch portraits as blob data URLs — cross-origin <image href> fails in blob-URL SVGs.
  // Returns { dataURL, error } so callers can tell success from a swallowed failure.
  async function fetchPortraitDataURL(url) {
    try {
      const r = await fetch(url, { mode: "cors" });
      if (!r.ok) return { dataURL: null, error: `HTTP ${r.status}` };
      const blob = await r.blob();
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ dataURL: reader.result, error: null });
        reader.onerror = () => resolve({ dataURL: null, error: "FileReader failed" });
        reader.readAsDataURL(blob);
      });
    } catch (e) { return { dataURL: null, error: e.message || String(e) }; }
  }

  // Never fall back to the raw cross-origin URL here. A blob-wrapped SVG with a
  // cross-origin <image href> silently taints the canvas and produces a blank
  // portrait with no error surfaced. If the data URL fetch failed, render a
  // monogram instead of reintroducing the exact bug this comment sits next to.
  function monogramSVG(obj, x, y, w, h, opacity) {
    const initials = ((obj.first && obj.first !== obj.last ? obj.first[0] : "") + obj.last[0]).toUpperCase();
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1a1a1a"/>
  <text x="${x + w/2}" y="${y + h/2 + 14}" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="${Math.round(h*0.32)}" font-weight="900" text-anchor="middle" opacity="${opacity}">${initials}</text>`;
  }

  async function renderCard(svgString, filename) {
    return new Promise((resolve) => {
      const canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1080;
      const ctx2d = canvas.getContext("2d");
      ctx2d.fillStyle = "#ffffff";
      ctx2d.fillRect(0, 0, 1080, 1080);
      const blob = new Blob([svgString], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx2d.drawImage(img, 0, 0, 1080, 1080);
        canvas.toBlob(pngBlob => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(pngBlob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
          resolve();
        }, "image/png");
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(); };
      img.src = url;
    });
  }

  // Renders an SVG string to a PNG Blob without triggering a download. Used
  // by the two-card export: firing a.click() twice in the same async chain
  // (one per card, separated by await) reliably gets the second download
  // silently dropped by Safari's popup/download gate, which only trusts a
  // download call made directly inside a synchronous user-gesture handler.
  // Preparing both blobs first and downloading each from its own real click
  // (see downloadBlob + the two buttons in the exchange footer) avoids that
  // entirely instead of guessing at a timing fix.
  async function svgToPngBlob(svgString) {
    return new Promise((resolve) => {
      const canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1080;
      const ctx2d = canvas.getContext("2d");
      ctx2d.fillStyle = "#ffffff";
      ctx2d.fillRect(0, 0, 1080, 1080);
      const svgBlob = new Blob([svgString], { type: "image/svg+xml" });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        ctx2d.drawImage(img, 0, 0, 1080, 1080);
        canvas.toBlob(pngBlob => {
          URL.revokeObjectURL(url);
          resolve(pngBlob);
        }, "image/png");
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function downloadBlob(blob, filename) {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async function callClaude(prompt, maxTokens = 1500, model = "claude-sonnet-4-6", debatePair = null) {
    const res = await fetch("/api/claude", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model: model,
        max_tokens: maxTokens,
        messages:[{ role:"user", content: prompt }],
        ...(debatePair ? { debatePair } : {}),
      }),
    });
    if (res.status === 429) {
      let body = {};
      try { body = await res.json(); } catch {}
      const err = new Error(body.message || "The reading room is full for today.");
      err.code = body.error || "rate_limited";
      err.userMessage = body.message;
      throw err;
    }
    if (!res.ok) {
      let body = {};
      try { body = await res.json(); } catch {}
      throw new Error(body.error || `Server error ${res.status}`);
    }
    const data = await res.json();
    const anchors = (data && data._anchors) ? data._anchors : null;
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    let clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    // Prefer a JSON object if the model returned one, even wrapped in prose.
    let turnObj = null;
    const firstBrace = clean.indexOf("{");
    const lastBrace = clean.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      try { turnObj = JSON.parse(clean.slice(firstBrace, lastBrace + 1)); }
      catch (e) { turnObj = null; }
    }
    if (!turnObj) {
      // No parseable JSON. Model returned prose, sometimes led by a stage
      // direction like *leans forward*. Strip those so one non-JSON reply
      // does not abort the exchange.
      let body = clean.replace(/\*[^*\n]+\*/g, "");
      body = body.replace(/^[\s*"'`]+|[\s*"'`]+$/g, "");
      body = body.replace(/[ \t]{2,}/g, " ").trim();
      turnObj = { text: body || clean };
    }
    if (anchors) turnObj._anchors = anchors;
    return turnObj;
  }

  // Generic action call (score_debate, score_student, ...): posts { action, ...payload },
  // parses the JSON object out of the model's text reply. Shares the JSON-envelope
  // parsing logic with callClaude but never builds the judging prompt itself —
  // that lives server-side so the private per-figure standard never crosses the wire.
  async function callClaudeAction(action, payload) {
    const res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, ...payload }),
    });
    if (res.status === 429) {
      let body = {};
      try { body = await res.json(); } catch {}
      const err = new Error(body.message || "The reading room is full for today.");
      err.code = body.error || "rate_limited";
      err.userMessage = body.message;
      throw err;
    }
    if (!res.ok) {
      let body = {};
      try { body = await res.json(); } catch {}
      throw new Error(body.error || `Server error ${res.status}`);
    }
    const data = await res.json();
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
    const firstBrace = clean.indexOf("{");
    const lastBrace = clean.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      try { return JSON.parse(clean.slice(firstBrace, lastBrace + 1)); } catch (e) { /* fall through */ }
    }
    throw new Error("Could not parse the response");
  }

  // Streams a figure's spoken turn token by token. The Worker pipes Anthropic's
  // SSE body straight through; this reads it and calls onDelta with the
  // accumulated text as it arrives, so the UI can render a live cursor.
  async function streamClaudeTurn({ prompt, maxTokens = 700, debatePair, onDelta }) {
    const res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: maxTokens,
        messages: [{ role: "user", content: prompt }],
        ...(debatePair ? { debatePair } : {}),
        stream: true,
      }),
    });
    if (!res.ok || !res.body) {
      let errBody = {};
      try { errBody = await res.json(); } catch {}
      if (res.status === 429) {
        const err = new Error(errBody.message || "The reading room is full for today.");
        err.code = errBody.error || "rate_limited";
        err.userMessage = errBody.message;
        throw err;
      }
      throw new Error(errBody.error || `Server error ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let text = "";

    function processLine(line) {
      if (!line.startsWith("data:")) return;
      const dataStr = line.slice(5).trim();
      if (!dataStr || dataStr === "[DONE]") return;
      let evt;
      try { evt = JSON.parse(dataStr); } catch (e) { return; }
      if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
        text += evt.delta.text;
        if (onDelta) onDelta(text);
      } else if (evt.type === "error") {
        throw new Error((evt.error && evt.error.message) || "Streaming error");
      }
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) {
        // Flush whatever's left in buf: the stream can end without a
        // trailing newline after the final SSE line.
        if (buf) processLine(buf);
        break;
      }
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) processLine(line);
    }
    return text.trim();
  }

  // Post-stream anchor check: pure string match, server-side, no Anthropic call.
  // Returns null (no badge) when the figure has no case list or the turn cited none.
  async function checkAnchors(speakerId, text) {
    if (!speakerId) return null;
    try {
      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "check_anchors", speaker: speakerId, text }),
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data && data.total ? data : null;
    } catch (e) {
      return null;
    }
  }

  // Streams a spoken turn into the live `streamingTurn` state (so the transcript
  // shows a cursor as it arrives), then finalizes it into a plain turn object
  // once the stream ends and the post-stream anchor check has run.
  async function speakTurn({ speakerKey, prompt, maxTokens, debatePair, speakerId }) {
    setStreamingTurn({ speaker: speakerKey, text: "" });
    let finalText = "";
    try {
      finalText = await streamClaudeTurn({
        prompt, maxTokens, debatePair,
        onDelta: (text) => setStreamingTurn({ speaker: speakerKey, text }),
      });
    } finally {
      setStreamingTurn(null);
    }
    const anchors = await checkAnchors(speakerId, finalText);
    return { speaker: speakerKey, text: finalText, anchors };
  }

  function transcriptText(turns, aObj, bObj) {
    return turns.map(t => {
      if (t.speaker === "host") return `HOST (to ${t.target}): ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `${who.toUpperCase()}: ${t.text}`;
    }).join("\n\n");
  }

  async function generateTurn({ speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;
    const prior = transcriptText(priorTurns, aObj, bObj);

    // The dossier system block is built server-side; we send only the pair ids.

    const openingInstruction = isOpening
      ? `You are opening the exchange. Stake out your position on the topic in 2 to 3 sentences. Make a claim concrete enough that ${opponent.last} can disagree with it.`
      : `Respond directly to what ${opponent.last} just said. Engage with their specific claim. Concede what you must. Hold what you can. 2 to 4 sentences.

The debate topic is: "${topic}". Your reply must still be an answer to that question, not just a reply to ${opponent.last}'s last sentence. If their move pulled the exchange toward a different question, address their point while pulling it back toward the original topic in the same breath. Do not let the conversation wander into a different question neither of you was asked.`;

    // Dynamic only -> sits after the cache breakpoint.
    const prompt = `TOPIC: ${topic}

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}You are now speaking as ${speaker.first} ${speaker.last}.

${openingInstruction}`;

    return speakTurn({
      speakerKey, prompt, maxTokens: 600,
      debatePair: { a: aObj.id, b: bObj.id, speaker: speaker.id, topic: topic },
      speakerId: speaker.id,
    });
  }

  async function refereeAndMaybeRegenerate({ turn, speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    if (isOpening || priorTurns.length === 0) return turn;
    const lastOpponentTurn = [...priorTurns].reverse().find(t => t.speaker !== speakerKey && t.speaker !== "host");
    if (!lastOpponentTurn) return turn;

    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;

    const refPrompt = `You are a debate referee. Score whether the response below actually engages with what was just said, and whether the exchange as a whole is still answering the original topic.

TOPIC THE DEBATE IS SUPPOSED TO ANSWER:
${topic}

WHAT ${opponent.last.toUpperCase()} SAID:
${lastOpponentTurn.text}

WHAT ${speaker.last.toUpperCase()} REPLIED:
${turn.text}

Score on these:
1. Does the reply name something specific from the prior turn (a claim, an example, a word)?
2. Does the reply respond to that thing, rather than restating its own position?
3. Is the reply still an answer to the stated TOPIC? A reply can pass 1 and 2, engage tightly with the opponent's last line, and still have drifted onto a different question than the one the debate was asked. Judge this independently of 1 and 2.

Return JSON only. Schema:
{ "engages": true | false, "onTopic": true | false, "reason": "one short sentence naming which check failed, if any" }`;

    try {
      const verdict = await callClaude(refPrompt, 200, "claude-haiku-4-5-20251001");
      if (verdict.engages && verdict.onTopic) return turn;

      const prior = transcriptText(priorTurns, aObj, bObj);
      const driftNote = verdict.onTopic === false
        ? `The exchange has drifted off the original topic. Your job in this turn is to answer ${opponent.last}'s specific point AND pull the exchange back to the topic in the same breath. Name the topic explicitly if that's what it takes.`
        : `You must respond to ${opponent.last}'s most recent point directly. Quote a phrase from it. Disagree with it specifically. Do not restate your existing position.`;

      const fixPrompt = `TOPIC: ${topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${speaker.first} ${speaker.last}.

${driftNote} Do not change the subject. 2 to 4 sentences.`;

      return await speakTurn({
        speakerKey, prompt: fixPrompt, maxTokens: 600,
        debatePair: { a: aObj.id, b: bObj.id, speaker: speaker.id, topic: topic },
        speakerId: speaker.id,
      });
    } catch (e) {
      return turn;
    }
  }

  async function evaluateExchange(turnsArg, aObj, bObj, topic, opts = {}) {
    const transcript = turnsArg.map((t, i) => {
      if (t.speaker === "host") return `[host, to ${t.target}]: ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `[turn ${i+1}] ${who}: ${t.text}`;
    }).join("\n\n");

    // The judging prompt (including each figure's private test-field standard)
    // is built entirely server-side now. The client sends only ids, topic, and
    // the already-visible transcript — the standard itself never crosses the wire.
    return callClaudeAction("score_debate", { a: aObj.id, b: bObj.id, topic, transcript });
  }

  async function scoreCurrentExchange(turnsArg, aObj, bObj, topic) {
    if (!turnsArg || turnsArg.length < 4) return;
    setScoringInFlight(true);
    setRoomCardError(null);
    try {
      const card = await evaluateExchange(turnsArg, aObj, bObj, topic);
      setRoomCard(card);
    } catch (e) {
      console.error("Scoring failed:", e);
      setRoomCardError(e.userMessage || e.message || "Scoring the exchange failed. The turns are above. Try Continue or Push back.");
    } finally {
      setScoringInFlight(false);
    }
  }

  async function runExchange(topicArg) {
    if (!slotAObj || !slotBObj) return;
    setError(null); setExchange(null); setVisibleTurns(0);
    setRoomCard(null); setRoomCardError(null); setPreparedCards(null); setPriorRoomScore(null); setRoundCount(1);
    const usedTopic = (topicArg || "").trim();

    setLoadingText(`${slotAObj.last} and ${slotBObj.last} are taking their seats.`);
    let topicPhrase = usedTopic;
    if (!topicPhrase) {
      try {
        const t = await callClaude(`Two figures from advertising history are about to debate. Pick the single most productive disagreement between them. State it as a short editorial phrase, lower-case unless proper noun, no closing punctuation.

A: ${slotAObj.first} ${slotAObj.last}. ${slotAObj.bio}
B: ${slotBObj.first} ${slotBObj.last}. ${slotBObj.bio}

Return JSON only. Schema: { "topic": "the topic" }`, 200, "claude-haiku-4-5-20251001");
        topicPhrase = t.topic || "their most productive disagreement";
      } catch (e) {
        topicPhrase = "their most productive disagreement";
      }
    }

    const turns = [];
    const speakers = ["A", "B", "A", "B", "A", "B"];
    const initial = {
      topic: topicPhrase,
      turns: [],
      ...(starterContext ? { context: starterContext } : {}),
    };
    setExchange(initial);

    try {
      for (let i = 0; i < speakers.length; i++) {

            : `${speakerName} is responding to what ${opponentName} just said.`
        );

        let turn = await generateTurn({
          speakerKey,

          turn = await refereeAndMaybeRegenerate({
            turn, speakerKey,

          });

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}You are now speaking as ${speaker.first} ${speaker.last}.

        let turn = await speakTurn({

    if (!exchange || !slotAObj || !slotBObj) return;
    setError(null);

    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const startKey = lastNonHost.speaker === "A" ? "B" : "A";
    const speakers = [startKey, startKey === "A" ? "B" : "A", startKey, startKey === "A" ? "B" : "A"];
    let working = [...exchange.turns];

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speakerName = speakerKey === "A" ? slotAObj.last : slotBObj.last;
        const opponentName = speakerKey === "A" ? slotBObj.last : slotAObj.last;
        setLoadingText(`${speakerName} is responding to ${opponentName}.`);

        let turn = await generateTurn({
          speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        setLoadingText(`Checking that ${speakerName} actually responded.`);
        turn = await refereeAndMaybeRegenerate({
          turn, speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        working = [...working, turn];
        setExchange({ ...exchange, turns: working });
        setVisibleTurns(working.length);
      }
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null); setPreparedCards(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The exchange could not continue. Try again.");
      setLoadingText(null);
    }
  }

  async function pushBack() {
    if (!exchange || !slotAObj || !slotBObj) return;
    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const challengerKey = lastNonHost.speaker === "A" ? "B" : "A";
    const defenderKey = lastNonHost.speaker;
    const challengerName = challengerKey === "A" ? slotAObj.last : slotBObj.last;
    const defenderName = defenderKey === "A" ? slotAObj.last : slotBObj.last;
    const challenger = challengerKey === "A" ? slotAObj : slotBObj;
    const defender = defenderKey === "A" ? slotAObj : slotBObj;
    setError(null);

    let working = [...exchange.turns];

    try {
      setLoadingText(`${challengerName} is pushing back on ${defenderName}.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const challengePrompt = `TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${challenger.first} ${challenger.last}. The host wants you to push back hard on what ${defenderName} just said.

Push back. Name the weakness in ${defenderName}'s last point. Quote a phrase from it if you must. Be sharp, not rude. 2 to 4 sentences.`;

      const challengeTurn = await speakTurn({
        speakerKey: challengerKey, prompt: challengePrompt, maxTokens: 600,
        debatePair: { a: slotAObj.id, b: slotBObj.id, speaker: challenger.id, topic: exchange.topic },
        speakerId: challenger.id,
      });
      working = [...working, challengeTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${defenderName} is defending.`);
      let defendTurn = await generateTurn({
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${defenderName} actually responded.`);
      defendTurn = await refereeAndMaybeRegenerate({
        turn: defendTurn,
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, defendTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null); setPreparedCards(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The push back failed. Try again.");
      setLoadingText(null);
    }
  }

  async function submitFollowUp() {
    if (!followUpFor || !followUpText.trim() || !exchange || !slotAObj || !slotBObj) return;
    const targetKey = followUpFor;
    const otherKey = targetKey === "A" ? "B" : "A";
    const target = targetKey === "A" ? slotAObj : slotBObj;
    const other = otherKey === "A" ? slotAObj : slotBObj;
    const question = followUpText.trim();
    setError(null);
    setFollowUpFor(null); setFollowUpText("");

    const hostTurn = { speaker: "host", text: question, target: target.last };
    let working = [...exchange.turns, hostTurn];
    setExchange({ ...exchange, turns: working });
    setVisibleTurns(working.length);

    try {
      setLoadingText(`${target.last} is answering your question.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const answerPrompt = `TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

You are now speaking as ${target.first} ${target.last}. The host has just put a question to you. Answer it directly, in your voice. 2 to 4 sentences. Concrete. No hedging.`;

      const answerTurn = await speakTurn({
        speakerKey: targetKey, prompt: answerPrompt, maxTokens: 600,
        debatePair: { a: slotAObj.id, b: slotBObj.id, speaker: target.id, topic: exchange.topic },
        speakerId: target.id,
      });
      working = [...working, answerTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${other.last} is reacting to ${target.last}'s answer.`);
      let reactTurn = await generateTurn({
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${other.last} actually responded.`);
      reactTurn = await refereeAndMaybeRegenerate({
        turn: reactTurn,
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, reactTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null); setPreparedCards(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The follow-up could not be answered. Try again.");
      setLoadingText(null);
    }
  }

  return (
    <div className={"aoa-root" + (phase === "arrival" ? " home-white" : "")}>
      <GlobalStyle />
      <Shell phase={phase} onLeave={goArrival} onMap={goMap}>
        {phase === "arrival" && (
          <ArrivalScreen
            warmStarts={WARM_STARTS}
            thinkerById={thinkerById}
            onWarmStart={warmStart}
            onOpenMap={goMap}
            onOpenSpar={goSpar}
            record={record}
          />
        )}
        {phase === "map" && (
          <MapScreen
            mode={mode}
            slotA={slotA} slotB={slotB}
            hoveredId={hoveredId}
            hoveredObj={hoveredObj}
            onTap={tapStation}
            onHover={setHoveredId}
            onClear={() => { setSlotA(null); setSlotB(null); }}
            onLeave={goArrival}
            onBegin={() => setPhase("composition")}
          />
        )}
        {phase === "composition" && mode === "spar" && (
          <SparCompositionScreen
            slotAObj={slotAObj}
            position={position} setPosition={setPosition}
            onBegin={beginSpar}
            onSwapA={swapSparFigure}
            onLeave={goArrival}
          />
        )}
        {phase === "composition" && mode !== "spar" && (
          <CompositionScreen
            slotAObj={slotAObj} slotBObj={slotBObj}
            topic={topic} setTopic={setTopic}
            onBegin={goExchangeFromComposition}
            onSwapA={() => { setSlotA(null); setPhase("map"); }}
            onSwapB={() => { setSlotB(null); setPhase("map"); }}

        {phase === "spar" && (
          <SparScreen

            onSubmitSparTurn={submitSparTurn}
            onRetryFigureTurn={retrySparFigureTurn}
            verdict={verdict}
            verdictLoading={verdictLoading}
            verdictError={verdictError}

        {phase === "exchange" && (

function DotFieldBg() {
  const canvasRef = useRef(null);
  const glowRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const glowEl = glowRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d", { alpha: true });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const TWO_PI = Math.PI * 2;

    // ---- config (DotField, tuned for the cream arrival background) ----
    const DOT_R = 1.5;      // raise for bolder dots
    const DOT_SP = 14;
    const CURSOR_R = 500;
    const BULGE = 67;
    const GRAD_FROM = "#111111";
    const GRAD_TO = "#111111";

    let dots = [];
    const size = { w: 0, h: 0 };
    const mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
    let engagement = 0, glowOpacity = 0, frameCount = 0, raf = 0;

    function buildDots(w, h) {
      const step = DOT_R + DOT_SP;
      const cols = Math.floor(w / step), rows = Math.floor(h / step);
      const padX = (w % step) / 2, padY = (h % step) / 2;
      const arr = new Array(rows * cols); let idx = 0;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
          const ax = padX + c * step + step / 2;
          const ay = padY + r * step + step / 2;
          arr[idx++] = { ax, ay, sx: ax, sy: ay };
        }
      dots = arr;
    }

    function doResize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      size.w = w; size.h = h;
      buildDots(w, h);
    }

    let resizeTimer;
    function resize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(doResize, 100); }

    function onMouseMove(e) {
      const rect = canvas.parentElement.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    }

    function updateSpeed() {
      const dx = mouse.prevX - mouse.x, dy = mouse.prevY - mouse.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      mouse.speed += (d - mouse.speed) * 0.5;
      if (mouse.speed < 0.001) mouse.speed = 0;
      mouse.prevX = mouse.x; mouse.prevY = mouse.y;
    }

    function tick() {
      frameCount++;
      const w = size.w, h = size.h, len = dots.length;
      const targetEng = Math.min(mouse.speed / 5, 1);
      engagement += (targetEng - engagement) * 0.06;
      if (engagement < 0.001) engagement = 0;
      const eng = engagement;
      glowOpacity += (eng - glowOpacity) * 0.08;
      if (glowEl) {
        glowEl.setAttribute("cx", mouse.x);
        glowEl.setAttribute("cy", mouse.y);
        glowEl.style.opacity = glowOpacity;
      }
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, GRAD_FROM); grad.addColorStop(1, GRAD_TO);
      ctx.fillStyle = grad;
      const cr = CURSOR_R, crSq = cr * cr, rad = DOT_R / 2;
      ctx.beginPath();
      for (let i = 0; i < len; i++) {
        const d = dots[i];
        const dx = mouse.x - d.ax, dy = mouse.y - d.ay;
        const distSq = dx * dx + dy * dy;
        if (distSq < crSq && eng > 0.01) {
          const dist = Math.sqrt(distSq);
          const t = 1 - dist / cr;
          const push = t * t * BULGE * eng;
          const ang = Math.atan2(dy, dx);
          d.sx += (d.ax - Math.cos(ang) * push - d.sx) * 0.15;
          d.sy += (d.ay - Math.sin(ang) * push - d.sy) * 0.15;
        } else {
          d.sx += (d.ax - d.sx) * 0.1;
          d.sy += (d.ay - d.sy) * 0.1;
        }
        ctx.moveTo(d.sx + rad, d.sy);
        ctx.arc(d.sx, d.sy, rad, 0, TWO_PI);
      }
      ctx.fill();
      raf = requestAnimationFrame(tick);
    }

    doResize();
    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", onMouseMove, { passive: true });
    let ro = null;
    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(canvas.parentElement); }

    function cleanup() {
      cancelAnimationFrame(raf);
      clearTimeout(resizeTimer);
      if (ro) ro.disconnect();
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", onMouseMove);
    }

    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      const grad = ctx.createLinearGradient(0, 0, size.w, size.h);
      grad.addColorStop(0, GRAD_FROM); grad.addColorStop(1, GRAD_TO);
      ctx.fillStyle = grad; ctx.beginPath();
      const rad = DOT_R / 2;
      dots.forEach(d => { ctx.moveTo(d.ax + rad, d.ay); ctx.arc(d.ax, d.ay, rad, 0, TWO_PI); });
      ctx.fill();
      return cleanup;
    }

    const speedInterval = setInterval(updateSpeed, 20);
    raf = requestAnimationFrame(tick);

    return () => { clearInterval(speedInterval); cleanup(); };
  }, []);

  return (
    <React.Fragment>
      <canvas ref={canvasRef} className="dotfield-canvas" aria-hidden="true" />
      <svg className="dotfield-glow" aria-hidden="true">
        <defs>
          <radialGradient id="aoaDotGlow">
            <stop offset="0%" stopColor="rgba(20,17,13,0.05)" />
            <stop offset="100%" stopColor="transparent" />
          </radialGradient>
        </defs>
        <circle ref={glowRef} cx="-9999" cy="-9999" r="160" fill="url(#aoaDotGlow)" style={{ opacity: 0, willChange: "opacity" }} />
      </svg>
    </React.Fragment>
  );
}

function KineticTitle({ text }) {
  const ref = useRef(null);
  useEffect(() => {
    const title = ref.current;
    if (!title) return;
    const chars = Array.prototype.slice.call(title.querySelectorAll(".kt-char"));
    const cursor = { x: 0, y: 0 };
    const mouse = { x: 0, y: 0 };
    let raf = 0;

    const r0 = title.getBoundingClientRect();
    mouse.x = cursor.x = r0.left + r0.width / 2;
    mouse.y = cursor.y = r0.top + r0.height / 2;

    function onMove(e) {
      const p = e.touches ? e.touches[0] : e;
      cursor.x = p.clientX; cursor.y = p.clientY;
    }
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });

    function getAttr(d, maxD, minV, maxV) {
      const val = maxV - Math.abs((maxV * d) / maxD);
      return Math.max(minV, val + minV);
    }

    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      chars.forEach(c => { c.style.fontVariationSettings = "'wght' 600, 'wdth' 100"; });
      return () => {
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("touchmove", onMove);
      };
    }

    function tick() {
      mouse.x += (cursor.x - mouse.x) / 15;
      mouse.y += (cursor.y - mouse.y) / 15;
      const tr = title.getBoundingClientRect();
      const maxDist = Math.max(tr.width, tr.height) / 2;
      if (maxDist > 0) {
        for (let i = 0; i < chars.length; i++) {
          const c = chars[i];
          const cr = c.getBoundingClientRect();
          const cx = cr.x + cr.width / 2, cy = cr.y + cr.height / 2;
          const dx = mouse.x - cx, dy = mouse.y - cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          const wght = Math.floor(getAttr(d, maxDist, 100, 900));
          const wdth = Math.floor(getAttr(d, maxDist, 25, 151));
          const fvs = "'wght' " + wght + ", 'wdth' " + wdth;
          if (c._fvs !== fvs) { c.style.fontVariationSettings = fvs; c._fvs = fvs; }
          const lean = -getAttr(d, maxDist, 0, 12).toFixed(1);
          if (c._sk !== lean) { c.style.transform = "skewX(" + lean + "deg)"; c._sk = lean; }
        }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("touchmove", onMove);
    };
  }, []);

  const words = text.split(" ");
  return (
    <h1 className="arrival-v2-title kinetic" ref={ref} aria-label={text}>
      {words.map((w, wi) => (
        <React.Fragment key={wi}>
          <span className="kt-word">
            {w.split("").map((ch, ci) => (
              <span className="kt-char" key={ci}>{ch}</span>
            ))}
          </span>
          {wi < words.length - 1 ? <span className="kt-space"> </span> : null}
        </React.Fragment>
      ))}
    </h1>
  );
}

// ============================================================
// CANON SURFER — coverflow rail of the full canon, app-styled.
// Replaces the rotating VS pair on the arrival. Browse only;
// "Choose your two" stays the way forward.
// ============================================================
function CanonSurfer({ thinkers }) {
  const stageRef = useRef(null);
  const trackRef = useRef(null);

  useEffect(() => {
    const stage = stageRef.current;
    const track = trackRef.current;
    if (!stage || !track) return;
    const slots = Array.prototype.slice.call(track.children);
    const N = slots.length;
    if (!N) return;

    const TILT = 50, SCALE_STEP = 0.11, MIN_SCALE = 0.62, OPA_STEP = 0.16;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const inner = stage.closest(".cs-inner") || stage.parentElement;
    const colors = thinkers.map(t => (TRADITIONS[t.tradition] || {}).color);

    function metrics() {
      const cw = parseFloat(getComputedStyle(inner).getPropertyValue("--cw")) || stage.offsetWidth * 0.2;
      return { spacing: cw * 0.52, depth: cw * 0.85 };
    }

    let lastFocal = -1;
    const wrap = (o) => o - N * Math.round(o / N); // shortest signed distance around the ring
    function render(focal) {
      const m = metrics();
      for (let i = 0; i < slots.length; i++) {
        const o = wrap(i - focal), ao = Math.abs(o);
        const x = o * m.spacing, z = -ao * m.depth;
        const ry = -clamp(o, -1, 1) * TILT, y = ao * 7;
        const sc = Math.max(MIN_SCALE, 1 - ao * SCALE_STEP);
        const op = Math.max(0.08, 1 - ao * OPA_STEP);
        const s = slots[i];
        s.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) scale(${sc})`;
        s.style.opacity = op;
        s.style.zIndex = Math.round(100 - ao * 10);
        s.style.pointerEvents = op < 0.3 ? "none" : "auto";
      }
      const fi = ((Math.round(focal) % N) + N) % N;
      if (fi !== lastFocal) { lastFocal = fi; if (colors[fi]) stage.style.setProperty("--focal", colors[fi]); }
    }

    const START = Math.floor(N / 2); // open in the middle of the canon, not at Aristotle
    let pos = START, target = START;
    let dragging = false, didDrag = false, startX = 0, startPos = 0;
    let hovering = false, lastInteract = 0, raf = 0;
    const DRIFT = 0.010, EASE = 0.12, WHEEL_K = 0.0016, IDLE_MS = 2600;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const nearest = (from, idx) => from + wrap(idx - from); // land on idx the short way around

    function frame(ts) {
      if (!dragging) {
        if (!reduce && !hovering && (ts - lastInteract) > IDLE_MS) {
          target += DRIFT; // circles forever, no ends
        }
        pos += (target - pos) * EASE;
      }
      render(pos);
      raf = requestAnimationFrame(frame);
    }

    function onDown(e) { dragging = true; didDrag = false; startX = e.clientX; startPos = pos; lastInteract = performance.now(); }
    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4) didDrag = true;
      pos = startPos - dx / metrics().spacing;
    }
    function onUp() { if (!dragging) return; dragging = false; target = Math.round(pos); lastInteract = performance.now(); }
    function onWheel(e) {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; // vertical wheel scrolls the page
      e.preventDefault();
      target += e.deltaX * WHEEL_K;
      lastInteract = performance.now();
    }
    function onEnter() { hovering = true; }
    function onLeave() { hovering = false; lastInteract = performance.now(); }
    function onKey(e) {
      if (e.key === "ArrowLeft") { target = Math.round(target) - 1; lastInteract = performance.now(); e.preventDefault(); }
      if (e.key === "ArrowRight") { target = Math.round(target) + 1; lastInteract = performance.now(); e.preventDefault(); }
    }
    function onResize() { render(pos); }

    stage.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    stage.addEventListener("wheel", onWheel, { passive: false });
    stage.addEventListener("pointerenter", onEnter);
    stage.addEventListener("pointerleave", onLeave);
    stage.addEventListener("keydown", onKey);
    window.addEventListener("resize", onResize);

    const clicks = slots.map((s, i) => {
      const h = () => { if (didDrag) return; target = nearest(pos, i); lastInteract = performance.now(); };
      const f = () => { target = nearest(pos, i); lastInteract = performance.now(); };
      s.addEventListener("click", h);
      s.addEventListener("focus", f);
      return { s, h, f };
    });

    raf = requestAnimationFrame(frame);

    return () => {
      cancelAnimationFrame(raf);
      stage.removeEventListener("pointerdown", onDown);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      stage.removeEventListener("wheel", onWheel);
      stage.removeEventListener("pointerenter", onEnter);
      stage.removeEventListener("pointerleave", onLeave);
      stage.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", onResize);
      clicks.forEach(({ s, h, f }) => { s.removeEventListener("click", h); s.removeEventListener("focus", f); });
    };
  }, [thinkers]);

  return (
    <div className="cs-inner">
      <div className="cs-stage" ref={stageRef} tabIndex={0} aria-label="The canon, draggable">
        <div className="cs-track" ref={trackRef}>
          {thinkers.map((t, i) => {
            const trad = TRADITIONS[t.tradition] || { label: "", color: "#888" };
            const showFirst = t.first && t.first !== t.last;
            const initials = (showFirst ? (t.first[0] + t.last[0]) : t.last.slice(0, 2)).toUpperCase();
            return (
              <div key={t.id} className="cs-slot" tabIndex={0} role="button"
                   style={{ ['--trad']: trad.color }}
                   aria-label={`${showFirst ? t.first + " " : ""}${t.last}, ${trad.label}`}>
                <div className="cs-card" style={{ ['--tilt']: (i % 2 ? "1.2deg" : "-1.2deg") }}>
                  <div className="cs-photo">
                    <div className="cs-mono">{initials}</div>
                    {hasPortrait(t) && (
                      <img src={portraitURL(t.id)} alt="" onError={(e) => { e.currentTarget.style.display = "none"; }} />
                    )}
                  </div>
                  <div className="cs-label">
                    <div className="cs-trad">{trad.label}</div>
                    {showFirst && <div className="cs-first">{t.first}</div>}
                    <div className="cs-last">{t.last}</div>
                    <div className="cs-year">{t.year}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="cs-hint">Drag or tap to surf</div>
    </div>
  );
}

// MAP — subway map preserved, palette and chrome moved to playful

function MapScreen({ mode, slotA, slotB, hoveredId, hoveredObj, onTap, onHover, onClear, onLeave, onBegin }) {
  const singleSlot = mode === "spar";
  // Spar mode has no two-step "pick, then Begin" — a single tap goes straight
  // to composition (see tapStation). A visible Begin step here would just
  // invite the exact second tap that made the old flow ambiguous.
  const ready = !singleSlot && !!(slotA && slotB);
  const stations = THINKERS.map(t => ({
    ...t, x: COL_X[t.col], y: ROW_Y[t.tradition] + (t.offsetY || 0),
  }));

  return (
    <section className="map-screen">
      <div className="map-intro">
        <p className="map-intro-text">
          {singleSlot
            ? <><em>Take the third chair.</em> You'll argue your own position against one figure, alone — tap the one whose standard you want to be held to. One tap starts it, no second pick.</>
            : <><em>The Anatomy of Advertising</em> maps an argument that's been running since Aristotle. Eight lenses, thirty-two voices. Pick two to set them against each other.</>}
        </p>
      </div>

      <div className="map-prelude">
        <div className="map-prelude-pill">
          <span className="live-dot"></span>
          {singleSlot
            ? <span>Tap one figure to begin</span>
            : (<>
                {!slotA && !slotB && <span>Pick two figures</span>}
                {slotA && !slotB && <span>One picked. Pick one more.</span>}
                {slotA && slotB && <span>Both picked. Begin when ready.</span>}
              </>)}
        </div>
        {(slotA || slotB) && (
          <button onClick={onClear} className="map-clear-btn">Clear</button>
        )}
      </div>

      {ready && (
        <div className="map-begin-bar">
          <button onClick={onBegin} className="map-begin-btn">
            <span>Begin</span>
            <span className="map-begin-arrow">→</span>
          </button>
        </div>
      )}

      <MobileMapList slotA={slotA} slotB={slotB} onTap={onTap} />

      <div className="map-scroll-hint">
        <span className="scroll-hint-arrow">→</span>
        <span>Scroll right to see all 32</span>
      </div>

      <div className="map-legend" aria-label="Lens legend">
        <div className="map-legend-label">The eight lenses</div>
        <ul className="map-legend-list">
          {TRAD_ORDER.map(tradId => (
            <li key={tradId} className="map-legend-item">
              <span className="map-legend-swatch" style={{ background: TRADITIONS[tradId].color }}></span>
              <span className="map-legend-name">{TRADITIONS[tradId].label}</span>
            </li>
          ))}
        </ul>
      </div>

      <div className="map-scroll map-svg-wrapper">
        <svg viewBox={`0 0 ${VIEWBOX_W} ${VIEWBOX_H}`} className="map-svg">
          {TRAD_ORDER.map(tradId => {
            const list = stations.filter(s => s.tradition === tradId && !s.offsetY)
              .sort((a,b) => a.x - b.x);
            if (list.length === 0) return null;
            const y = ROW_Y[tradId];
            return (
              <line key={tradId}
                x1={list[0].x - 40} y1={y}
                x2={list[list.length-1].x + 60} y2={y}
                stroke={TRADITIONS[tradId].color}
                strokeWidth={9} strokeLinecap="round" />
            );
          })}

          {BRIDGES.map((b, i) => (
            <line key={i}
              x1={COL_X[b.col]} y1={ROW_Y[b.fromTrad]}
              x2={COL_X[b.col]} y2={ROW_Y[b.toTrad]}
              stroke="#14110D" strokeWidth={2.5} strokeDasharray="5 4" opacity={0.4} />
          ))}

          {stations.map(s => {
            const trad = TRADITIONS[s.tradition];
            const selected = s.id === slotA || s.id === slotB;
            const slotLabel = s.id === slotA ? "A" : s.id === slotB ? "B" : null;
            const hovered = s.id === hoveredId;
            const isKind = !!s.kind;
            const showPortrait = hasPortrait(s);
            const portraitR = 22;
            const dotR = isKind ? 5 : (s.interchange ? 11 : 7);
            const r = showPortrait ? portraitR : dotR;
            const clipId = `portrait-clip-${s.id}`;
            return (
              <g key={s.id} style={{ cursor: isKind ? "help" : "pointer" }}
                onMouseEnter={() => onHover(s.id)}
                onMouseLeave={() => onHover(null)}
                onClick={() => onTap(s.id)}>
                <rect x={s.x-44} y={s.y-portraitR-4} width={88} height={portraitR*2+8} fill="transparent" pointerEvents="all" />

                {showPortrait ? (
                  <>
                    <defs>
                      <clipPath id={clipId}>
                        <circle cx={s.x} cy={s.y} r={portraitR} />
                      </clipPath>
                    </defs>
                    <circle cx={s.x} cy={s.y} r={portraitR} fill="#FFFFFF" clipPath={`url(#${clipId})`} />
                    <image
                      href={portraitURL(s.id)}
                      xlinkHref={portraitURL(s.id)}
                      x={s.x - portraitR} y={s.y - portraitR}
                      width={portraitR * 2} height={portraitR * 2}
                      clipPath={`url(#${clipId})`}
                      preserveAspectRatio="xMidYMid slice"
                      onError={(e) => { e.currentTarget.style.display = "none"; }}
                    />
                    <circle cx={s.x} cy={s.y} r={portraitR}
                      fill="none" stroke={trad.color}
                      strokeWidth={selected ? 3 : (hovered ? 2.5 : 2)} />
                  </>
                ) : (
                  <>
                    {s.interchange && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+5} fill="none" stroke={trad.color} strokeWidth={3} />
                    )}
                    {isKind ? (
                      <circle cx={s.x} cy={s.y} r={4}
                        fill="#FFFFFF" stroke={trad.color}
                        strokeWidth={1} strokeDasharray="2 1.5" opacity={0.85} />
                    ) : (
                      <circle cx={s.x} cy={s.y} r={dotR}
                        fill={s.ghost ? "#FFFFFF" : "#14110D"}
                        stroke={s.ghost ? trad.color : "#14110D"}
                        strokeWidth={s.ghost ? 2.5 : 2}
                        strokeDasharray={s.ghost ? "3 2" : undefined} />
                    )}
                    {hovered && !selected && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+6} fill="none" stroke={trad.color} strokeWidth={2} opacity={0.5} />
                    )}
                  </>
                )}

                {selected && (
                  <>
                    <circle cx={s.x} cy={s.y} r={r+8} fill="none" stroke="#FF4D2E" strokeWidth={3} opacity={0.9} />
                    <rect x={s.x+r+8} y={s.y-9} width={20} height={18} fill="#FF4D2E" rx={3} />
                    <text x={s.x+r+18} y={s.y+4} fill="#fff"
                      fontFamily="Geist Mono, monospace"
                      fontSize={11} fontWeight={700} textAnchor="middle">{slotLabel}</text>
                  </>
                )}

                <text x={s.x} y={s.y - r - 8} fill={isKind ? trad.color : "#14110D"}
                  fontFamily={isKind ? "Instrument Serif, serif" : "Geist, sans-serif"}
                  fontSize={isKind ? 12 : 11}
                  fontWeight={isKind ? 400 : 600}
                  fontStyle={isKind ? "italic" : "normal"}
                  textAnchor="middle"
                  letterSpacing={isKind ? 0 : 0.5}
                  opacity={isKind ? 0.75 : (hovered ? 1 : 0.92)}>
                  {isKind ? `${s.first} ${s.last}` : (s.last.startsWith('&') ? `${s.first} ${s.last}` : s.last)}
                </text>
                <text x={s.x} y={s.y + r + 16} fill="#8B8576"
                  fontFamily="Geist Mono, monospace"
                  fontSize={9} textAnchor="middle" letterSpacing={0.5}>
                  {s.year}
                </text>
              </g>
            );
          })}

          {TRAD_ORDER.map(tradId => {
            const list = stations.filter(s => s.tradition === tradId).sort((a,b)=>a.x-b.x);
            if (list.length === 0) return null;
            return (
              <text key={`lbl-${tradId}`}
                x={list[list.length-1].x + 80} y={ROW_Y[tradId]+5}
                fill={TRADITIONS[tradId].color}
                fontFamily="Geist Mono, monospace"
                fontSize={11} fontWeight={600} letterSpacing={1.4}>
                {TRADITIONS[tradId].label.toUpperCase()}
              </text>
            );
          })}
        </svg>
      </div>

      {hoveredObj && (
        <div className="map-hover-card" style={{ ['--trad']: TRADITIONS[hoveredObj.tradition].color }}>
          {hasPortrait(hoveredObj) && (
            <img src={portraitURL(hoveredObj.id)} alt=""
              className="map-hover-portrait"
              style={{ borderColor: TRADITIONS[hoveredObj.tradition].color }} />
          )}
          <div className="map-hover-meta">
            {TRADITIONS[hoveredObj.tradition].label} · {hoveredObj.year}
          </div>
          <div className="map-hover-name">
            {hoveredObj.kind ? <em>{hoveredObj.first} {hoveredObj.last}</em> : `${hoveredObj.first} ${hoveredObj.last}`}
          </div>
          <p className="map-hover-bio">{hoveredObj.bio}</p>
          <div className="map-hover-note">
            {hoveredObj.kind
              ? KIND_NOTES[hoveredObj.kind]
              : CONFIDENCE_NOTES[getConfidence(hoveredObj)]}
          </div>
        </div>
      )}
    </section>
  );
}

  const [actionsReady, setActionsReady] = useState(false);
  useEffect(() => {

  const suggestions = ["the brief", "creativity", "what counts as proof", "attention", "what research should do"];

      <section className="composition">

            <div className="comp-card-photo">
              {hasPortrait(slotBObj) && <img src={portraitURL(slotBObj.id)} alt="" />}
            </div>
            <div className="comp-card-meta">
              <div className="comp-card-trad">{tradB.label}</div>
              <div className="comp-card-name">

                <span className="comp-last">{slotBObj.last}</span>

// ============================================================
// EXCHANGE — turns arrive in time, controls as game actions
// ============================================================
function ExchangeScreen({
  slotAObj, slotBObj, exchange, visibleTurns, loadingText, streamingTurn, error,
  followUpFor, followUpText, setFollowUpFor, setFollowUpText, onSubmitFollowUp,
  onContinue, onPushBack, onChangeRoom, onLeave, onExport, exportFeedback,
  onDownloadCards, cardGenerating, preparedCards, onDownloadPreparedCard,
  roomCard, roomCardError, scoringInFlight, onPushHarder, onNewQuestion, roundCount, priorRoomScore,
}) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const tradB = slotBObj ? TRADITIONS[slotBObj.tradition] : null;

  const allTurnsRevealed = exchange && visibleTurns >= exchange.turns.length;
  const lastRevealed = exchange && visibleTurns > 0 ? exchange.turns[visibleTurns-1] : null;
  const lastSpeakerId = lastRevealed ? lastRevealed.speaker : null;
  const dimA = !!lastSpeakerId && lastSpeakerId !== "A" && lastSpeakerId !== "host" && !allTurnsRevealed;
  const dimB = !!lastSpeakerId && lastSpeakerId !== "B" && lastSpeakerId !== "host" && !allTurnsRevealed;

  const transcriptRef = useRef(null);
  useEffect(() => {
    if (transcriptRef.current && (visibleTurns > 0 || streamingTurn)) {
      const last = transcriptRef.current.querySelector('.turn:last-child');
      if (last) last.scrollIntoView({ behavior: "smooth", block: "end" });
    }
  }, [visibleTurns, streamingTurn]);

  if (!slotAObj || !slotBObj) return null;

  return (
    <section className="exchange">
      <header className="exchange-masthead">
        <ParticipantLine thinker={slotAObj} trad={tradA} dim={dimA} align="left" />
        <div className="exchange-topic">
          <div className="exchange-topic-label">In conversation</div>
          {exchange?.topic ? (
            <div className="exchange-topic-text">{exchange.topic}</div>
          ) : (
            <div className="exchange-topic-text exchange-topic-pending">···</div>
          )}
        </div>
        <ParticipantLine thinker={slotBObj} trad={tradB} dim={dimB} align="right" />
      </header>

      <p className="exchange-disclaimer">
        Reconstructions. Positions drawn from published work, voices approximated. Informed pastiche, not direct quotation.
      </p>

      {exchange?.context && (
        <div className="exchange-context">
          <div className="exchange-context-label">A primer, before they begin</div>
          <p className="exchange-context-body">{exchange.context}</p>
        </div>
      )}

      <div className="exchange-body" ref={transcriptRef}>
        {error && <p className="exchange-error">{error}</p>}

        {!exchange && loadingText && (
          <div className="exchange-loading">
            <p>{loadingText}</p>
          </div>
        )}

        {exchange && exchange.turns.slice(0, visibleTurns).map((turn, i) => {
          if (turn.speaker === "host") {
            return <HostTurn key={i} text={turn.text} target={turn.target} />;
          }
          const speaker = turn.speaker === "A" ? slotAObj : slotBObj;
          const trad = TRADITIONS[speaker.tradition];
          return <Turn key={i} turn={turn} speaker={speaker} trad={trad} />;
        })}

        {exchange && <StreamingTurn streamingTurn={streamingTurn} slotAObj={slotAObj} slotBObj={slotBObj} />}

        {exchange && loadingText && !streamingTurn && (
          <div className="exchange-loading exchange-loading-inline">
            <p>{loadingText}</p>
          </div>
        )}
      </div>

      {exchange && allTurnsRevealed && !loadingText && (
        <ReportCard
          card={roomCard}
          loading={scoringInFlight}
          error={roomCardError}
          slotAObj={slotAObj}
          slotBObj={slotBObj}
          tradA={tradA}
          tradB={tradB}
          roundCount={roundCount}
          priorRoomScore={priorRoomScore}
          turns={exchange.turns}
        />
      )}

      {exchange && allTurnsRevealed && !loadingText && (
        <footer className="exchange-controls">
          {followUpFor ? (
            <div className="followup">
              <div className="followup-label">
                Question for <strong style={{ color: TRADITIONS[(followUpFor === "A" ? slotAObj : slotBObj).tradition].color }}>
                  {(followUpFor === "A" ? slotAObj : slotBObj).last}
                </strong>
              </div>
              <input
                className="followup-input"
                value={followUpText}
                onChange={(e)=>setFollowUpText(e.target.value)}
                onKeyDown={(e)=>{ if(e.key==="Enter") onSubmitFollowUp(); }}
                placeholder="Ask whatever is sharper than what they just said."
                autoFocus
              />
              <div className="followup-actions">
                <button className="followup-submit" onClick={onSubmitFollowUp} disabled={!followUpText.trim()}>
                  Ask <span>→</span>
                </button>
                <button className="aoa-link aoa-link-quiet" onClick={() => { setFollowUpFor(null); setFollowUpText(""); }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <div className="exchange-controls-row">
              {roomCard && (
                <>
                  <button className="ctrl ctrl-primary" onClick={onPushHarder} disabled={!roomCard}>
                    Push them harder
                  </button>
                  <button className="ctrl" onClick={onNewQuestion}>
                    New question, same pair
                  </button>
                  <span className="ctrl-divider" />
                </>
              )}
              <button className="ctrl" onClick={onContinue}>Continue</button>
              <button className="ctrl" onClick={onPushBack}>Push back</button>
              <button className="ctrl" onClick={() => { setFollowUpFor("A"); }}>
                Ask <span style={{ color: tradA.color }}>{slotAObj.last}</span>
              </button>
              <button className="ctrl" onClick={() => { setFollowUpFor("B"); }}>
                Ask <span style={{ color: tradB.color }}>{slotBObj.last}</span>
              </button>
              <span className="ctrl-divider" />
              <button className="ctrl ctrl-export" onClick={onExport}>
                {exportFeedback ? <em>{exportFeedback}</em> : "Take it with you"}
              </button>
              {preparedCards ? (
                <>
                  <button className="ctrl ctrl-cards" onClick={() => onDownloadPreparedCard(preparedCards.card1)}>
                    Download card 1
                  </button>
                  <button className="ctrl ctrl-cards" onClick={() => onDownloadPreparedCard(preparedCards.card2)}>
                    Download card 2
                  </button>
                </>
              ) : (
                <button className="ctrl ctrl-cards" onClick={onDownloadCards} disabled={cardGenerating || !roomCard}>
                  {cardGenerating ? <em>Preparing cards…</em> : "Prepare cards"}
                </button>
              )}
              <button className="aoa-link aoa-link-quiet" onClick={onChangeRoom}>Change room</button>
            </div>
          )}
        </footer>
      )}
    </section>
  );
}

function ConfidenceNote({ conf, align }) {
  const [open, setOpen] = useState(false);
  if (!conf) return null;
  return (
    <div className={`confidence-note conf-${align}`}>
      <button
        className="confidence-trigger"
        onMouseEnter={() => setOpen(true)}
        onMouseLeave={() => setOpen(false)}
        onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}
        aria-expanded={open}
      >
        {CONFIDENCE_NOTES[conf]} <span className="confidence-mark">?</span>
      </button>
      {open && (
        <div className="confidence-tip" role="tooltip">
          {CONFIDENCE_EXPLANATIONS[conf]}
        </div>
      )}
    </div>
  );
}

function MobileMapList({ slotA, slotB, onTap }) {
  return (
    <div className="map-list">
      {TRAD_ORDER.map(tradId => {
        const items = THINKERS.filter(t => t.tradition === tradId);
        if (items.length === 0) return null;
        const trad = TRADITIONS[tradId];
        return (
          <div key={tradId} className="map-list-section">
            <div className="map-list-tradition" style={{ color: trad.color, borderBottomColor: trad.color }}>
              {trad.label}
            </div>
            <ul className="map-list-items">
              {items.map(t => {
                const selected = t.id === slotA || t.id === slotB;
                const slotLabel = t.id === slotA ? "A" : t.id === slotB ? "B" : null;
                const conf = getConfidence(t);
                const portrait = hasPortrait(t);
                return (
                  <li key={t.id} className={`map-list-item ${selected ? "is-selected" : ""} ${t.kind ? "is-kind" : ""}`}>
                    <button
                      onClick={() => onTap(t.id)}
                      disabled={!!t.kind}
                      className="map-list-btn"
                      style={selected ? { background: "#FF4D2E", color: "#fff" } : {}}
                    >
                      {portrait && (
                        <img src={portraitURL(t.id)} alt="" className="map-list-portrait" style={{ borderColor: trad.color }} />
                      )}
                      <div className="map-list-name">
                        {t.kind ? <em>{t.first} {t.last}</em> : <strong>{t.first} {t.last}</strong>}
                      </div>
                      <div className="map-list-meta">
                        <span>{t.year}</span>
                        {t.kind ? (
                          <span className="map-list-note">{KIND_NOTES[t.kind]}</span>

function ParticipantLine({ thinker, trad, dim, align }) {
  const portrait = hasPortrait(thinker);
  return (
    <div className={`participant ${dim ? "is-dim" : ""} part-${align}`} style={{ ['--trad']: trad.color, textAlign: align }}>
      {portrait && (
        <img src={portraitURL(thinker.id)} alt="" className="participant-portrait" style={{ borderColor: trad.color }} />
      )}
      <div className="participant-meta">{trad.label}</div>
      <div className="participant-name">
        <span className="participant-first">{thinker.first}</span>
        <span className="participant-last">{thinker.last}</span>
      </div>
      <div className="participant-year">{thinker.year}</div>
    </div>
