// ============================================================
// MAIN
// ============================================================
function AnatomyOfAdvertising() {
  const [phase, setPhase] = useState("arrival");
  const [slotA, setSlotA] = useState(null);
  const [slotB, setSlotB] = useState(null);
  const [topic, setTopic] = useState("");
  const [exchange, setExchange] = useState(null);
  const [visibleTurns, setVisibleTurns] = useState(0);
  const [loadingText, setLoadingText] = useState(null);
  const [error, setError] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [followUpFor, setFollowUpFor] = useState(null);
  const [followUpText, setFollowUpText] = useState("");
  const [starterContext, setStarterContext] = useState(null);
  const [exportFeedback, setExportFeedback] = useState(null);
  const [roomCard, setRoomCard] = useState(null);
  const [roomCardError, setRoomCardError] = useState(null);
  const [scoringInFlight, setScoringInFlight] = useState(false);
  const [roundCount, setRoundCount] = useState(1);
  const [priorRoomScore, setPriorRoomScore] = useState(null);

  const thinkerById = useMemo(() => {
    const m = {}; THINKERS.forEach(t => m[t.id] = t); return m;
  }, []);
  const slotAObj = slotA ? thinkerById[slotA] : null;
  const slotBObj = slotB ? thinkerById[slotB] : null;
  const hoveredObj = hoveredId ? thinkerById[hoveredId] : null;

  function goArrival() {
    setPhase("arrival"); setSlotA(null); setSlotB(null);
    setTopic(""); setExchange(null); setVisibleTurns(0);
    setLoadingText(null); setError(null); setFollowUpFor(null); setFollowUpText("");
    setStarterContext(null); setExportFeedback(null);
    setRoomCard(null); setRoomCardError(null); setRoundCount(1); setPriorRoomScore(null);
  }
  function goMap() { setPhase("map"); setError(null); }

  function playClick() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!window.__aoaCtx) window.__aoaCtx = new Ctx();
      const ctx = window.__aoaCtx;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const buf = ctx.createBuffer(1, 256, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1800;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
      src.stop(now + 0.06);
    } catch (e) { /* silent */ }
  }

  function tapStation(id) {
    const t = thinkerById[id];
    if (!t || t.kind) return;
    if (id === slotA) { setSlotA(null); return; }
    if (id === slotB) { setSlotB(null); return; }
    if (!slotA) { playClick(); setSlotA(id); return; }
    if (!slotB) { playClick(); setSlotB(id); return; }
    setSlotA(slotB); setSlotB(id);
  }

  function warmStart(idA, idB, topicStr, contextStr) {
    setSlotA(idA); setSlotB(idB); setTopic(topicStr);
    setStarterContext(contextStr || null);
    setPhase("composition");
  }

  function goExchangeFromComposition() {
    if (!slotAObj || !slotBObj) return;
    setPhase("exchange");
    runExchange(topic);
  }

  function changeRoom() {
    setExchange(null); setVisibleTurns(0); setError(null);
    setFollowUpFor(null); setFollowUpText("");
    setPhase("composition");
  }

  function exportToMarkdown() {
    if (!exchange || !slotAObj || !slotBObj) return;
    const lines = [];
    lines.push(`# ${slotAObj.first} ${slotAObj.last} & ${slotBObj.first} ${slotBObj.last}`);
    lines.push("");
    lines.push(`*${exchange.topic}*`);
    lines.push("");
    if (exchange.context) {
      lines.push(`> ${exchange.context}`);
      lines.push("");
    }
    lines.push("---");
    lines.push("");
    exchange.turns.forEach(turn => {
      if (turn.speaker === "host") {
        lines.push(`**Host, to ${turn.target}**`);
        lines.push("");
        lines.push(`*${turn.text}*`);
      } else {
        const speaker = turn.speaker === "A" ? slotAObj : slotBObj;
        lines.push(`**${speaker.first} ${speaker.last}** (${speaker.year}) · ${TRADITIONS[speaker.tradition].label}`);
        lines.push("");
        lines.push(turn.text);
      }
      lines.push("");
    });
    lines.push("---");
    lines.push("");
    lines.push("*Reconstructions. Positions drawn from published work, voices approximated. Informed pastiche, not direct quotation.*");
    lines.push("");
    lines.push("From The Anatomy of Advertising — a graduate-level course in advertising theory and history.");
    const md = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(() => {
        setExportFeedback("Copied to clipboard");
        setTimeout(() => setExportFeedback(null), 2400);
      }).catch(() => {
        setExportFeedback("Copy failed — try again");
        setTimeout(() => setExportFeedback(null), 2400);
      });
    } else {
      setExportFeedback("Clipboard not available in this browser");
      setTimeout(() => setExportFeedback(null), 2400);
    }
  }

  async function callClaude(prompt, maxTokens = 1500) {
    const res = await fetch("/api/claude", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens: maxTokens,
        messages:[{ role:"user", content: prompt }],
      }),
    });
    if (res.status === 429) {
      let body = {};
      try { body = await res.json(); } catch {}
      const err = new Error(body.message || "The reading room is full for today.");
      err.code = body.error || "rate_limited";
      err.userMessage = body.message;
      throw err;
    }
    if (!res.ok) {
      let body = {};
      try { body = await res.json(); } catch {}
      throw new Error(body.error || `Server error ${res.status}`);
    }
    const data = await res.json();
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    let clean = text.replace(/```json/g,"").replace(/```/g,"").trim();
    // If there is leading/trailing text around the JSON, extract the outermost {...} block.
    const firstBrace = clean.indexOf("{");
    const lastBrace = clean.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      clean = clean.slice(firstBrace, lastBrace + 1);
    }
    return JSON.parse(clean);
  }

  function transcriptText(turns, aObj, bObj) {
    return turns.map(t => {
      if (t.speaker === "host") return `HOST (to ${t.target}): ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `${who.toUpperCase()}: ${t.text}`;
    }).join("\n\n");
  }

  async function generateTurn({ speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;
    const prior = transcriptText(priorTurns, aObj, bObj);

    const openingInstruction = isOpening
      ? `You are opening the exchange. Stake out your position on the topic in 2 to 3 sentences. Make a claim concrete enough that ${opponent.last} can disagree with it.`
      : `Respond directly to what ${opponent.last} just said. Engage with their specific claim. Concede what you must. Hold what you can. 2 to 4 sentences.`;

    const prompt = `You are speaking as ${speaker.first} ${speaker.last} (${speaker.year}), in conversation with ${opponent.first} ${opponent.last} (${opponent.year}).

YOUR POSITION: ${speaker.bio}
THEIR POSITION: ${opponent.bio}
TOPIC: ${topic}

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}NOW IT IS YOUR TURN.

${openingInstruction}

Voice rules:
- In the voice of ${speaker.last}, sounding like they would actually sound.
- Practitioner register. Short declarative sentences. No hedging.
- Concrete reference to your ideas, methods, work, or examples.
- No pleasantries. No "I would argue." No academic puff. No em dashes.
- Do not summarize the topic. Speak.

Return JSON only. No preamble. No fences. Schema:
{ "text": "your turn" }`;

    const result = await callClaude(prompt, 600);
    return { speaker: speakerKey, text: result.text };
  }

  async function refereeAndMaybeRegenerate({ turn, speakerKey, aObj, bObj, topic, priorTurns, isOpening }) {
    if (isOpening || priorTurns.length === 0) return turn;
    const lastOpponentTurn = [...priorTurns].reverse().find(t => t.speaker !== speakerKey && t.speaker !== "host");
    if (!lastOpponentTurn) return turn;

    const speaker = speakerKey === "A" ? aObj : bObj;
    const opponent = speakerKey === "A" ? bObj : aObj;

    const refPrompt = `You are a debate referee. Score whether the response below actually engages with what was just said, or whether it monologues past it.

WHAT ${opponent.last.toUpperCase()} SAID:
${lastOpponentTurn.text}

WHAT ${speaker.last.toUpperCase()} REPLIED:
${turn.text}

Score on these:
1. Does the reply name something specific from the prior turn (a claim, an example, a word)?
2. Does the reply respond to that thing, rather than restating its own position?

Return JSON only. Schema:
{ "engages": true | false, "reason": "one short sentence" }`;

    try {
      const verdict = await callClaude(refPrompt, 200);
      if (verdict.engages) return turn;

      const speaker2 = speakerKey === "A" ? aObj : bObj;
      const opponent2 = speakerKey === "A" ? bObj : aObj;
      const prior = transcriptText(priorTurns, aObj, bObj);
      const fixPrompt = `You are speaking as ${speaker2.first} ${speaker2.last} (${speaker2.year}), in conversation with ${opponent2.first} ${opponent2.last}.

YOUR POSITION: ${speaker2.bio}
THEIR POSITION: ${opponent2.bio}
TOPIC: ${topic}

THE EXCHANGE SO FAR:
${prior}

NOW IT IS YOUR TURN.

You must respond to ${opponent2.last}'s most recent point directly. Quote a phrase from it. Disagree with it specifically. Do not restate your existing position. Do not change the subject. 2 to 4 sentences. No em dashes. No academic puff.

Return JSON only. Schema: { "text": "your turn" }`;

      const fixed = await callClaude(fixPrompt, 600);
      return { speaker: speakerKey, text: fixed.text };
    } catch (e) {
      return turn;
    }
  }

  async function evaluateExchange(turnsArg, aObj, bObj, topic, opts = {}) {
    const transcript = turnsArg.map((t, i) => {
      if (t.speaker === "host") return `[host, to ${t.target}]: ${t.text}`;
      const who = t.speaker === "A" ? aObj.last : bObj.last;
      return `[turn ${i+1}] ${who}: ${t.text}`;
    }).join("\n\n");

    const prompt = `You are a referee scoring a simulated debate between two figures from advertising history. The simulation is a reconstruction, not direct quotation. Your job is to score two things, in editorial register.

FIGURE A: ${aObj.first} ${aObj.last} (${aObj.year})
A's documented position and work: ${aObj.bio}

FIGURE B: ${bObj.first} ${bObj.last} (${bObj.year})
B's documented position and work: ${bObj.bio}

TOPIC: ${topic}

TRANSCRIPT:
${transcript}

SCORE ONE — ROOM SCORE (0-100). How well did this function as a real argument? Score five dimensions, each 0-20:
- engagement: Did each turn respond to the prior turn, or monologue past it?
- specificity: Did each speaker reference their own work concretely, or stay abstract?
- concession: Did either speaker grant a real point, or did they hold their position untouched?
- escalation: Did the argument get sharper across turns, or did it flatten?
- productiveness: Did the exchange surface real intellectual ground, or rehash known positions?
Sum the five for the Room Score.

SCORE TWO — VOICE FIDELITY (0-100 per figure). How close did the reconstruction sit to the documented record for each figure? For each speaker, evaluate:
- Did they reference something concrete from their actual work, methods, or examples?
- Did the register match their period and idiom?
- Were factual claims consistent with what they actually published?
Score each figure 0-100 independently. Tier-three figures with limited firsthand record will score lower. That is correct and surfaces the disclaimer.

MOVE OF THE ROUND: Identify the single sharpest turn in the exchange. Give the turn number, the speaker (A or B), and one sentence on why it landed. Quote a phrase under 12 words from the turn itself.

OPEN GROUND: For each figure, in one sentence, what does their position need to address that this exchange did not? This is the pedagogical payload. Specific. Not generic.

Return JSON only. No preamble. No fences. Schema:
{
  "roomScore": number,
  "rubric": {
    "engagement": number,
    "specificity": number,
    "concession": number,
    "escalation": number,
    "productiveness": number
  },
  "roomNote": "one short editorial sentence summarizing the exchange",
  "voiceFidelityA": number,
  "voiceFidelityB": number,
  "voiceNoteA": "one short note on A's reconstruction",
  "voiceNoteB": "one short note on B's reconstruction",
  "moveOfRound": {
    "turnIndex": number,
    "speaker": "A or B (one letter)",
    "quote": "phrase from that turn, under 12 words",
    "reason": "one sentence on why it landed"
  },
  "openGroundA": "one sentence on what A needs to address",
  "openGroundB": "one sentence on what B needs to address"
}`;

    const result = await callClaude(prompt, 1200);
    return result;
  }

  async function scoreCurrentExchange(turnsArg, aObj, bObj, topic) {
    if (!turnsArg || turnsArg.length < 4) return;
    setScoringInFlight(true);
    setRoomCardError(null);
    try {
      const card = await evaluateExchange(turnsArg, aObj, bObj, topic);
      setRoomCard(card);
    } catch (e) {
      console.error("Scoring failed:", e);
      setRoomCardError(e.userMessage || e.message || "Scoring the exchange failed. The turns are above. Try Continue or Push back.");
    } finally {
      setScoringInFlight(false);
    }
  }

  async function runExchange(topicArg) {
    if (!slotAObj || !slotBObj) return;
    setError(null); setExchange(null); setVisibleTurns(0);
    setRoomCard(null); setRoomCardError(null); setPriorRoomScore(null); setRoundCount(1);
    const usedTopic = (topicArg || "").trim();

    setLoadingText(`${slotAObj.last} and ${slotBObj.last} are taking their seats.`);
    let topicPhrase = usedTopic;
    if (!topicPhrase) {
      try {
        const t = await callClaude(`Two figures from advertising history are about to debate. Pick the single most productive disagreement between them. State it as a short editorial phrase, lower-case unless proper noun, no closing punctuation.

A: ${slotAObj.first} ${slotAObj.last}. ${slotAObj.bio}
B: ${slotBObj.first} ${slotBObj.last}. ${slotBObj.bio}

Return JSON only. Schema: { "topic": "the topic" }`, 200);
        topicPhrase = t.topic;
      } catch (e) {
        topicPhrase = "their most productive disagreement";
      }
    }

    const turns = [];
    const speakers = ["A", "B", "A", "B", "A", "B"];
    const initial = {
      topic: topicPhrase,
      turns: [],
      ...(starterContext ? { context: starterContext } : {}),
    };
    setExchange(initial);

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speakerName = speakerKey === "A" ? slotAObj.last : slotBObj.last;
        const opponentName = speakerKey === "A" ? slotBObj.last : slotAObj.last;
        setLoadingText(
          i === 0
            ? `${speakerName} is opening.`
            : `${speakerName} is responding to what ${opponentName} just said.`
        );

        let turn = await generateTurn({
          speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: topicPhrase,
          priorTurns: turns,
          isOpening: i === 0,
        });

        if (i > 0) {
          setLoadingText(`Checking that ${speakerName} actually responded.`);
          turn = await refereeAndMaybeRegenerate({
            turn, speakerKey,
            aObj: slotAObj, bObj: slotBObj,
            topic: topicPhrase,
            priorTurns: turns,
            isOpening: false,
          });
        }

        turns.push(turn);
        setExchange({ ...initial, turns: [...turns] });
        setVisibleTurns(turns.length);
      }
      setLoadingText(null);
      scoreCurrentExchange(turns, slotAObj, slotBObj, topicPhrase);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The room could not be set. Try again.");
      setLoadingText(null);
    }
  }

  async function pushHarder() {
    if (!exchange || !roomCard || !slotAObj || !slotBObj) return;
    setPriorRoomScore(roomCard.roomScore);
    setRoundCount(r => r + 1);
    setError(null);

    const topicPhrase = exchange.topic;
    setExchange(null); setVisibleTurns(0);
    const newInitial = {
      topic: topicPhrase,
      turns: [],
      ...(starterContext ? { context: starterContext } : {}),
      pressure: {
        priorRoomScore: roomCard.roomScore,
        openGroundA: roomCard.openGroundA,
        openGroundB: roomCard.openGroundB,
      },
    };
    setExchange(newInitial);
    setRoomCard(null); setRoomCardError(null);

    const turns = [];
    const speakers = ["A", "B", "A", "B", "A", "B"];

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speaker = speakerKey === "A" ? slotAObj : slotBObj;
        const opponent = speakerKey === "A" ? slotBObj : slotAObj;
        const speakerOpenGround = speakerKey === "A" ? roomCard.openGroundA : roomCard.openGroundB;
        setLoadingText(
          i === 0
            ? `${speaker.last} is opening, with the prior round's pressure.`
            : `${speaker.last} is responding to ${opponent.last}.`
        );

        const prior = transcriptText(turns, slotAObj, slotBObj);
        const isOpening = i === 0;
        const constraint = isOpening
          ? `OPEN with a position that directly addresses what the prior round revealed you needed to address: "${speakerOpenGround}". Do not rehash your stock position. Engage the open ground.`
          : `Respond to ${opponent.last}'s last turn. Where relevant, address the open ground from the prior round: "${speakerOpenGround}".`;

        const turnPrompt = `You are speaking as ${speaker.first} ${speaker.last} (${speaker.year}), in conversation with ${opponent.first} ${opponent.last}.

YOUR POSITION: ${speaker.bio}
THEIR POSITION: ${opponent.bio}
TOPIC: ${topicPhrase}

PRIOR ROUND'S PRESSURE: This is round ${roundCount + 1} on this topic. The prior round scored ${roomCard.roomScore}/100. The referee's note for you: "${speakerOpenGround}"

${prior ? `THE EXCHANGE SO FAR:\n${prior}\n\n` : ''}NOW IT IS YOUR TURN.

${constraint}

Voice rules:
- In the voice of ${speaker.last}.
- Practitioner register. Short declarative sentences. No hedging.
- Concrete reference to your work, methods, or examples.
- No pleasantries. No "I would argue." No academic puff. No em dashes.
- 2 to 4 sentences.

Return JSON only. Schema: { "text": "your turn" }`;

        const result = await callClaude(turnPrompt, 700);
        let turn = { speaker: speakerKey, text: result.text };

        if (i > 0) {
          setLoadingText(`Checking that ${speaker.last} actually responded.`);
          turn = await refereeAndMaybeRegenerate({
            turn, speakerKey,
            aObj: slotAObj, bObj: slotBObj,
            topic: topicPhrase,
            priorTurns: turns,
            isOpening: false,
          });
        }

        turns.push(turn);
        setExchange({ ...newInitial, turns: [...turns] });
        setVisibleTurns(turns.length);
      }
      setLoadingText(null);
      scoreCurrentExchange(turns, slotAObj, slotBObj, topicPhrase);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The next round could not be set. Try again.");
      setLoadingText(null);
    }
  }

  function newQuestionSamePair() {
    setExchange(null); setVisibleTurns(0); setRoomCard(null); setRoomCardError(null);
    setRoundCount(1); setPriorRoomScore(null);
    setTopic(""); setStarterContext(null);
    setPhase("composition");
  }

  async function continueExchange() {
    if (!exchange || !slotAObj || !slotBObj) return;
    setError(null);

    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const startKey = lastNonHost.speaker === "A" ? "B" : "A";
    const speakers = [startKey, startKey === "A" ? "B" : "A", startKey, startKey === "A" ? "B" : "A"];
    let working = [...exchange.turns];

    try {
      for (let i = 0; i < speakers.length; i++) {
        const speakerKey = speakers[i];
        const speakerName = speakerKey === "A" ? slotAObj.last : slotBObj.last;
        const opponentName = speakerKey === "A" ? slotBObj.last : slotAObj.last;
        setLoadingText(`${speakerName} is responding to ${opponentName}.`);

        let turn = await generateTurn({
          speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        setLoadingText(`Checking that ${speakerName} actually responded.`);
        turn = await refereeAndMaybeRegenerate({
          turn, speakerKey,
          aObj: slotAObj, bObj: slotBObj,
          topic: exchange.topic,
          priorTurns: working,
          isOpening: false,
        });

        working = [...working, turn];
        setExchange({ ...exchange, turns: working });
        setVisibleTurns(working.length);
      }
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The exchange could not continue. Try again.");
      setLoadingText(null);
    }
  }

  async function pushBack() {
    if (!exchange || !slotAObj || !slotBObj) return;
    const lastNonHost = [...exchange.turns].reverse().find(t => t.speaker !== "host");
    if (!lastNonHost) return;
    const challengerKey = lastNonHost.speaker === "A" ? "B" : "A";
    const defenderKey = lastNonHost.speaker;
    const challengerName = challengerKey === "A" ? slotAObj.last : slotBObj.last;
    const defenderName = defenderKey === "A" ? slotAObj.last : slotBObj.last;
    const challenger = challengerKey === "A" ? slotAObj : slotBObj;
    const defender = defenderKey === "A" ? slotAObj : slotBObj;
    setError(null);

    let working = [...exchange.turns];

    try {
      setLoadingText(`${challengerName} is pushing back on ${defenderName}.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const challengePrompt = `You are speaking as ${challenger.first} ${challenger.last} (${challenger.year}). The host wants you to push back hard on what ${defenderName} just said.

YOUR POSITION: ${challenger.bio}
THEIR POSITION: ${defender.bio}
TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

Push back. Name the specific weakness in ${defenderName}'s last point. Quote a phrase from it if you must. Be sharp, not rude. 2 to 4 sentences. No em dashes. No academic puff.

Return JSON only. Schema: { "text": "your push-back" }`;

      const challengeResult = await callClaude(challengePrompt, 600);
      const challengeTurn = { speaker: challengerKey, text: challengeResult.text };
      working = [...working, challengeTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${defenderName} is defending.`);
      let defendTurn = await generateTurn({
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${defenderName} actually responded.`);
      defendTurn = await refereeAndMaybeRegenerate({
        turn: defendTurn,
        speakerKey: defenderKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, defendTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The push back failed. Try again.");
      setLoadingText(null);
    }
  }

  async function submitFollowUp() {
    if (!followUpFor || !followUpText.trim() || !exchange || !slotAObj || !slotBObj) return;
    const targetKey = followUpFor;
    const otherKey = targetKey === "A" ? "B" : "A";
    const target = targetKey === "A" ? slotAObj : slotBObj;
    const other = otherKey === "A" ? slotAObj : slotBObj;
    const question = followUpText.trim();
    setError(null);
    setFollowUpFor(null); setFollowUpText("");

    const hostTurn = { speaker: "host", text: question, target: target.last };
    let working = [...exchange.turns, hostTurn];
    setExchange({ ...exchange, turns: working });
    setVisibleTurns(working.length);

    try {
      setLoadingText(`${target.last} is answering your question.`);
      const prior = transcriptText(working, slotAObj, slotBObj);
      const answerPrompt = `You are speaking as ${target.first} ${target.last} (${target.year}). The host has just put a question to you in this debate with ${other.last}.

YOUR POSITION: ${target.bio}
THE OTHER POSITION: ${other.bio}
TOPIC: ${exchange.topic}

THE EXCHANGE SO FAR:
${prior}

Answer the host's question directly. In your voice. 2 to 4 sentences. Concrete. No hedging. No em dashes. No academic puff.

Return JSON only. Schema: { "text": "your answer" }`;

      const answerResult = await callClaude(answerPrompt, 600);
      const answerTurn = { speaker: targetKey, text: answerResult.text };
      working = [...working, answerTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);

      setLoadingText(`${other.last} is reacting to ${target.last}'s answer.`);
      let reactTurn = await generateTurn({
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      setLoadingText(`Checking that ${other.last} actually responded.`);
      reactTurn = await refereeAndMaybeRegenerate({
        turn: reactTurn,
        speakerKey: otherKey,
        aObj: slotAObj, bObj: slotBObj,
        topic: exchange.topic,
        priorTurns: working,
        isOpening: false,
      });

      working = [...working, reactTurn];
      setExchange({ ...exchange, turns: working });
      setVisibleTurns(working.length);
      setLoadingText(null);
      setRoomCard(null); setRoomCardError(null);
      scoreCurrentExchange(working, slotAObj, slotBObj, exchange.topic);
    } catch (e) {
      console.error(e);
      setError(e.userMessage || "The follow-up could not be answered. Try again.");
      setLoadingText(null);
    }
  }

  return (
    <div className="aoa-root">
      <GlobalStyle />
      <Shell phase={phase} onLeave={goArrival} onMap={goMap}>
        {phase === "arrival" && (
          <ArrivalScreen
            warmStarts={WARM_STARTS}
            thinkerById={thinkerById}
            onWarmStart={warmStart}
            onOpenMap={goMap}
          />
        )}
        {phase === "map" && (
          <MapScreen
            slotA={slotA} slotB={slotB}
            hoveredId={hoveredId}
            hoveredObj={hoveredObj}
            onTap={tapStation}
            onHover={setHoveredId}
            onClear={() => { setSlotA(null); setSlotB(null); }}
            onLeave={goArrival}
            onBegin={() => setPhase("composition")}
          />
        )}
        {phase === "composition" && (
          <CompositionScreen
            slotAObj={slotAObj} slotBObj={slotBObj}
            topic={topic} setTopic={setTopic}
            onBegin={goExchangeFromComposition}
            onSwapA={() => { setSlotA(null); setPhase("map"); }}
            onSwapB={() => { setSlotB(null); setPhase("map"); }}
            onLeave={goArrival}
          />
        )}
        {phase === "exchange" && (
          <ExchangeScreen
            slotAObj={slotAObj} slotBObj={slotBObj}
            exchange={exchange}
            visibleTurns={visibleTurns}
            loadingText={loadingText}
            error={error}
            followUpFor={followUpFor}
            followUpText={followUpText}
            setFollowUpFor={setFollowUpFor}
            setFollowUpText={setFollowUpText}
            onSubmitFollowUp={submitFollowUp}
            onContinue={continueExchange}
            onPushBack={pushBack}
            onChangeRoom={changeRoom}
            onLeave={goArrival}
            onExport={exportToMarkdown}
            exportFeedback={exportFeedback}
            roomCard={roomCard}
            roomCardError={roomCardError}
            scoringInFlight={scoringInFlight}
            onPushHarder={pushHarder}
            onNewQuestion={newQuestionSamePair}
            roundCount={roundCount}
            priorRoomScore={priorRoomScore}
          />
        )}
      </Shell>
    </div>
  );
}

function MapScreen({ slotA, slotB, hoveredId, hoveredObj, onTap, onHover, onClear, onLeave, onBegin }) {
  const stations = THINKERS.map(t => ({
    ...t, x: COL_X[t.col], y: ROW_Y[t.tradition] + (t.offsetY || 0),
  }));

  return (
    <section className="map-screen">
      <div className="map-intro">
        <p className="map-intro-text">
          <em>The Anatomy of Advertising</em> maps an argument that's been running since Aristotle. Eight traditions, thirty-two voices. Pick two to set them against each other.
        </p>
      </div>

      <div className="map-prelude">
        <div className="map-prelude-pill">
          <span className="live-dot"></span>
          {!slotA && !slotB && <span>Pick two figures</span>}
          {slotA && !slotB && <span>One picked. Pick one more.</span>}
          {slotA && slotB && <span>Both picked. Begin when ready.</span>}
        </div>
        {(slotA || slotB) && (
          <button onClick={onClear} className="map-clear-btn">Clear</button>
        )}
      </div>

      {slotA && slotB && (
        <div className="map-begin-bar">
          <button onClick={onBegin} className="map-begin-btn">
            <span>Begin</span>
            <span className="map-begin-arrow">→</span>
          </button>
        </div>
      )}

      <MobileMapList slotA={slotA} slotB={slotB} onTap={onTap} />

      <div className="map-scroll-hint">
        <span className="scroll-hint-arrow">→</span>
        <span>Scroll right to see all 32</span>
      </div>

      <div className="map-legend" aria-label="Tradition legend">
        <div className="map-legend-label">The eight traditions</div>
        <ul className="map-legend-list">
          {TRAD_ORDER.map(tradId => (
            <li key={tradId} className="map-legend-item">
              <span className="map-legend-swatch" style={{ background: TRADITIONS[tradId].color }}></span>
              <span className="map-legend-name">{TRADITIONS[tradId].label}</span>
            </li>
          ))}
        </ul>
      </div>

      <div className="map-scroll map-svg-wrapper">
        <svg viewBox={`0 0 ${VIEWBOX_W} ${VIEWBOX_H}`} className="map-svg">
          {TRAD_ORDER.map(tradId => {
            const list = stations.filter(s => s.tradition === tradId && !s.offsetY)
              .sort((a,b) => a.x - b.x);
            if (list.length === 0) return null;
            const y = ROW_Y[tradId];
            return (
              <line key={tradId}
                x1={list[0].x - 40} y1={y}
                x2={list[list.length-1].x + 60} y2={y}
                stroke={TRADITIONS[tradId].color}
                strokeWidth={9} strokeLinecap="round" />
            );
          })}

          {BRIDGES.map((b, i) => (
            <line key={i}
              x1={COL_X[b.col]} y1={ROW_Y[b.fromTrad]}
              x2={COL_X[b.col]} y2={ROW_Y[b.toTrad]}
              stroke="#14110D" strokeWidth={2.5} strokeDasharray="5 4" opacity={0.4} />
          ))}

          {stations.map(s => {
            const trad = TRADITIONS[s.tradition];
            const selected = s.id === slotA || s.id === slotB;
            const slotLabel = s.id === slotA ? "A" : s.id === slotB ? "B" : null;
            const hovered = s.id === hoveredId;
            const isKind = !!s.kind;
            const showPortrait = hasPortrait(s);

            const dotR = isKind ? 5 : (s.interchange ? 11 : 7);

            const clipId = `portrait-clip-${s.id}`;
            return (
              <g key={s.id} style={{ cursor: isKind ? "help" : "pointer" }}
                onMouseEnter={() => onHover(s.id)}
                onMouseLeave={() => onHover(null)}
                onClick={() => onTap(s.id)}>
                <rect x={s.x-44} y={s.y-portraitR-4} width={88} height={portraitR*2+8} fill="transparent" pointerEvents="all" />

                {showPortrait ? (
                  <>
                    <defs>
                      <clipPath id={clipId}>
                        <circle cx={s.x} cy={s.y} r={portraitR} />
                      </clipPath>
                    </defs>
                    <circle cx={s.x} cy={s.y} r={portraitR} fill="#F5F1E8" clipPath={`url(#${clipId})`} />
                    <image
                      href={portraitURL(s.id)}
                      xlinkHref={portraitURL(s.id)}
                      x={s.x - portraitR} y={s.y - portraitR}
                      width={portraitR * 2} height={portraitR * 2}
                      clipPath={`url(#${clipId})`}
                      preserveAspectRatio="xMidYMid slice"
                      onError={(e) => { e.currentTarget.style.display = "none"; }}
                    />
                    <circle cx={s.x} cy={s.y} r={portraitR}
                      fill="none" stroke={trad.color}
                      strokeWidth={selected ? 3 : (hovered ? 2.5 : 2)} />
                  </>
                ) : (
                  <>
                    {s.interchange && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+5} fill="none" stroke={trad.color} strokeWidth={3} />
                    )}
                    {isKind ? (
                      <circle cx={s.x} cy={s.y} r={4}
                        fill="#F5F1E8" stroke={trad.color}
                        strokeWidth={1} strokeDasharray="2 1.5" opacity={0.85} />
                    ) : (
                      <circle cx={s.x} cy={s.y} r={dotR}
                        fill={s.ghost ? "#F5F1E8" : "#14110D"}
                        stroke={s.ghost ? trad.color : "#14110D"}
                        strokeWidth={s.ghost ? 2.5 : 2}
                        strokeDasharray={s.ghost ? "3 2" : undefined} />
                    )}
                    {hovered && !selected && !isKind && (
                      <circle cx={s.x} cy={s.y} r={dotR+6} fill="none" stroke={trad.color} strokeWidth={2} opacity={0.5} />
                    )}
                  </>
                )}

                {selected && (
                  <>
                    <circle cx={s.x} cy={s.y} r={r+8} fill="none" stroke="#FF4D2E" strokeWidth={3} opacity={0.9} />
                    <rect x={s.x+r+8} y={s.y-9} width={20} height={18} fill="#FF4D2E" rx={3} />
                    <text x={s.x+r+18} y={s.y+4} fill="#fff"
                      fontFamily="Geist Mono, monospace"
                      fontSize={11} fontWeight={700} textAnchor="middle">{slotLabel}</text>
                  </>
                )}

                <text x={s.x} y={s.y - r - 8} fill={isKind ? trad.color : "#14110D"}
                  fontFamily={isKind ? "Instrument Serif, serif" : "Geist, sans-serif"}
                  fontSize={isKind ? 12 : 11}
                  fontWeight={isKind ? 400 : 600}
                  fontStyle={isKind ? "italic" : "normal"}
                  textAnchor="middle"
                  letterSpacing={isKind ? 0 : 0.5}
                  opacity={isKind ? 0.75 : (hovered ? 1 : 0.92)}>
                  {isKind ? `${s.first} ${s.last}` : (s.last.startsWith('&') ? `${s.first} ${s.last}` : s.last)}
                </text>
                <text x={s.x} y={s.y + r + 16} fill="#8B8576"
                  fontFamily="Geist Mono, monospace"
                  fontSize={9} textAnchor="middle" letterSpacing={0.5}>
                  {s.year}
                </text>
              </g>
            );
          })}

          {TRAD_ORDER.map(tradId => {
            const list = stations.filter(s => s.tradition === tradId).sort((a,b)=>a.x-b.x);
            if (list.length === 0) return null;
            return (
              <text key={`lbl-${tradId}`}
                x={list[list.length-1].x + 80} y={ROW_Y[tradId]+5}
                fill={TRADITIONS[tradId].color}
                fontFamily="Geist Mono, monospace"
                fontSize={11} fontWeight={600} letterSpacing={1.4}>
                {TRADITIONS[tradId].label.toUpperCase()}
              </text>
            );
          })}
        </svg>
      </div>

      {hoveredObj && (
        <div className="map-hover-card" style={{ ['--trad']: TRADITIONS[hoveredObj.tradition].color }}>
          {hasPortrait(hoveredObj) && (
            <img src={portraitURL(hoveredObj.id)} alt=""
              className="map-hover-portrait"
              style={{ borderColor: TRADITIONS[hoveredObj.tradition].color }} />
          )}
          <div className="map-hover-meta">
            {TRADITIONS[hoveredObj.tradition].label} · {hoveredObj.year}
          </div>
          <div className="map-hover-name">
            {hoveredObj.kind ? <em>{hoveredObj.first} {hoveredObj.last}</em> : `${hoveredObj.first} ${hoveredObj.last}`}
          </div>
          <p className="map-hover-bio">{hoveredObj.bio}</p>
          <div className="map-hover-note">
            {hoveredObj.kind
              ? KIND_NOTES[hoveredObj.kind]
              : CONFIDENCE_NOTES[getConfidence(hoveredObj)]}
          </div>
        </div>
      )}
    </section>
  );
}

// ============================================================
// COMPOSITION — fighter-select energy, half-second hold preserved
// ============================================================
function CompositionScreen({ slotAObj, slotBObj, topic, setTopic, onBegin, onSwapA, onSwapB, onLeave }) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const tradB = slotBObj ? TRADITIONS[slotBObj.tradition] : null;

  const [actionsReady, setActionsReady] = useState(false);
  useEffect(() => {
    setActionsReady(false);
    const t = setTimeout(() => setActionsReady(true), 700);
    return () => clearTimeout(t);
  }, [slotAObj?.id, slotBObj?.id]);

  const suggestions = ["the brief", "creativity", "what counts as proof", "attention", "what research should do"];

  if (!slotAObj || !slotBObj) {
    return (
      <section className="composition">
        <p className="composition-empty">Pick two figures to set the room.</p>
      </section>
    );
  }

  return (
    <section className="composition">
      <div className="composition-room">
        <div className="comp-card-wrap comp-card-a">
          <button className="comp-card" onClick={onSwapA} style={{ ['--trad']: tradA.color }} aria-label="Change participant A">
            <div className="comp-card-photo">
              {hasPortrait(slotAObj) && <img src={portraitURL(slotAObj.id)} alt="" />}
            </div>
            <div className="comp-card-meta">
              <div className="comp-card-trad">{tradA.label}</div>
              <div className="comp-card-name">
                <span className="comp-first">{slotAObj.first}</span>
                <span className="comp-last">{slotAObj.last}</span>
              </div>
              <div className="comp-card-year">{slotAObj.year}</div>
            </div>
            <div className="comp-card-swap">change</div>
          </button>
          <ConfidenceNote conf={getConfidence(slotAObj)} align="right" />
        </div>

        <div className="composition-vs">
          <div className="vs-text">VS</div>
          <div className="vs-bar" style={{ background: `linear-gradient(to right, ${tradA.color}, ${tradB.color})` }}></div>
        </div>

        <div className="comp-card-wrap comp-card-b">
          <button className="comp-card" onClick={onSwapB} style={{ ['--trad']: tradB.color }} aria-label="Change participant B">
            <div className="comp-card-photo">
              {hasPortrait(slotBObj) && <img src={portraitURL(slotBObj.id)} alt="" />}
            </div>
            <div className="comp-card-meta">
              <div className="comp-card-trad">{tradB.label}</div>
              <div className="comp-card-name">
                <span className="comp-first">{slotBObj.first}</span>
                <span className="comp-last">{slotBObj.last}</span>
              </div>
              <div className="comp-card-year">{slotBObj.year}</div>
            </div>
            <div className="comp-card-swap">change</div>
          </button>
          <ConfidenceNote conf={getConfidence(slotBObj)} align="left" />
        </div>
      </div>

      <div className={`composition-actions ${actionsReady ? "is-ready" : ""}`}>
        <p className="composition-prompt">What should they argue about?</p>
        <input
          className="composition-input"
          placeholder="Or leave blank, and a topic will choose itself."
          value={topic}
          onChange={(e) => setTopic(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") onBegin(); }}
          autoFocus
        />
        <ul className="composition-suggestions">
          {suggestions.map(s => (
            <li key={s}>
              <button className="composition-suggestion" onClick={() => { setTopic(s); }}>
                {s}
              </button>
            </li>
          ))}

// ============================================================
// EXCHANGE — turns arrive in time, controls as game actions
// ============================================================
function ExchangeScreen({
  slotAObj, slotBObj, exchange, visibleTurns, loadingText, error,
  followUpFor, followUpText, setFollowUpFor, setFollowUpText, onSubmitFollowUp,
  onContinue, onPushBack, onChangeRoom, onLeave, onExport, exportFeedback,
  roomCard, roomCardError, scoringInFlight, onPushHarder, onNewQuestion, roundCount, priorRoomScore,
}) {
  const tradA = slotAObj ? TRADITIONS[slotAObj.tradition] : null;
  const tradB = slotBObj ? TRADITIONS[slotBObj.tradition] : null;

  const allTurnsRevealed = exchange && visibleTurns >= exchange.turns.length;
  const lastRevealed = exchange && visibleTurns > 0 ? exchange.turns[visibleTurns-1] : null;
  const lastSpeakerId = lastRevealed ? lastRevealed.speaker : null;
  const dimA = !!lastSpeakerId && lastSpeakerId !== "A" && lastSpeakerId !== "host" && !allTurnsRevealed;
  const dimB = !!lastSpeakerId && lastSpeakerId !== "B" && lastSpeakerId !== "host" && !allTurnsRevealed;

  const transcriptRef = useRef(null);
  useEffect(() => {
    if (transcriptRef.current && visibleTurns > 0) {
      const last = transcriptRef.current.querySelector('.turn:last-child');
      if (last) last.scrollIntoView({ behavior: "smooth", block: "end" });
    }
  }, [visibleTurns]);

  if (!slotAObj || !slotBObj) return null;

  return (
    <section className="exchange">
      <header className="exchange-masthead">
        <ParticipantLine thinker={slotAObj} trad={tradA} dim={dimA} align="left" />
        <div className="exchange-topic">
          <div className="exchange-topic-label">In conversation</div>
          {exchange?.topic ? (
            <div className="exchange-topic-text">{exchange.topic}</div>
          ) : (
            <div className="exchange-topic-text exchange-topic-pending">···</div>
          )}
        </div>
        <ParticipantLine thinker={slotBObj} trad={tradB} dim={dimB} align="right" />
      </header>

      <p className="exchange-disclaimer">
        Reconstructions. Positions drawn from published work, voices approximated. Informed pastiche, not direct quotation.
      </p>

      {exchange?.context && (
        <div className="exchange-context">
          <div className="exchange-context-label">A primer, before they begin</div>
          <p className="exchange-context-body">{exchange.context}</p>
        </div>
      )}

      <div className="exchange-body" ref={transcriptRef}>
        {error && <p className="exchange-error">{error}</p>}

        {!exchange && loadingText && (
          <div className="exchange-loading">
            <p>{loadingText}</p>
          </div>
        )}

        {exchange && exchange.turns.slice(0, visibleTurns).map((turn, i) => {
          if (turn.speaker === "host") {
            return <HostTurn key={i} text={turn.text} target={turn.target} />;
          }
          const speaker = turn.speaker === "A" ? slotAObj : slotBObj;
          const trad = TRADITIONS[speaker.tradition];
          return <Turn key={i} turn={turn} speaker={speaker} trad={trad} />;
        })}

        {exchange && loadingText && (
          <div className="exchange-loading exchange-loading-inline">
            <p>{loadingText}</p>
          </div>
        )}
      </div>

      {exchange && allTurnsRevealed && !loadingText && (
        <ReportCard
          card={roomCard}
          loading={scoringInFlight}
          error={roomCardError}
          slotAObj={slotAObj}
          slotBObj={slotBObj}
          tradA={tradA}
          tradB={tradB}
          roundCount={roundCount}
          priorRoomScore={priorRoomScore}
          turns={exchange.turns}
        />
      )}

      {exchange && allTurnsRevealed && !loadingText && (
        <footer className="exchange-controls">
          {followUpFor ? (
            <div className="followup">
              <div className="followup-label">
                Question for <strong style={{ color: TRADITIONS[(followUpFor === "A" ? slotAObj : slotBObj).tradition].color }}>
                  {(followUpFor === "A" ? slotAObj : slotBObj).last}
                </strong>
              </div>
              <input
                className="followup-input"
                value={followUpText}
                onChange={(e)=>setFollowUpText(e.target.value)}
                onKeyDown={(e)=>{ if(e.key==="Enter") onSubmitFollowUp(); }}
                placeholder="Ask whatever is sharper than what they just said."
                autoFocus
              />
              <div className="followup-actions">
                <button className="followup-submit" onClick={onSubmitFollowUp} disabled={!followUpText.trim()}>
                  Ask <span>→</span>
                </button>
                <button className="aoa-link aoa-link-quiet" onClick={() => { setFollowUpFor(null); setFollowUpText(""); }}>
                  Cancel
                </button>
              </div>
            </div>
          ) : (
            <div className="exchange-controls-row">
              {roomCard && (
                <>
                  <button className="ctrl ctrl-primary" onClick={onPushHarder} disabled={!roomCard}>
                    Push them harder
                  </button>
                  <button className="ctrl" onClick={onNewQuestion}>
                    New question, same pair
                  </button>
                  <span className="ctrl-divider" />
                </>
              )}
              <button className="ctrl" onClick={onContinue}>Continue</button>
              <button className="ctrl" onClick={onPushBack}>Push back</button>
              <button className="ctrl" onClick={() => { setFollowUpFor("A"); }}>
                Ask <span style={{ color: tradA.color }}>{slotAObj.last}</span>
              </button>
              <button className="ctrl" onClick={() => { setFollowUpFor("B"); }}>
                Ask <span style={{ color: tradB.color }}>{slotBObj.last}</span>
              </button>
              <span className="ctrl-divider" />
              <button className="ctrl ctrl-export" onClick={onExport}>
                {exportFeedback ? <em>{exportFeedback}</em> : "Take it with you"}
              </button>
              <button className="aoa-link aoa-link-quiet" onClick={onChangeRoom}>Change room</button>
            </div>
          )}
        </footer>
      )}
    </section>
  );
}

        className="confidence-trigger"
        onMouseEnter={() => setOpen(true)}
        onMouseLeave={() => setOpen(false)}
        onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}
        aria-expanded={open}
      >
        {CONFIDENCE_NOTES[conf]} <span className="confidence-mark">?</span>
      </button>
      {open && (
        <div className="confidence-tip" role="tooltip">
          {CONFIDENCE_EXPLANATIONS[conf]}
        </div>

// REPORT CARD — UNCHANGED. Editorial register preserved.
// ============================================================
function ReportCard({ card, loading, error, slotAObj, slotBObj, tradA, tradB, roundCount, priorRoomScore, turns }) {
  if (loading) {
    return (
      <div className="report-card report-card-loading">
        <div className="report-card-label">Scoring the exchange…</div>
      </div>
    );
  }
  if (error) {
    return (
      <div className="report-card report-card-error">
        <div className="report-card-label">Scoring failed</div>
        <p className="report-card-error-msg">{error}</p>
      </div>
    );
  }
  if (!card) return null;

  const moveTurnIdx = card.moveOfRound?.turnIndex ? card.moveOfRound.turnIndex - 1 : null;
  const moveSpeaker = card.moveOfRound?.speaker;
  const moveSpeakerObj = moveSpeaker === "A" ? slotAObj : moveSpeaker === "B" ? slotBObj : null;
  const moveTrad = moveSpeaker === "A" ? tradA : moveSpeaker === "B" ? tradB : null;
  const delta = (priorRoomScore !== null && priorRoomScore !== undefined)
    ? card.roomScore - priorRoomScore
    : null;

  return (
    <section className="report-card" aria-label="Report card">
      <header className="report-card-head">
        <div className="report-card-label">
          {roundCount > 1 ? `Round ${roundCount} · Report card` : "Report card"}
        </div>
        {delta !== null && (
          <div className={`report-card-delta ${delta > 0 ? "is-up" : delta < 0 ? "is-down" : "is-flat"}`}>
            {delta > 0 ? `+${delta}` : delta} from prior round
          </div>
        )}
      </header>

      <div className="report-card-body">
        <div className="report-block report-block-room">
          <div className="report-block-label">Room Score</div>
          <div className="report-room-score-row">
            <div className="report-score-numeral">{card.roomScore}</div>
            <RadarChart rubric={card.rubric} />
          </div>
          {card.roomNote && <p className="report-block-note">{card.roomNote}</p>}
        </div>

        <div className="report-block report-block-fidelity">
          <div className="report-block-label">Voice Fidelity</div>
          <FidelityBar thinker={slotAObj} trad={tradA} score={card.voiceFidelityA} note={card.voiceNoteA} />
          <FidelityBar thinker={slotBObj} trad={tradB} score={card.voiceFidelityB} note={card.voiceNoteB} />
        </div>
      </div>

      {card.moveOfRound && (
        <div className="report-move">
          <div className="report-block-label">Move of the round</div>
          {card.moveOfRound.quote && (
            <blockquote className="report-move-quote" style={moveTrad ? { borderLeftColor: moveTrad.color } : {}}>
              "{card.moveOfRound.quote}"
            </blockquote>
          )}
          <div className="report-move-credit">
            {moveSpeakerObj ? (
              <>
                <span style={moveTrad ? { color: moveTrad.color } : {}}>
                  {moveSpeakerObj.last}
                </span>
                {moveTurnIdx !== null && <span>, turn {card.moveOfRound.turnIndex}</span>}
              </>
            ) : null}
            {card.moveOfRound.reason && <em> — {card.moveOfRound.reason}</em>}
          </div>
        </div>
      )}

      {(card.openGroundA || card.openGroundB) && (
        <div className="report-open">
          <div className="report-block-label">Open ground</div>
          <div className="report-open-rows">
            {card.openGroundA && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradA.color }}>{slotAObj.last}</span>
                <em>{card.openGroundA}</em>
              </div>
            )}
            {card.openGroundB && (
              <div className="report-open-row">
                <span className="report-open-name" style={{ color: tradB.color }}>{slotBObj.last}</span>
                <em>{card.openGroundB}</em>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

function RadarChart({ rubric }) {
  if (!rubric) return null;
  const dims = [
    { key: "engagement", label: "ENGAGE" },
    { key: "specificity", label: "SPECIFIC" },
    { key: "concession", label: "CONCEDE" },
    { key: "escalation", label: "ESCALATE" },
    { key: "productiveness", label: "PRODUCT" },
  ];
  const size = 180;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 62;
  const max = 20;
  const angle = (i) => (Math.PI * 2 * i) / dims.length - Math.PI / 2;

  const rings = [5, 10, 15, 20].map(level => {
    const r = (level / max) * maxR;
    const points = dims.map((_, i) =>
      `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`
    ).join(" ");
    return points;
  });

  const axes = dims.map((_, i) => ({
    x: cx + maxR * Math.cos(angle(i)),
    y: cy + maxR * Math.sin(angle(i)),
  }));

  const dataPoints = dims.map((d, i) => {
    const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
    const r = (v / max) * maxR;
    return `${cx + r * Math.cos(angle(i))},${cy + r * Math.sin(angle(i))}`;
  }).join(" ");

  const labels = dims.map((d, i) => {
    const r = maxR + 14;
    return {
      x: cx + r * Math.cos(angle(i)),
      y: cy + r * Math.sin(angle(i)),
      text: d.label,
      value: rubric[d.key] || 0,
    };
  });

  return (
    <svg className="report-radar" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {rings.map((points, i) => (
        <polygon key={i} points={points}
          fill="none" stroke="#d8cfbf" strokeWidth="1"
          opacity={i === 3 ? 0.7 : 0.35} />
      ))}
      {axes.map((a, i) => (
        <line key={i} x1={cx} y1={cy} x2={a.x} y2={a.y}
          stroke="#d8cfbf" strokeWidth="1" opacity="0.5" />
      ))}
      <polygon points={dataPoints}
        fill="#1a1614" fillOpacity="0.08"
        stroke="#1a1614" strokeWidth="1.5" />
      {dims.map((d, i) => {
        const v = Math.max(0, Math.min(max, rubric[d.key] || 0));
        const r = (v / max) * maxR;
        return (
          <circle key={i}
            cx={cx + r * Math.cos(angle(i))}
            cy={cy + r * Math.sin(angle(i))}
            r="2.5" fill="#1a1614" />
        );
      })}
      {labels.map((l, i) => (
        <g key={i}>
          <text x={l.x} y={l.y} fill="#7a6f63"
            fontFamily="JetBrains Mono, monospace" fontSize="8"
            textAnchor="middle" dominantBaseline="middle"
            letterSpacing="0.08em">
            {l.text}
          </text>
          <text x={l.x} y={l.y + 9} fill="#1a1614"
            fontFamily="JetBrains Mono, monospace" fontSize="9"
            fontWeight="600"
            textAnchor="middle" dominantBaseline="middle">
            {l.value}
          </text>
        </g>
      ))}
    </svg>
  );
}

function FidelityBar({ thinker, trad, score, note }) {
  if (!thinker) return null;
  const pct = Math.max(0, Math.min(100, score || 0));
  return (
    <div className="fidelity-bar">
      <div className="fidelity-bar-head">
        {hasPortrait(thinker) && (
          <img src={portraitURL(thinker.id)} alt="" className="fidelity-bar-portrait" style={{ borderColor: trad.color }} />
        )}
        <div className="fidelity-bar-meta">
          <div className="fidelity-bar-name">{thinker.last}</div>
          {note && <div className="fidelity-bar-note">{note}</div>}
        </div>
        <div className="fidelity-bar-score">{score}</div>
      </div>
      <div className="fidelity-bar-track">
        <div className="fidelity-bar-fill" style={{ width: `${pct}%`, background: trad.color }} />
      </div>
    </div>
  );
}

function HostTurn({ text, target }) {
  return (
    <div className="host-turn">
      <div className="host-turn-label">Host, to {target}</div>
      <p className="host-turn-body">{text}</p>
    </div>
  );
}

        color: var(--mid);
      }

      .composition-room {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 40px; align-items: center;
        max-width: 1100px; width: 100%;
        margin-bottom: 64px;
        animation: fadeUp 0.8s ease both;
      }
      .comp-card-wrap { display: flex; flex-direction: column; align-items: center; }
      .comp-card-a { align-items: flex-end; }
      .comp-card-b { align-items: flex-start; }

      .comp-card {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        padding: 0 0 16px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        width: 280px;
        max-width: 100%;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
        font-family: inherit;
        text-align: left;
        color: var(--ink);
      }
      .comp-card:hover {
        transform: translate(-2px, -3px);
        box-shadow: 6px 7px 0 var(--ink);
      }
      .comp-card-a .comp-card { transform: rotate(-1.5deg); }
      .comp-card-b .comp-card { transform: rotate(1.5deg); }
      .comp-card-a .comp-card:hover { transform: rotate(-1.5deg) translate(-2px, -3px); }
      .comp-card-b .comp-card:hover { transform: rotate(1.5deg) translate(-2px, -3px); }

      .comp-card-photo {
        width: 100%; aspect-ratio: 1 / 1;
        background: var(--bg-warm);
        border-bottom: 4px solid var(--trad);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .comp-card-photo img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
      .comp-card-meta {
        padding: 18px 20px 8px;
      }
      .comp-card-trad {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--trad);
        margin-bottom: 10px;
      }
      .comp-card-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
      }
      .comp-first {
        display: block; font-size: 14px;
        font-style: italic; color: var(--mid);
        margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
        letter-spacing: -0.005em;
      }
      .comp-last {
        display: block; font-size: 36px;
        color: var(--ink);
        letter-spacing: -0.025em;
      }
      .comp-card-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--whisper);
        margin-top: 10px;
        letter-spacing: 0.06em;
      }
      .comp-card-swap {
        position: absolute;
        bottom: 12px; right: 16px;
        font-family: 'Geist Mono', monospace;
        font-size: 10px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .comp-card:hover .comp-card-swap { opacity: 1; }

      .composition-vs {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      .vs-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 32px;
        color: var(--ink);
        position: relative;
      }
      .vs-text::after {
        content: "";
        position: absolute;
        bottom: 4px; left: -4px; right: -4px;
        height: 8px;
        background: var(--accent-yellow);
        z-index: -1;
        transform: skew(-8deg);
      }
      .vs-bar { width: 60px; height: 2px; }

      .composition-actions {
        max-width: 560px; width: 100%; text-align: center;
        opacity: 0; transform: translateY(8px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .composition-actions.is-ready {
        opacity: 1; transform: translateY(0);
      }
      .composition-prompt {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 24px; color: var(--ink); margin: 0 0 22px;
      }
      .composition-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px;
        color: var(--ink); text-align: center;
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
        transition: box-shadow 0.15s, transform 0.15s;
      }
      .composition-input::placeholder {
        color: var(--whisper);
      }
      .composition-input:focus {
        box-shadow: 4px 4px 0 var(--accent);
        transform: translate(-1px, -1px);
      }

      .composition-suggestions {
        list-style: none; padding: 0; margin: 22px 0 36px;
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      }
      .composition-suggestion {
        background: var(--bg); border: 1px solid var(--rule-strong);
        padding: 6px 12px;
        border-radius: 100px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--ink-quiet);
        transition: all 0.15s;
      }
      .composition-suggestion:hover {
        background: var(--ink); color: var(--bg);
        border-color: var(--ink);
      }

      .composition-begin {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 18px 40px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        border-radius: 100px;
        box-shadow: 4px 4px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
        display: inline-flex; align-items: center; gap: 10px;
      }
      .composition-begin:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--accent);
      }
      .composition-arrow { transition: transform 0.15s; }
      .composition-begin:hover .composition-arrow { transform: translateX(3px); }

      @media (max-width: 768px) {
        .composition-room { grid-template-columns: 1fr; gap: 24px; }
        .comp-card-wrap { align-items: center; }
        .comp-card-a .comp-card, .comp-card-b .comp-card { transform: none; }
        .comp-card-a .comp-card:hover, .comp-card-b .comp-card:hover { transform: translate(-2px, -3px); }
        .composition-vs { transform: rotate(0deg); }
      }

      /* ---- EXCHANGE ---- */
      .exchange {
        min-height: calc(100vh - 70px);
        max-width: 920px; margin: 0 auto;
        padding: 48px 36px 96px;
      }
      .exchange-masthead {
        display: grid; grid-template-columns: 1fr auto 1fr;
        gap: 32px; align-items: end;
        padding-bottom: 32px; margin-bottom: 22px;
        border-bottom: 1px solid var(--rule);
      }
      .exchange-disclaimer {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.1em;
        color: var(--whisper);
        margin: 0 auto 36px;
        text-align: center; line-height: 1.6;
        max-width: 640px;
      }

      .participant { transition: opacity 0.8s ease; }
      .participant.is-dim { opacity: 0.42; }
      .participant-portrait {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid;
        object-fit: cover;
        margin-bottom: 12px;
        background: var(--bg);
        display: block;
      }
      .part-left .participant-portrait { margin-left: 0; margin-right: auto; }
      .part-right .participant-portrait { margin-left: auto; margin-right: 0; }
      .participant-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--trad); margin-bottom: 8px;
      }
      .participant-name {
        font-family: 'Instrument Serif', serif;
        line-height: 0.95;
        letter-spacing: -0.025em;
      }
      .participant-first {
        display: block; font-size: 13px;
        font-style: italic; color: var(--mid); margin-bottom: 4px;
        font-family: 'Geist', sans-serif;
      }
      .participant-last {
        display: block; font-size: clamp(34px, 4vw, 50px);
        color: var(--ink);
      }
      .participant-year {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; color: var(--mid); margin-top: 6px;
        letter-spacing: 0.05em;
      }

      .exchange-topic { text-align: center; padding: 0 16px; }
      .exchange-topic-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .exchange-topic-text {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--ink); line-height: 1.3;
        max-width: 240px;
      }
      .exchange-topic-pending { color: var(--whisper); letter-spacing: 0.3em; }

      .exchange-context {
        margin: 0 auto 40px;
        max-width: 640px;
        padding: 20px 24px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
      }
      .exchange-context-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 10px;
      }
      .exchange-context-body {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 16px; line-height: 1.55; color: var(--ink-quiet);
        margin: 0;
      }

      .exchange-body { min-height: 200px; }
      .exchange-loading {
        padding: 60px 0; text-align: center;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 18px; color: var(--mid);
        animation: loadFade 2s ease infinite;
      }
      .exchange-loading-inline { padding: 20px 0; font-size: 15px; }
      @keyframes loadFade { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

      .exchange-error {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-size: 15px; color: var(--accent);
        text-align: center;
        padding: 20px 0;
      }

      .turn {
        margin-bottom: 32px;
        animation: fadeUp 0.6s ease both;
      }
      .turn-a { padding-right: 8%; }
      .turn-b { padding-left: 8%; }
      .turn-header {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 10px; padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      .turn-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        background: var(--bg);
        flex: 0 0 auto;
      }
      .turn-name {
        font-family: 'Instrument Serif', serif;
        font-size: 24px; font-weight: 400;
        color: var(--trad); letter-spacing: -0.015em;
      }
      .turn-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 10px; color: var(--mid);
        letter-spacing: 0.05em;
      }
      .turn-body {
        font-family: 'Geist', sans-serif;
        font-size: 17px; line-height: 1.6;
        color: var(--ink); margin: 0;
      }

      .host-turn {
        margin: 24px 0; padding: 16px 22px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-left: 3px solid var(--accent-blue);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .host-turn-label {
        font-family: 'Geist Mono', monospace;
        font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 8px;
      }
      .host-turn-body {
        font-family: 'Instrument Serif', serif; font-style: italic;
        font-size: 16px; color: var(--ink-quiet); margin: 0;
        line-height: 1.5;
      }

      .exchange-controls {
        margin-top: 40px; padding-top: 28px;
        border-top: 1px solid var(--rule);
        animation: fadeUp 0.6s ease 0.1s both;
      }
      .exchange-controls-row {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .ctrl {
        background: var(--paper);
        border: 1.5px solid var(--ink);
        padding: 8px 14px;
        cursor: pointer;
        font-family: 'Geist Mono', monospace;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink);
        border-radius: 100px;
        box-shadow: 2px 2px 0 var(--ink);
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .ctrl:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .ctrl-primary {
        background: var(--accent); color: var(--bg);
        border-color: var(--ink);
      }
      .ctrl-primary:hover { background: var(--ink); }
      .ctrl-divider {
        width: 1px; height: 16px; background: var(--rule-strong);
      }
      .ctrl-export em { font-style: italic; color: var(--mid); }

      .followup { animation: fadeUp 0.4s ease both; }
      .followup-label {
        font-family: 'Geist Mono', monospace;
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--mid); margin-bottom: 12px;
      }
      .followup-input {
        width: 100%; background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 100px;
        padding: 14px 22px;
        font-family: 'Geist', sans-serif;
        font-size: 16px; color: var(--ink);
        outline: none;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .followup-input::placeholder { color: var(--whisper); }
      .followup-actions {
        display: flex; align-items: center; gap: 16px; margin-top: 16px;
      }
      .followup-submit {
        background: var(--ink); color: var(--bg);
        border: 2px solid var(--ink);
        padding: 10px 22px; cursor: pointer;
        font-family: 'Geist', sans-serif;
        font-size: 14px; font-weight: 600;
        border-radius: 100px;
        box-shadow: 3px 3px 0 var(--accent);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .followup-submit:disabled { opacity: 0.3; cursor: not-allowed; }
      .followup-submit:not(:disabled):hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--accent);
      }
      .followup-submit span { margin-left: 6px; }

      @media (max-width: 720px) {
        .exchange-masthead { grid-template-columns: 1fr; gap: 18px; text-align: left; }
        .turn-a, .turn-b { padding-left: 0; padding-right: 0; }
      }

      /* ============================================================
         REPORT CARD — preserved from prior. Editorial register.
         ============================================================ */
      .report-card {
        max-width: 760px; margin: 48px auto 0;
        padding: 32px 36px;
        background: #fbf8ef;
        border: 1px solid var(--rule);
        border-radius: 4px;
        animation: fadeUp 0.6s ease both;
      }
      .report-card-loading {
        text-align: center;
        padding: 48px 36px;
      }
      .report-card-error {
        text-align: center;
        padding: 36px;
        border-color: var(--accent);
      }
      .report-card-error .report-card-label {
        color: var(--accent);
        margin-bottom: 12px;
      }
      .report-card-error-msg {
        font-family: 'Geist', sans-serif;
        font-size: 14px;
        color: var(--ink-quiet);
        line-height: 1.5;
        margin: 0;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      .report-card-head {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .report-card-label, .report-block-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--mid);
      }
      .report-card-delta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
      }
      .report-card-delta.is-up { color: #2f8f4d; }
      .report-card-delta.is-down { color: #c0392b; }
      .report-card-delta.is-flat { color: var(--mid); }

      .report-card-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        margin-bottom: 32px;
      }
      .report-block { min-width: 0; }
      @media (max-width: 720px) {
        .report-card-body { grid-template-columns: 1fr; gap: 32px; }
        .report-card { padding: 24px 20px; }
      }

      .report-block-label { margin-bottom: 14px; display: block; }

      .report-room-score-row {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 12px;
      }
      .report-score-numeral {
        font-family: 'Fraunces', serif;
        font-size: 64px; font-weight: 400;
        font-variation-settings: "opsz" 144;
        letter-spacing: -0.04em; line-height: 0.9;
        color: var(--ink);
      }
      .report-radar { flex: 1 1 auto; }
      .report-block-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 13px; line-height: 1.5;
        color: var(--mid); margin: 0;
      }

      .fidelity-bar { margin-bottom: 20px; min-width: 0; }
      .fidelity-bar:last-child { margin-bottom: 0; }
      .fidelity-bar-head {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 8px;
        min-width: 0;
      }
      .fidelity-bar-portrait {
        width: 32px; height: 32px;
        border-radius: 50%; border: 2px solid;
        object-fit: cover;
        flex: 0 0 auto;
      }
      .fidelity-bar-meta { flex: 1 1 auto; min-width: 0; }
      .fidelity-bar-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .fidelity-bar-note {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 11px; color: var(--mid);
        margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .fidelity-bar-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px; font-weight: 600;
        color: var(--ink);
        flex: 0 0 auto;
      }
      .fidelity-bar-track {
        height: 4px;
        background: rgba(26,22,20,0.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .fidelity-bar-fill {
        height: 100%;
        transition: width 0.6s ease;
      }

      .report-move {
        margin-bottom: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-move-quote {
        font-family: 'Fraunces', serif;
        font-size: 18px; line-height: 1.4;
        font-style: italic;
        color: var(--ink);
        margin: 12px 0 8px;
        padding-left: 16px;
        border-left: 3px solid var(--ink);
        font-variation-settings: "opsz" 30;
      }
      .report-move-credit {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px; letter-spacing: 0.05em;
        color: var(--mid);
      }
      .report-move-credit em {
        font-family: 'Fraunces', serif;
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
        font-size: 13px;
        color: var(--mid);
      }

      .report-open {
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .report-open-rows {
        display: grid; gap: 10px;
        margin-top: 12px;
      }
      .report-open-row {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px;
        align-items: baseline;
      }
      @media (max-width: 720px) {
        .report-open-row { grid-template-columns: 1fr; gap: 2px; }
      }
      .report-open-name {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .report-open-row em {
        font-family: 'Fraunces', serif; font-style: italic;
        font-size: 14px; line-height: 1.5;
        color: var(--ink);
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AnatomyOfAdvertising />);
</script>
</body>
</html>
